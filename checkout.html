<style>
:root {
  --brand:#6C3BF0; --brand-2:#8B5CF6; --brand-spark:#E8A33D; --brand-soft:#EFE9FD;
  --brand-soft-2:#F5F1FE; --brand-ink:#4A1FB8;
  --bg:#F5F6FA; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F3F8; --surface-3:#E9EBF2;
  --ink:#0E1020; --ink-2:#2A2F42; --muted:#5F6579; --line:#E4E6EE; --line-2:#D2D5DF;
  --good:#16A34A; --warn:#D97706; --danger:#DC2626;
  --t1:#EEF0F7; --t2:#F4EFFA; --t3:#E8F2F6; --t4:#F7EFF4; --t5:#F7F2E6;
  --topbar-line:#EDEAF6; --topbar-ink:#6B6F85; --topbar-ink-strong:#2A2F42;
  --nav-ink:#3A3F55; --search-border:#E4E1F0;
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-15:15px; --fs-16:16px;
  --fs-18:18px; --fs-22:22px; --fs-28:28px;
  --fs-display:clamp(28px,5vw,52px); --fs-h2:clamp(20px,2.6vw,30px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --radius-card:16px; --radius-ctrl:12px; --radius-pill:999px;
  --gutter:16px; --maxw:1280px;
  --font-display:'Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 6px 20px rgba(15,23,42,.08);
  --shadow-lg:0 20px 50px rgba(15,23,42,.12);
}
@media (min-width:760px){ :root{ --gutter:24px; } }
[data-theme="dark"]{
  --bg:#0B0B14; --bg-2:#0F0F1A; --surface:#14141F; --surface-2:#1B1B29; --surface-3:#232333;
  --ink:#F4F5F8; --ink-2:#C7CBD6; --muted:#8A90A2; --line:#262637; --line-2:#33334A;
  --topbar-line:#262637; --topbar-ink:#8A90A2; --topbar-ink-strong:#F4F5F8;
  --nav-ink:#C7CBD6; --search-border:#33334A;
  --t1:#1B1B2E;--t2:#2A1F3D;--t3:#182B3A;--t4:#2F1F2E;--t5:#2B2418;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-padding-top:170px; overflow-x:clip; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:var(--fs-15); line-height:1.55; min-height:100dvh;
  -webkit-font-smoothing:antialiased; overflow-x:clip; overflow-wrap:anywhere;
  padding-left:env(safe-area-inset-left,0); padding-right:env(safe-area-inset-right,0); }
img,svg{ max-width:100%; display:block; }
h1,h2,h3,h4,h5{ font-family:var(--font-display); font-weight:800; line-height:1.15;
  margin:0 0 var(--sp-3); letter-spacing:-0.02em; color:var(--ink); overflow-wrap:break-word; }
h1{ font-size:var(--fs-display); font-weight:900; }
h2{ font-size:var(--fs-h2); }
h3{ font-size:var(--fs-22); }
p{ margin:0 0 var(--sp-3); color:var(--ink-2); overflow-wrap:break-word; }
a{ color:var(--brand); text-decoration:none; transition:color .15s ease; }
a:hover{ color:var(--brand-2); text-decoration:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:6px; }
.wrap{ width:100%; max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gutter); }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.mono{ font-family:var(--font-mono); font-feature-settings:"tnum" 1; }
.muted{ color:var(--muted); }
[data-placeholder]{ opacity:.55; cursor:not-allowed; pointer-events:none;
  text-decoration:line-through; text-decoration-color:var(--muted); }
.skip-link{ position:absolute; left:8px; top:-60px; z-index:20000;
  background:var(--brand); color:#fff; padding:10px 16px; border-radius:0 0 10px 10px;
  font-weight:700; font-size:14px; transition:top .15s ease; }
.skip-link:focus{ top:0; color:#fff; }

#siteHeader{ position:sticky; position:-webkit-sticky; top:0; z-index:9999;
  background:#FFFFFF; transition:box-shadow .2s ease; }
[data-theme="dark"] #siteHeader{ background:#0F0F1A; }
#siteHeader:not(.is-stuck){ box-shadow:0 1px 0 var(--topbar-line); }
#siteHeader.is-stuck{ box-shadow:0 1px 0 var(--topbar-line), 0 8px 24px rgba(108,59,240,.10); }
.j-topbar{ background:#FFFFFF; color:var(--topbar-ink);
  border-bottom:1px solid var(--topbar-line); height:36px; display:flex; align-items:center;
  font-size:11px; font-weight:600; letter-spacing:0.06em; }
[data-theme="dark"] .j-topbar{ background:#0F0F1A; }
.j-topbar__inner{ display:flex; align-items:center; justify-content:space-between; gap:22px; width:100%; }
.j-topbar__links, .j-topbar__right{ display:flex; align-items:center; gap:18px; }
.j-topbar a{ color:var(--topbar-ink); display:inline-flex; align-items:center; gap:6px;
  text-transform:uppercase; transition:color .15s ease; white-space:nowrap; }
.j-topbar a:hover{ color:var(--brand); text-decoration:none; }
.j-topbar__sep{ width:1px; height:12px; background:var(--topbar-line); display:inline-block; flex:0 0 1px; }
.j-topbar__cart{ color:var(--brand) !important; background:var(--brand-soft);
  padding:4px 10px; border-radius:6px; font-weight:700; }
.j-topbar__cart .count{ font-family:var(--font-mono); }
@media (max-width:900px){ .j-topbar__links > *:not(:first-child){ display:none; } }
@media (max-width:640px){
  .j-topbar{ font-size:10.5px; letter-spacing:0.04em; }
  .j-topbar__links > a:nth-of-type(n+3),
  .j-topbar__links > .j-topbar__sep:nth-of-type(n+2){ display:none; }
  .j-topbar__right > a:not(:first-child):not(.j-topbar__cart),
  .j-topbar__right > .j-topbar__sep{ display:none; }
  .j-topbar__links, .j-topbar__right{ gap:12px; }
}
.j-main{ background:#FFFFFF; border-bottom:1px solid var(--topbar-line); padding-block:14px; }
[data-theme="dark"] .j-main{ background:#0F0F1A; }
.j-main__inner{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:26px; }
@media (max-width:900px){ .j-main__inner{ grid-template-columns:auto 1fr; gap:14px; } }
.j-brand{ display:flex; align-items:center; gap:12px; color:var(--topbar-ink-strong);
  text-decoration:none; min-width:0; }
.j-brand__mark{ width:42px; height:42px; border-radius:12px;
  background:linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
  display:grid; place-items:center; flex:0 0 42px;
  box-shadow:0 2px 8px rgba(108,59,240,.22); }
.j-brand__mark svg{ width:24px; height:24px; color:#fff; }
.j-brand__text{ display:flex; flex-direction:column; min-width:0; }
.j-brand__name{ font-family:var(--font-display); font-weight:900; font-size:20px;
  letter-spacing:-0.02em; line-height:1.05; color:var(--topbar-ink-strong);
  text-transform:uppercase; white-space:nowrap; }
.j-brand__tag{ font-size:10px; font-weight:700; letter-spacing:0.14em;
  color:var(--brand); text-transform:uppercase; margin-top:3px; white-space:nowrap; }
@media (max-width:520px){
  .j-brand__mark{ width:36px; height:36px; flex:0 0 36px; border-radius:10px; }
  .j-brand__mark svg{ width:20px; height:20px; }
  .j-brand__name{ font-size:16px; }
  .j-brand__tag{ font-size:9px; letter-spacing:0.1em; }
}
.j-search{ display:flex; align-items:stretch; height:46px; background:#FFFFFF;
  border:1px solid var(--search-border); border-radius:12px; overflow:hidden; min-width:0;
  transition:border-color .15s ease, box-shadow .15s ease; }
[data-theme="dark"] .j-search{ background:#1B1B29; }
.j-search:focus-within{ border-color:var(--brand); box-shadow:0 0 0 4px rgba(108,59,240,.10); }
.j-search svg{ align-self:center; margin-left:16px; color:var(--brand); flex:0 0 18px; opacity:.85; }
.j-search input{ flex:1; border:0; outline:0; background:transparent;
  padding:0 14px; font-size:14px; min-width:0; color:var(--ink); }
.j-search button{ background:var(--brand); color:#fff; border:0; padding:0 28px;
  font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;
  transition:background .15s ease; }
@media (max-width:640px){ .j-search button{ padding:0 16px; font-size:13px; } .j-search svg{ margin-left:12px; } }
.j-actions{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
@media (max-width:900px){ .j-actions{ grid-column:1/-1; justify-content:space-between; gap:4px; margin-top:4px; } }
.j-action{ display:inline-flex; align-items:center; gap:8px; color:var(--nav-ink);
  font-weight:600; font-size:13.5px; padding:9px 12px; border-radius:10px;
  transition:color .15s ease, background .15s ease; }
.j-action:hover{ color:var(--brand); background:var(--brand-soft); text-decoration:none; }
.j-action svg{ flex:0 0 20px; color:currentColor; }
.j-cart{ position:relative; background:var(--brand); color:#fff !important;
  padding:10px 16px; border-radius:10px; box-shadow:0 2px 8px rgba(108,59,240,.22); }
.j-cart:hover{ background:#5A2FE0; color:#fff !important; }
.j-cart .icon-badge{ position:absolute; top:-6px; right:-6px;
  min-width:20px; height:20px; padding:0 5px; border-radius:999px;
  background:#FFFFFF; color:var(--brand); font-family:var(--font-mono);
  font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center;
  border:2px solid var(--brand); box-shadow:0 1px 4px rgba(108,59,240,.25); }
.j-cart .icon-badge[hidden]{ display:none; }
.j-menu-btn{ display:none; width:42px; height:42px; border:1px solid var(--search-border);
  background:#FFFFFF; border-radius:10px; align-items:center; justify-content:center;
  cursor:pointer; color:var(--nav-ink); }
[data-theme="dark"] .j-menu-btn{ background:#1B1B29; }
.j-menu-btn:hover{ border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }
@media (max-width:900px){ .j-menu-btn{ display:inline-flex; } }
.j-cats{ background:#FFFFFF; border-bottom:1px solid var(--topbar-line); }
[data-theme="dark"] .j-cats{ background:#0F0F1A; }
.j-cats__scroll{ display:flex; align-items:center; gap:4px; padding-block:8px; overflow-x:auto;
  scrollbar-width:none; -ms-overflow-style:none; -webkit-overflow-scrolling:touch; }
.j-cats__scroll::-webkit-scrollbar{ display:none; }
.j-cats a{ display:inline-flex; align-items:center; gap:8px; padding:8px 14px;
  color:var(--nav-ink); font-size:13px; font-weight:600; white-space:nowrap;
  border-radius:8px; flex:0 0 auto; transition:color .15s ease, background .15s ease; }
.j-cats a:hover{ color:var(--brand); background:var(--brand-soft); text-decoration:none; }
.j-cats a svg{ flex:0 0 18px; color:currentColor; opacity:.85; }
@media (max-width:640px){ .j-cats a{ padding:7px 11px; font-size:12.5px; gap:6px; } }
.drawer{ position:fixed; inset:0; z-index:10000; display:none; }
.drawer[data-open="true"]{ display:block; }
.drawer__scrim{ position:absolute; inset:0; background:rgba(30,20,70,.45); backdrop-filter:blur(2px); }
.drawer__panel{ position:absolute; top:0; left:0; bottom:0; width:min(320px,88vw); background:#FFFFFF;
  border-right:1px solid var(--topbar-line); box-shadow:0 20px 50px rgba(108,59,240,.12);
  padding:var(--sp-5); display:flex; flex-direction:column; gap:var(--sp-3); overflow-y:auto;
  transform:translateX(-100%); animation:drawer-in .2s ease forwards; }
[data-theme="dark"] .drawer__panel{ background:#0F0F1A; }
@keyframes drawer-in{ to{ transform:translateX(0); } }
.drawer__close{ align-self:flex-end; width:40px; height:40px; border:1px solid var(--search-border);
  background:#FFFFFF; border-radius:10px; cursor:pointer; color:var(--nav-ink);
  display:grid; place-items:center; }
[data-theme="dark"] .drawer__close{ background:#1B1B29; }
.drawer__close:hover{ border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }
.drawer__nav{ display:flex; flex-direction:column; gap:2px; margin-top:var(--sp-3); }
.drawer__link{ display:flex; align-items:center; padding:12px; border-radius:10px;
  color:var(--nav-ink); font-weight:600; font-size:15px;
  transition:color .15s ease, background .15s ease; }
.drawer__link:hover{ background:var(--brand-soft); color:var(--brand); }
.drawer__group{ display:flex; flex-direction:column; }
.drawer__toggle{ display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:12px; border-radius:10px; color:var(--nav-ink); font-weight:600; font-size:15px;
  background:transparent; border:0; cursor:pointer; text-align:left; width:100%;
  font-family:var(--font-body); }
.drawer__toggle:hover{ background:var(--brand-soft); color:var(--brand); }
.drawer__toggle[aria-expanded="true"]{ background:var(--brand-soft); color:var(--brand); }
.drawer__toggle .chev{ flex:0 0 auto; opacity:.6; transition:transform .2s ease, opacity .15s ease; }
.drawer__toggle[aria-expanded="true"] .chev{ transform:rotate(180deg); opacity:1; }
.drawer__sub-list{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease; overflow:hidden; }
.drawer__sub-list.is-open{ grid-template-rows:1fr; }
.drawer__sub-list > div{ overflow:hidden; display:flex; flex-direction:column; gap:2px; }
.drawer__sub{ display:block; padding:9px 12px 9px 26px; border-radius:8px;
  color:var(--topbar-ink); font-weight:500; font-size:14px;
  transition:color .15s ease, background .15s ease; }
.drawer__sub:hover{ background:var(--brand-soft); color:var(--brand); }
.drawer__sub--nested{ padding-left:42px; font-size:13.5px; }
.drawer__sub--all{ padding-left:26px; color:var(--brand); font-weight:600; margin-top:2px; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2);
  min-height:44px; padding:11px 22px; border-radius:var(--radius-ctrl);
  border:1px solid transparent; background:var(--surface); color:var(--ink);
  font-family:var(--font-body); font-weight:600; font-size:var(--fs-14); line-height:1;
  cursor:pointer; text-decoration:none; -webkit-tap-highlight-color:transparent; white-space:nowrap;
  transition:transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease; }
.btn:active{ transform:translateY(1px); }
.btn--primary{ background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
  color:#fff; border-color:transparent; box-shadow:0 4px 14px rgba(108,59,240,.22); }
.btn--primary:hover{ background:linear-gradient(135deg,#5A2FE0 0%,#7B4CF0 100%);
  color:#fff; box-shadow:0 6px 20px rgba(108,59,240,.32); }
.btn--outline{ background:var(--surface); color:var(--ink); border-color:var(--line-2); }
.btn--outline:hover{ border-color:var(--brand); color:var(--brand); }
.btn--lg{ min-height:50px; padding:14px 26px; font-size:var(--fs-15); }
.btn--block{ width:100%; }
.btn[disabled]{ opacity:.55; cursor:not-allowed; }

.site-footer{ margin-top:var(--sp-12); background:var(--bg-2); border-top:1px solid var(--line);
  padding-block:var(--sp-12) var(--sp-6); color:var(--muted); font-size:var(--fs-14);
  padding-bottom:calc(var(--sp-6) + env(safe-area-inset-bottom,0px)); }
.site-footer__grid{ display:grid; gap:var(--sp-8); grid-template-columns:1fr; }
@media (min-width:760px){ .site-footer__grid{ grid-template-columns:1.6fr 1fr 1fr 1fr; } }
.site-footer h5{ color:var(--ink); font-size:var(--fs-13); font-weight:700;
  margin-bottom:var(--sp-4); text-transform:uppercase; letter-spacing:0.06em; }
.site-footer a{ display:block; padding:5px 0; color:var(--muted); font-size:var(--fs-14); }
.site-footer a:hover{ color:var(--brand); }
.site-footer a.footer-inline{ display:inline; padding:0; }
.site-footer__brand{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-4); }
.site-footer__brand .j-brand__mark{ width:36px; height:36px; flex:0 0 36px; border-radius:10px; }
.site-footer__brand .j-brand__mark svg{ width:20px; height:20px; }
.site-footer__name{ font-family:var(--font-display); font-weight:900; font-size:var(--fs-16);
  color:var(--ink); line-height:1.1; }
.site-footer__tag{ font-size:10px; font-weight:700; letter-spacing:0.08em;
  color:var(--brand); text-transform:uppercase; margin-top:2px; }
.site-footer__bottom{ margin-top:var(--sp-10); padding-top:var(--sp-4); border-top:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:var(--sp-3); justify-content:space-between; font-size:var(--fs-12); }
.site-footer__pay{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.pay-badge{ padding:6px 12px; border-radius:8px; background:var(--surface-2);
  border:1px solid var(--line); font-size:11px; font-weight:700; color:var(--ink); letter-spacing:0.02em; }

.wa-float{ position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0));
  z-index:1500; display:inline-flex; align-items:center; gap:10px;
  padding:12px 20px 12px 12px; background:#25D366; color:#fff;
  border-radius:var(--radius-pill); text-decoration:none; font-weight:600; font-size:14px;
  box-shadow:0 14px 32px rgba(37,211,102,.40), 0 4px 10px rgba(0,0,0,.10); }
.wa-float:hover{ transform:translateY(-2px) scale(1.02); background:#1EBE5D; color:#fff; }
.wa-float__icon{ width:36px; height:36px; border-radius:50%;
  background:rgba(255,255,255,.18); display:grid; place-items:center; flex:0 0 36px; }
.wa-float__icon svg{ width:22px; height:22px; color:#fff; }
.wa-float__text{ white-space:nowrap; font-weight:700; font-size:14px; }
@media (max-width:600px){
  .wa-float{ padding:0; width:56px; height:56px; justify-content:center; border-radius:50%; }
  .wa-float__icon{ background:transparent; width:auto; height:auto; flex:0 0 auto; }
  .wa-float__icon svg{ width:32px; height:32px; }
  .wa-float__text{ display:none; }
}
.toast-stack{ position:fixed; left:50%; bottom:max(16px, calc(16px + env(safe-area-inset-bottom, 0px)));
  transform:translateX(-50%); z-index:3000; display:flex; flex-direction:column; gap:8px;
  width:min(92vw,380px); pointer-events:none; }
.toast{ background:var(--ink); color:#fff; padding:12px 16px; border-radius:var(--radius-ctrl);
  font-size:var(--fs-14); font-weight:500; box-shadow:var(--shadow-lg);
  animation:toast-in .18s ease; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.toast--good{ background:var(--good); color:#fff; }
.toast--warn{ background:var(--warn); color:#fff; }
.toast a{ color:#fff; font-weight:700; text-decoration:underline;
  font-size:var(--fs-13); pointer-events:auto; }
@keyframes toast-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

.checkout-page{ padding-block:var(--sp-5) var(--sp-12); }
.crumbs{ display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  font-size:var(--fs-13); color:var(--muted); margin-bottom:var(--sp-4); }
.crumbs a{ color:var(--muted); }
.crumbs a:hover{ color:var(--brand); }
.crumbs .sep{ opacity:.5; }
.crumbs strong{ color:var(--ink); font-weight:600; }
.page-head{ margin-bottom:var(--sp-5); }
.page-head h1{ margin:0 0 6px; font-size:clamp(24px,3.6vw,38px); font-weight:900; letter-spacing:-0.025em; }
.page-head p{ color:var(--muted); margin:0; font-size:var(--fs-14); }

.checkout-layout{ display:grid; grid-template-columns:1fr; gap:var(--sp-5); align-items:start; }

/* ----------------------------------------------------------------
   KE.cart — v2 read-only here.
   Checkout only READS the cart. Mutations happen on shop/cart pages.
   ---------------------------------------------------------------- */
KE.cart = (function(){
  const KEY = 'kaka:cart:v2';
  const read = () => {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY)) || {};
      return Array.isArray(raw.lines) ? raw : { lines: [] };
    } catch { return { lines: [] }; }
  };
  const unitsInLine  = l => (Number(l.qtyPacks) || 0) * (Number(l.unitsPerPackage) || 0);
  const lineTotalVal = l => (Number(l.qtyPacks) || 0) * (Number(l.pricePerPackage) || 0);
  return {
    lines: () => read().lines,
    count: () => read().lines.reduce((s, l) => {
      if (!l.pkgKey) return s + 1;
      const u = unitsInLine(l);
      return s + (u > 0 ? u : 0);
    }, 0),
    subtotal: () => read().lines.reduce((s, l) => s + lineTotalVal(l), 0),
    hasPending: () => read().lines.some(l => !l.pkgKey),
    clear() { try { localStorage.setItem(KEY, JSON.stringify({ lines: [] })); } catch {} }
  };
})();

KE.toast = function(msg, kind = ''){
  const stack = document.getElementById('toastStack'); if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s ease, transform .2s ease';
    el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 240);
  }, 2400);
};

function bindDrawer(){
  const drawer = document.getElementById('navDrawer');
  const openBtn = document.getElementById('menuBtn');
  if (!drawer || !openBtn) return;
  const open = () => {
    drawer.setAttribute('data-open','true');
    openBtn.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
  };
  const close = () => {
    drawer.setAttribute('data-open','false');
    openBtn.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
  };
  openBtn.addEventListener('click', open);
  drawer.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  drawer.querySelectorAll('.drawer__toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const isOpen = btn.getAttribute('aria-expanded') === 'true';
      const list = document.getElementById(btn.getAttribute('aria-controls'));
      btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      if (list) list.classList.toggle('is-open', !isOpen);
    });
  });
  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.getAttribute('data-open') === 'true') close();
  });
}

  deliveryFeeFor(stateKey, subtotal) {
    if (subtotal === 0) return 0;
    if (subtotal >= KE.CONFIG.freeDeliveryFrom) return 0;
    const zone = KE.CONFIG.deliveryZones[stateKey];
    if (!zone) return 0; /* No state selected → no fee (display "Select state") */
    return zone.fee;

  render() {
    const lines = KE.cart.lines();
    const subtotal = KE.cart.subtotal();
    const root = document.getElementById('checkoutRoot');

    if (this.state.placed) {
      this.renderSuccess(root, subtotal);

      root.innerHTML = `

                <div class="payment-option__text">
                  <span class="payment-option__label">Bank transfer</span>
                  <p class="payment-option__hint">We'll send account details via WhatsApp once your order is confirmed.</p>
                </div>
              </label>
              <label class="payment-option ${this.state.payment === 'card' ? 'is-selected' : ''}">
                <input type="radio" name="payment" value="card" ${this.state.payment === 'card' ? 'checked' : ''} />
                <div class="payment-option__text">
                  <span class="payment-option__label">Card / Paystack</span>
                  <p class="payment-option__hint">Secure payment link will be sent after we confirm availability.</p>
                </div>
              </label>
              <label class="payment-option ${this.state.payment === 'pod' ? 'is-selected' : ''}">
                <input type="radio" name="payment" value="pod" ${this.state.payment === 'pod' ? 'checked' : ''} />
                <div class="payment-option__text">
                  <span class="payment-option__label">Pay on delivery</span>
                  <p class="payment-option__hint">Available within Aba and surrounding areas only.</p>
                </div>
              </label>
            </div>
          </section>

          <button class="btn btn--primary btn--lg btn--block" type="submit">
            Place order ${ICON.arrowRight}
          </button>
        </form>

        <aside class="checkout-summary" aria-label="Order summary">
          <h2>Order summary</h2>
          <div class="summary-items">${summaryLines}</div>
          <div class="summary-rows">
            <div class="summary-row">
              <span class="label">Subtotal</span>
              <span class="value">${KE.money(subtotal)}</span>
            </div>
            <div class="summary-row">
              <span class="label">Delivery${this.state.state ? ` (${KE.esc(KE.CONFIG.deliveryZones[this.state.state]?.name || '')})` : ''}</span>
              <span class="value">
                ${delivery == null
                  ? '<span class="muted">Select state</span>'
                  : (delivery === 0 ? '<span class="summary-free">FREE</span>' : KE.money(delivery))}
              </span>
            </div>
            ${delivery == null
              ? `<p class="summary-hint">Select your delivery state to see the exact delivery fee.</p>`
              : ''}
            <div class="summary-row summary-row--total">
              <span class="label">Total</span>
              <span class="value">${total == null ? KE.money(subtotal) + ' + delivery' : KE.money(total)}</span>
            </div>
          </div>
        </aside>
      </div>
    `;

    this.bindForm();
  },

  bindForm() {
    const form = document.getElementById('checkoutForm');
    if (!form) return;
    const nameEl = document.getElementById('co-name');
    const phoneEl = document.getElementById('co-phone');
    const emailEl = document.getElementById('co-email');
    const stateEl = document.getElementById('co-state');
    const cityEl = document.getElementById('co-city');
    const addressEl = document.getElementById('co-address');

    [nameEl, phoneEl, emailEl, cityEl, addressEl].forEach(el => {
      if (!el) return;
      el.addEventListener('input', () => {
        this.state[el.id.replace('co-', '').replace('-', '')] = el.value;
      });
    });
    if (stateEl) {
      stateEl.addEventListener('change', () => {
        this.state.state = stateEl.value;
        this.render();
      });
    }
    document.querySelectorAll('input[name="payment"]').forEach(input => {
      input.addEventListener('change', () => {
        this.state.payment = input.value;
        document.querySelectorAll('.payment-option').forEach(opt => {
          opt.classList.toggle('is-selected', opt.querySelector('input').checked);
        });
      });
    });

    const V = {
      name: () => this.state.name.trim().length >= 2 ? '' : 'Enter your full name.',
      phone: () => /^[0-9+\-\s()]{10,}$/.test(this.state.phone.trim()) ? '' : 'Enter a valid phone number.',
      email: () => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(this.state.email.trim()) ? '' : 'Enter a valid email address.',
      state: () => this.state.state ? '' : 'Select a delivery state.',
      city: () => this.state.city.trim().length >= 2 ? '' : 'Enter your city or town.',
      address: () => this.state.address.trim().length >= 10 ? '' : 'Enter your full delivery address (at least 10 characters).'
    };
    const showError = (id, msg) => {
      const err = document.getElementById('err-' + id);
      const el = document.getElementById('co-' + id);
      if (err){ err.textContent = msg; err.classList.toggle('is-visible', !!msg); }
      if (el){ if (msg) el.setAttribute('aria-invalid','true'); else el.removeAttribute('aria-invalid'); }
    };
    const touched = new Set();
    Object.entries({ name: nameEl, phone: phoneEl, email: emailEl, state: stateEl, city: cityEl, address: addressEl }).forEach(([key, el]) => {
      if (!el) return;
      el.addEventListener('blur', () => {
        touched.add(key);
        showError(key, V[key]());
      });
    });

    form.addEventListener('submit', e => {
      e.preventDefault();

      /* Final cart validation */
      if (KE.cart.hasPending()) {
        KE.toast('Some items still need a package — returning to cart', 'warn');
        setTimeout(() => { window.location.href = 'cart.html'; }, 900);
        return;
      }
      const liveLines = KE.cart.lines();
      for (const line of liveLines) {
        const p = KE.findProduct(line.slug);
        if (!p) { KE.toast('A product in your cart is no longer available', 'warn'); return; }
        const totalForProduct = liveLines.filter(l => l.slug === line.slug)
          .reduce((s, l) => s + (l.qtyPacks || 0) * (l.unitsPerPackage || 0), 0);
        if (totalForProduct > p.stock) {
          KE.toast(`${p.name} exceeds available stock — adjust in cart`, 'warn');
          return;
        }
      }

      const invalid = [];
      Object.keys(V).forEach(key => {
        touched.add(key);
        const msg = V[key]();
        showError(key, msg);
        if (msg) invalid.push(key);
      });
      if (invalid.length){
        const first = document.getElementById('co-' + invalid[0]);
        if (first) {
          first.focus();
          const y = first.getBoundingClientRect().top + window.scrollY - 200;
          window.scrollTo({ top: y < 0 ? 0 : y, behavior: 'smooth' });
        }
        KE.toast(invalid.length + ' field' + (invalid.length > 1 ? 's' : '') + ' need attention', 'warn');
        return;
      }

      const subtotalNow = KE.cart.subtotal();
      const deliveryNow = this.deliveryFeeFor(this.state.state, subtotalNow);
      const totalNow = subtotalNow + deliveryNow;

      const ref = 'KE-ORD-' +
        new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' +
        Math.random().toString(36).slice(2,6).toUpperCase();

      this.state.orderRef = ref;
      this.state.placed = true;
      this.state._orderData = { subtotal: subtotalNow, delivery: deliveryNow, total: totalNow };
      this.render();
    });
  },

  renderSuccess(root, subtotal) {
    const delivery = this.deliveryFeeFor(this.state.state, subtotal);
    const total = subtotal + delivery;
    const zone = KE.CONFIG.deliveryZones[this.state.state] || KE.CONFIG.deliveryZones.other;
    const paymentLabel = { transfer: 'Bank transfer', card: 'Card / Paystack', pod: 'Pay on delivery' }[this.state.payment] || 'Bank transfer';

    const lines = KE.cart.lines();
    const msgLines = [
      `🛒 New order ${this.state.orderRef}`,
      '',
      `👤 ${this.state.name}`,
      `📞 ${this.state.phone}`,
      `📧 ${this.state.email}`,
      '',
      `📍 Delivery address:`,
      `${this.state.address}`,
      `${this.state.city}, ${zone.name}`,
      '',
      `💳 Payment: ${paymentLabel}`,
      '',
      '📦 Items:'
    ];
    lines.forEach(line => {
      const p = KE.findProduct(line.slug);
      if (!p) return;
      const lineTotal = (line.qtyPacks || 0) * (line.pricePerPackage || 0);
      const totalUnits = (line.qtyPacks || 0) * (line.unitsPerPackage || 0);
      msgLines.push(`• ${p.name} — ${line.qtyPacks} × ${line.pkgLabel} (${totalUnits} items) — ${KE.money(lineTotal)}`);
    });
    msgLines.push('', `Subtotal: ${KE.money(subtotal)}`);
    msgLines.push(`Delivery: ${delivery === 0 ? 'FREE' : KE.money(delivery)}`);
    msgLines.push(`Total: ${KE.money(total)}`);
    msgLines.push('', `Estimated delivery: ${zone.days}`, '', 'Please confirm this order.');

    const waHref = `https://wa.me/${KE.CONFIG.business.whatsapp}?text=${encodeURIComponent(msgLines.join('\n'))}`;

    root.innerHTML = `
      <div class="checkout-success">
        <div class="checkout-success__icon">${ICON.check}</div>
        <h2>Order summary ready</h2>
        <div class="ref">Reference <b>${KE.esc(this.state.orderRef)}</b></div>
        <p>Send this order to our team on WhatsApp to confirm. We'll reply with the payment details and delivery timing.</p>
        <div class="checkout-success__actions">
          <a class="btn btn--primary btn--lg" href="${waHref}" target="_blank" rel="noopener noreferrer">Send order on WhatsApp</a>
          <button class="btn btn--outline btn--lg" type="button" id="copyOrder">Copy order details</button>
          <a class="btn btn--outline" href="shop.html" id="newOrder">Start a new order</a>
        </div>
        <p style="margin-top:var(--sp-5);font-size:12px;color:var(--muted);">
          Reference: <strong>${KE.esc(this.state.orderRef)}</strong> · Total: <strong>${KE.money(total)}</strong>
        </p>
      </div>`;

    const copyBtn = document.getElementById('copyOrder');
    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(msgLines.join('\n')); KE.toast('Order details copied', 'good'); }
        catch { KE.toast('Could not copy — select manually', 'warn'); }
      });
    }
    const newOrderBtn = document.getElementById('newOrder');
    if (newOrderBtn) {
      newOrderBtn.addEventListener('click', () => { KE.cart.clear(); });
    }
  }
};

document.addEventListener('DOMContentLoaded', () => {
  renderHeader();
  renderFooter();
  updateCartBadge();
  bindDrawer();
  bindHeaderSticky();
  CO.render();
  window.addEventListener('storage', e => {
    if (e.key === 'kaka:cart:v2') {
      updateCartBadge();
      if (!CO.state.placed) CO.render();
    }
  });
});
</script>
</body>
</html>
