<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Shop — KAKA ENTERPRISES</title>
<meta name="description" content="Browse the full KAKA ENTERPRISES catalogue — phone accessories, computer accessories, batteries, casings, audio and smart gadgets. Filter by category, brand and price." />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236C3BF0'/><path d='M 10 8 C 18 8, 22 12, 22 16 C 22 20, 18 24, 10 24' fill='none' stroke='%23ffffff' stroke-width='3.2' stroke-linecap='round'/><path d='M 10 16 L 16 16' fill='none' stroke='%23ffffff' stroke-width='3.2' stroke-linecap='round'/><circle cx='18' cy='16' r='2.2' fill='%23E8A33D'/></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --brand:#6C3BF0; --brand-2:#8B5CF6; --brand-spark:#E8A33D; --brand-soft:#EFE9FD;
  --wa:#25D366; --wa-2:#1EBE5D;
  --bg:#F5F6FA; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F3F8; --surface-3:#E9EBF2;
  --ink:#0E1020; --ink-2:#2A2F42; --muted:#5F6579; --line:#E4E6EE; --line-2:#D2D5DF;
  --good:#16A34A; --warn:#D97706; --danger:#DC2626;
  --t1:#EEF0F7; --t2:#F4EFFA; --t3:#E8F2F6; --t4:#F7EFF4; --t5:#F7F2E6;
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-15:15px; --fs-16:16px;
  --fs-18:18px; --fs-22:22px; --fs-28:28px;
  --fs-display:clamp(30px,5.5vw,58px); --fs-h2:clamp(20px,2.6vw,30px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --radius-card:16px; --radius-ctrl:12px; --radius-pill:999px;
  --gutter:16px; --maxw:1280px;
  --font-display:'Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 6px 20px rgba(15,23,42,.08);
  --shadow-lg:0 20px 50px rgba(15,23,42,.12);
}
@media (min-width:760px){ :root{ --gutter:24px; } }

[data-theme="dark"]{
  --bg:#0B0B14; --bg-2:#0F0F1A; --surface:#14141F; --surface-2:#1B1B29; --surface-3:#232333;
  --ink:#F4F5F8; --ink-2:#C7CBD6; --muted:#8A90A2; --line:#262637; --line-2:#33334A;
  --t1:#1B1B2E;--t2:#2A1F3D;--t3:#182B3A;--t4:#2F1F2E;--t5:#2B2418;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
  scroll-padding-top:120px;
  overflow-x:clip;
}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:var(--fs-15); line-height:1.55; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
img,svg{ max-width:100%; display:block; }
h1,h2,h3,h4,h5{ font-family:var(--font-display); font-weight:800; line-height:1.15;
  margin:0 0 var(--sp-3); letter-spacing:-0.02em; color:var(--ink); }
h1{ font-size:var(--fs-display); font-weight:900; }
h2{ font-size:var(--fs-h2); }
h3{ font-size:var(--fs-22); }
h5{ font-size:var(--fs-16); font-weight:700; }
p{ margin:0 0 var(--sp-3); color:var(--ink-2); }
a{ color:var(--brand); text-decoration:none; transition:color .15s ease; }
a:hover{ color:var(--brand-2); text-decoration:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:6px; }
.wrap{ width:100%; max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gutter); }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.mono{ font-family:var(--font-mono); font-feature-settings:"tnum" 1; }
.muted{ color:var(--muted); }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:0.01ms !important; transition-duration:0.01ms !important;
    scroll-behavior:auto !important; }
}

/* ============================================================
   STICKY HEADER (same pattern as homepage — works)
   ============================================================ */
.site-header-sticky{
  position:sticky;
  position:-webkit-sticky;
  top:0;
  z-index:999;
  background:#ffffff;
  border-bottom:1px solid #E4E6EE;
}
[data-theme="dark"] .site-header-sticky{
  background:#0F0F1A;
  border-bottom-color:#262637;
}
.site-header-sticky.is-stuck{ box-shadow:0 6px 18px rgba(15,23,42,.08); }

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar{ background:transparent; border-bottom:1px solid var(--line);
  font-size:var(--fs-12); color:var(--muted); }
.topbar__inner{ display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-3); padding-block:10px; flex-wrap:wrap; }
.topbar__left,.topbar__right{ display:flex; align-items:center; gap:var(--sp-5); flex-wrap:wrap; }
.topbar a{ color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
.topbar a:hover{ color:var(--ink); }
.topbar__center{ display:none; color:var(--ink-2); }
@media (min-width:900px){ .topbar__center{ display:inline-flex; align-items:center; gap:8px; } }
@media (max-width:640px){ .topbar__right a:not(:first-child){ display:none; } }

/* ============================================================
   MAIN HEADER
   ============================================================ */
.site-header__inner{ display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; gap:var(--sp-4); min-height:72px; padding-block:12px; }

.brand{ display:flex; align-items:center; gap:var(--sp-3); color:var(--ink); text-decoration:none; min-width:0; }
.brand:hover{ color:var(--ink); }
.brand__mark{ width:40px; height:40px; border-radius:12px;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
  display:grid; place-items:center; flex:0 0 40px; }
.brand__mark svg{ width:24px; height:24px; color:#fff; }
.brand__text{ display:flex; flex-direction:column; min-width:0; }
.brand__name{ font-family:var(--font-display); font-weight:900; font-size:17px;
  line-height:1.05; letter-spacing:-0.02em; color:var(--ink);
  white-space:nowrap; text-transform:uppercase; }
.brand__tag{ font-family:var(--font-body); font-size:10.5px; font-weight:700;
  letter-spacing:0.08em; color:var(--brand); text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
@media (min-width:900px){ .brand__name{ font-size:20px; } .brand__tag{ font-size:11px; } }
@media (max-width:420px){
  .brand__name{ font-size:14px; } .brand__tag{ font-size:9px; }
  .brand__mark{ width:34px; height:34px; flex:0 0 34px; } .brand__mark svg{ width:20px; height:20px; }
}

.site-nav{ display:none; }
@media (min-width:1000px){
  .site-nav{ display:flex; align-items:center; gap:var(--sp-6); grid-column:2/3; justify-self:start; }
  .site-nav > a{ color:var(--ink-2); font-weight:500; font-size:var(--fs-14);
    white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .site-nav > a:hover{ color:var(--brand); }
}

.site-search{ display:none; }
@media (min-width:1000px){ .site-search{ display:block; grid-column:3/4; width:320px; } }
.site-actions{ display:flex; align-items:center; gap:6px; grid-column:3/4; }
@media (min-width:1000px){ .site-actions{ grid-column:4/5; } }

.icon-btn{ position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:42px; height:42px; border:1px solid var(--line); background:var(--surface);
  border-radius:12px; cursor:pointer; color:var(--ink); transition:background .15s ease, color .15s ease; }
.icon-btn:hover{ background:var(--surface-2); color:var(--brand); }
.icon-btn--accent{ background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
  border-color:transparent; color:#fff; }
.icon-btn--accent:hover{ background:linear-gradient(135deg,#5A2FE0 0%,#7B4CF0 100%); color:#fff; }
.icon-badge{ position:absolute; top:-5px; right:-5px; min-width:18px; height:18px;
  padding:0 5px; border-radius:var(--radius-pill); background:var(--brand-spark); color:#1a1400;
  font-family:var(--font-mono); font-size:10.5px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; border:2px solid #ffffff; }
[data-theme="dark"] .icon-badge{ border-color:#0F0F1A; }
.icon-badge[hidden]{ display:none; }

.mobile-search{ grid-column:1/-1; order:5; margin-top:6px; }
@media (min-width:1000px){ .mobile-search{ display:none; } }

.search{ display:flex; align-items:center; gap:var(--sp-2);
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-pill); padding:0 6px 0 16px; height:42px; width:100%; }
.search:focus-within{ border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent); }
.search svg{ color:var(--muted); flex:0 0 18px; }
.search input{ border:0; outline:0; background:transparent; width:100%;
  font-size:var(--fs-14); min-width:0; color:var(--ink); }
.search input::placeholder{ color:var(--muted); }

@media (min-width:1000px){
  .icon-btn[data-desktop]{ display:inline-flex !important; }
  #menuBtn{ display:none; }
}
.icon-btn[data-desktop]{ display:none; }

/* ============================================================
   MEGA MENU (identical to homepage)
   ============================================================ */
.nav-item{ position:relative; }
.nav-trigger{ display:inline-flex; align-items:center; gap:6px; padding:8px 4px;
  color:var(--ink-2); font-weight:500; font-size:var(--fs-14);
  background:transparent; border:0; cursor:pointer; font-family:var(--font-body);
  white-space:nowrap; transition:color .15s ease; }
.nav-trigger:hover, .nav-trigger[aria-expanded="true"]{ color:var(--brand); }
.nav-trigger svg{ transition:transform .2s ease; }
.nav-trigger[aria-expanded="true"] svg{ transform:rotate(180deg); }

.nav-dropdown{
  position:absolute; top:calc(100% + 12px); left:50%;
  transform:translateX(-50%) translateY(-6px);
  width:920px; max-width:min(92vw, 920px);
  max-height:min(68vh, 520px);
  overflow-y:auto; scrollbar-gutter:stable;
  background:#ffffff; border:1px solid var(--line); border-radius:6px;
  box-shadow:0 20px 50px rgba(15,23,42,.14);
  padding:20px 24px 24px;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .16s ease, transform .16s ease, visibility 0s linear .16s;
  z-index:1000; overscroll-behavior:contain;
}
[data-theme="dark"] .nav-dropdown{ background:#14141F; }
.nav-item[data-open="true"] .nav-dropdown{
  opacity:1; visibility:visible; pointer-events:auto;
  transform:translateX(-50%) translateY(0);
  transition:opacity .16s ease, transform .16s ease, visibility 0s;
}
.nav-dropdown__grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px 24px; }
@media (max-width:1200px){ .nav-dropdown__grid{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
@media (max-width:900px){ .nav-dropdown__grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
.nav-dropdown__group{ display:flex; flex-direction:column; gap:2px; padding:4px 0; min-width:0; }
.nav-dropdown__label{ font-family:var(--font-mono); font-size:10.5px; font-weight:600;
  letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);
  padding:6px 6px 8px; margin:0; border-bottom:1px solid var(--line); margin-bottom:6px; }
.nav-dropdown a{ display:flex; align-items:center; gap:8px; padding:7px 6px;
  border-radius:4px; color:var(--ink-2); font-size:var(--fs-13); font-weight:500;
  transition:color .12s ease, background .12s ease, padding-left .12s ease; }
.nav-dropdown a:hover{ color:var(--brand); background:var(--brand-soft); padding-left:10px; }
.nav-dropdown__footer{ display:flex; align-items:center; justify-content:space-between;
  grid-column:1/-1; margin-top:20px; padding-top:16px;
  border-top:1px solid var(--line); color:var(--brand); font-weight:600;
  font-size:var(--fs-13); padding-inline:6px; }

/* ============================================================
   DRAWER (mobile menu)
   ============================================================ */
.drawer{ position:fixed; inset:0; z-index:2000; display:none; }
.drawer[data-open="true"]{ display:block; }
.drawer__scrim{ position:absolute; inset:0; background:rgba(15,23,42,.5); }
.drawer__panel{ position:absolute; top:0; left:0; bottom:0;
  width:min(320px,88vw); background:var(--bg-2); border-right:1px solid var(--line);
  box-shadow:var(--shadow-lg); padding:var(--sp-5); display:flex; flex-direction:column;
  gap:var(--sp-3); overflow-y:auto; transform:translateX(-100%);
  animation:drawer-in .2s ease forwards; }
@keyframes drawer-in{ to{ transform:translateX(0); } }
.drawer__close{ align-self:flex-end; width:40px; height:40px;
  border:1px solid var(--line); background:transparent;
  border-radius:var(--radius-ctrl); cursor:pointer; color:var(--ink); }
.drawer__nav{ display:flex; flex-direction:column; gap:2px; margin-top:var(--sp-3); }
.drawer__nav a{ padding:12px 12px; border-radius:var(--radius-ctrl);
  color:var(--ink-2); font-weight:600; font-size:var(--fs-15); }
.drawer__nav a:hover{ background:var(--surface-2); color:var(--brand); }
.drawer__nav a.drawer__sub{ padding:8px 12px 8px 28px; font-weight:500;
  font-size:var(--fs-14); color:var(--muted); }

/* ============================================================
   SHOP PAGE LAYOUT
   ============================================================ */
.page-head{ padding-block:var(--sp-6) var(--sp-4); }
.breadcrumb{
  display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  font-size:var(--fs-13); color:var(--muted); margin-bottom:var(--sp-3);
}
.breadcrumb a{ color:var(--muted); }
.breadcrumb a:hover{ color:var(--brand); }
.breadcrumb span.sep{ opacity:.5; }
.breadcrumb strong{ color:var(--ink); font-weight:600; }

.page-title{ margin:0 0 4px; font-size:var(--fs-28); font-weight:800; }
.page-sub{ color:var(--muted); margin:0; font-size:var(--fs-14); }

.shop-layout{
  display:grid;
  grid-template-columns:1fr;
  gap:var(--sp-6);
  padding-block:var(--sp-4) var(--sp-12);
}
@media (min-width:1000px){
  .shop-layout{ grid-template-columns:260px 1fr; gap:var(--sp-8); }
}

/* ============================================================
   FILTER SIDEBAR
   ============================================================ */
.filters{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-card); padding:var(--sp-5);
  align-self:start;
}
@media (min-width:1000px){
  .filters{ position:sticky; top:100px; max-height:calc(100vh - 120px); overflow-y:auto; }
}
.filters__head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:var(--sp-4);
}
.filters__head h3{ margin:0; font-size:var(--fs-18); }
.filters__clear{
  background:transparent; border:0; cursor:pointer;
  color:var(--brand); font-size:var(--fs-13); font-weight:600;
  padding:4px 6px; border-radius:6px;
}
.filters__clear:hover{ background:var(--brand-soft); }

.filter-group{
  padding-block:var(--sp-4);
  border-top:1px solid var(--line);
}
.filter-group:first-of-type{ border-top:0; padding-top:0; }
.filter-group h4{
  font-size:var(--fs-13); font-weight:700;
  text-transform:uppercase; letter-spacing:0.06em;
  color:var(--muted); margin:0 0 var(--sp-3);
}

.filter-list{
  display:flex; flex-direction:column; gap:2px;
  max-height:280px; overflow-y:auto;
  padding-right:4px;
}
.filter-list::-webkit-scrollbar{ width:6px; }
.filter-list::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:3px; }

.filter-opt{
  display:flex; align-items:center; gap:8px;
  padding:8px 10px; border-radius:8px;
  font-size:var(--fs-14); color:var(--ink-2);
  cursor:pointer; user-select:none;
  transition:background .12s ease, color .12s ease;
  text-align:left;
  background:transparent; border:0; width:100%;
}
.filter-opt:hover{ background:var(--surface-2); color:var(--ink); }
.filter-opt.is-active{
  background:var(--brand-soft); color:var(--brand); font-weight:600;
}
.filter-opt .count{
  margin-left:auto; font-family:var(--font-mono);
  font-size:var(--fs-11); color:var(--muted);
}
.filter-opt.is-active .count{ color:var(--brand); }
.filter-opt input[type="checkbox"]{
  width:16px; height:16px; accent-color:var(--brand);
  flex:0 0 16px; margin:0;
}
.filter-opt .swatch{
  width:12px; height:12px; border-radius:50%;
  background:var(--t2); flex:0 0 12px;
}

/* Sub-categories indented */
.filter-opt.is-sub{ padding-left:22px; font-size:var(--fs-13); }
.filter-opt.is-sub2{ padding-left:34px; font-size:var(--fs-13); color:var(--muted); }

/* Price range */
.price-range{ display:flex; flex-direction:column; gap:var(--sp-3); }
.price-inputs{ display:flex; align-items:center; gap:8px; }
.price-inputs input{
  width:100%; height:40px; padding:0 12px;
  border:1px solid var(--line); border-radius:10px;
  background:var(--surface); color:var(--ink);
  font-family:var(--font-mono); font-size:var(--fs-13);
  outline:0; min-width:0;
}
.price-inputs input:focus{ border-color:var(--brand); }
.price-inputs span{ color:var(--muted); }
.price-apply{
  height:36px; padding:0 14px; border-radius:10px;
  background:var(--brand); color:#fff; border:0;
  font-weight:600; font-size:var(--fs-13); cursor:pointer;
}
.price-apply:hover{ background:#5A2FE0; }

/* Toggle (in stock) */
.toggle{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 10px; border-radius:8px;
  cursor:pointer; user-select:none;
  font-size:var(--fs-14); color:var(--ink-2);
  background:transparent; border:0; width:100%;
}
.toggle:hover{ background:var(--surface-2); }
.toggle__switch{
  position:relative; width:36px; height:20px;
  background:var(--line-2); border-radius:999px;
  flex:0 0 36px;
  transition:background .15s ease;
}
.toggle__switch::after{
  content:""; position:absolute;
  top:2px; left:2px;
  width:16px; height:16px; border-radius:50%;
  background:#fff; transition:transform .15s ease;
}
.toggle.is-on .toggle__switch{ background:var(--brand); }
.toggle.is-on .toggle__switch::after{ transform:translateX(16px); }

/* ============================================================
   RESULTS AREA
   ============================================================ */
.results{ min-width:0; }

.results__bar{
  display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-3); margin-bottom:var(--sp-4); flex-wrap:wrap;
}
.results__count{
  font-size:var(--fs-14); color:var(--muted);
}
.results__count b{ color:var(--ink); font-weight:700; }

.results__controls{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
}

.select{
  height:40px; padding:0 34px 0 14px;
  background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235F6579' stroke-width='2' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 10px center / 14px 14px;
  border:1px solid var(--line); border-radius:10px;
  color:var(--ink); font-size:var(--fs-14); font-weight:500;
  cursor:pointer; outline:0;
  -webkit-appearance:none; appearance:none;
}
.select:focus{ border-color:var(--brand); }

.view-toggle{
  display:inline-flex; align-items:center;
  border:1px solid var(--line); border-radius:10px;
  overflow:hidden; background:var(--surface);
}
.view-toggle button{
  width:40px; height:40px; border:0;
  background:transparent; cursor:pointer;
  color:var(--muted); padding:0;
  display:grid; place-items:center;
}
.view-toggle button.is-active{ background:var(--brand-soft); color:var(--brand); }
.view-toggle button:hover{ color:var(--brand); }

/* Active filter chips */
.active-chips{
  display:flex; gap:6px; flex-wrap:wrap; margin-bottom:var(--sp-4);
}
.chip-active{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 10px 6px 12px;
  background:var(--brand-soft); color:var(--brand);
  border-radius:999px; font-size:var(--fs-13); font-weight:600;
}
.chip-active button{
  background:transparent; border:0; cursor:pointer;
  color:inherit; padding:0; width:16px; height:16px;
  border-radius:50%; display:grid; place-items:center;
  font-size:14px; line-height:1;
}
.chip-active button:hover{ background:color-mix(in srgb,var(--brand) 20%, transparent); }

/* ============================================================
   PRODUCT GRID & LIST
   ============================================================ */
.grid{
  display:grid; gap:var(--sp-4);
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
}
@media (min-width:640px){ .grid{ grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); } }
@media (min-width:1200px){ .grid{ grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); } }

.grid.is-list{ grid-template-columns:1fr; }

/* Card — same as homepage, plus list variant */
.card{
  display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-card); overflow:hidden;
  text-decoration:none; color:var(--ink); height:100%;
  position:relative;
  transition:transform .12s ease, border-color .12s ease;
}
.card:hover{
  transform:translateY(-3px);
  border-color:color-mix(in srgb,var(--brand) 35%,var(--line));
  text-decoration:none; color:var(--ink);
}
.card__media{ position:relative; aspect-ratio:1/1; background:var(--t1); overflow:hidden; }
.card__media img{ width:100%; height:100%; object-fit:cover; transition:transform .4s ease; }
.card:hover .card__media img{ transform:scale(1.05); }
.card__tag{ position:absolute; top:10px; left:10px;
  padding:4px 10px; border-radius:8px;
  font-size:10.5px; font-weight:700; letter-spacing:0.04em;
  text-transform:uppercase; color:#fff; }
.card__tag--sale{ background:var(--danger); }
.card__tag--new{ background:var(--good); }
.card__tag--popular{ background:var(--brand-spark); color:#1a1400; }
.card__body{ padding:var(--sp-4); display:flex; flex-direction:column;
  gap:6px; flex:1; }
.card__brand{ font-size:var(--fs-11); color:var(--muted);
  text-transform:uppercase; letter-spacing:0.06em; font-weight:600; }
.card__name{ font-family:var(--font-body); font-weight:600; font-size:var(--fs-14);
  line-height:1.35; margin:0; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; min-height:2.7em; }
.card__rating{ display:inline-flex; align-items:center; gap:4px;
  font-size:var(--fs-11); color:var(--muted); }
.card__rating .star{ color:var(--brand-spark); }
.card__price{ margin-top:auto; display:flex; align-items:baseline;
  gap:8px; flex-wrap:wrap; padding-top:var(--sp-2); }
.card__price .money{ font-size:var(--fs-16); font-weight:700; color:var(--ink); }
.card__price del{ color:var(--muted); font-size:var(--fs-13); }
.card__foot{ padding:0 var(--sp-4) var(--sp-4); display:flex; gap:8px; }
.card__foot .btn{ flex:1; }

/* List mode */
.grid.is-list .card{ flex-direction:row; align-items:stretch; }
.grid.is-list .card__media{ width:200px; aspect-ratio:1/1; flex:0 0 200px; }
.grid.is-list .card__body{ padding:var(--sp-5); }
.grid.is-list .card__foot{ padding:0; flex-direction:column; justify-content:center; padding-right:var(--sp-5); }
.grid.is-list .card__foot .btn{ min-width:140px; }
@media (max-width:640px){
  .grid.is-list .card{ flex-direction:column; }
  .grid.is-list .card__media{ width:100%; flex:auto; }
}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty{
  text-align:center; padding:var(--sp-16) var(--sp-5);
  border:1px dashed var(--line); border-radius:var(--radius-card);
  background:var(--surface);
}
.empty__icon{
  width:64px; height:64px; margin:0 auto var(--sp-4);

  display:grid; place-items:center;
}
.empty h3{ margin:0 0 8px; }
.empty p{ color:var(--muted); margin:0 0 var(--sp-4); }

/* ============================================================
   MOBILE FILTER BUTTON + DRAWER
   ============================================================ */
.filter-fab{
  display:none;
  position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom,0));
  z-index:1400;
  padding:12px 20px; border-radius:999px;
  background:var(--brand); color:#fff; border:0; cursor:pointer;
  font-weight:700; font-size:14px; gap:8px;

.filter-fab:hover{ background:#5A2FE0; }

/* ============================================================
   WHATSAPP FLOAT
   ============================================================ */
.wa-float{
  position:fixed; right:16px;

.wa-float__icon{

.wa-float__text{ white-space:nowrap; font-weight:700; font-size:14px; }

  .wa-float__text{ display:none; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{ display:inline-flex; align-items:center; justify-content:center;
  gap:var(--sp-2); min-height:44px; padding:11px 22px;

  background:var(--surface); color:var(--ink);

/* ---------- HELPERS ---------- */
KE.money = n => '₦' + (Number(n) || 0).toLocaleString('en-NG', { maximumFractionDigits: 0 });
KE.esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
KE.img = (id, w = 500) => {
  if (!id) return '';
  if (id.startsWith('assets/') || id.startsWith('http')) return id;
  return `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=70`;
};
KE.tierFor = q => KE.CONFIG.wholesale.find(t => q >= t.min && q <= t.max) || KE.CONFIG.wholesale[0];
KE.unitPrice = (p, q = 1) => Math.round(p.price * (1 - KE.tierFor(q).off));
KE.findProduct = slug => KE.PRODUCTS.find(p => p.slug === slug) || null;
KE.findBrand = slug => KE.BRANDS.find(b => b.slug === slug) || null;
KE.brandName = slug => KE.findBrand(slug)?.name || slug;

KE.findCategory = function(slug, list = KE.CATEGORIES){
  for (const c of list) {
    if (c.slug === slug) return c;
    if (c.children?.length) { const f = KE.findCategory(slug, c.children); if (f) return f; }
  }
  return null;
};
KE.productsInCategory = cat => KE.PRODUCTS.filter(p => p.categoryPath.includes(cat));

KE.cart = (function(){
  const KEY = 'kaka:cart:v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const write = c => {
    try { localStorage.setItem(KEY, JSON.stringify(c)); } catch {}
    document.dispatchEvent(new CustomEvent('cart:updated'));
  };
  return {
    items: () => read(),
    count: () => Object.values(read()).reduce((a,b) => a+b, 0),
    add(slug, qty = 1) {
      const p = KE.findProduct(slug); if (!p) return;
      const c = read(); c[slug] = Math.min((c[slug] || 0) + qty, p.stock); write(c);
    }
  };
})();

KE.toast = function(msg, kind = ''){
  const stack = document.getElementById('toastStack');
  if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s ease, transform .2s ease';
    el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 240);
  }, 2200);
};

function buildMegaMenu(){
  const groups = KE.CATEGORIES.filter(c => c.published).sort((a,b) => a.order - b.order).map(cat => {
    const subcats = (cat.children || []).filter(c => c.published).sort((a,b) => a.order - b.order);
    const links = [];
    subcats.forEach(sub => {
      links.push({ name: sub.name, url: 'shop.html?type=' + encodeURIComponent(sub.slug) });
      (sub.children || []).filter(c => c.published).forEach(nested => {
        links.push({ name: nested.name, url: 'shop.html?type=' + encodeURIComponent(nested.slug) });
      });
    });
    const shown = links.slice(0, 8);
    return `
      <div class="nav-dropdown__group">
        <p class="nav-dropdown__label">${KE.esc(cat.name)}</p>
        ${shown.map(l => `<a href="${l.url}" role="menuitem">${KE.esc(l.name)}</a>`).join('')}
        ${links.length > 8 ? `<a href="shop.html?cat=${encodeURIComponent(cat.slug)}" role="menuitem" style="color:var(--brand);font-weight:600;">See all →</a>` : ''}
      </div>`;
  }).join('');
  return `
    <div class="nav-item" data-dropdown>
      <button class="nav-trigger" type="button" aria-expanded="false" aria-haspopup="true">
        Categories ${ICON.chevron}
      </button>
      <div class="nav-dropdown" role="menu">
        <div class="nav-dropdown__grid">
          ${groups}
          <a class="nav-dropdown__footer" href="shop.html" role="menuitem">
            View all products
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
      </div>
    </div>`;
}

function buildDrawerNav(){
  let html = `
    <a href="shop.html">Shop all products</a>
    <a href="shop.html?tag=Sale">Deals</a>
    <a href="shop.html?sort=new">New Arrivals</a>
    <a href="brands.html">Brands</a>`;
  KE.CATEGORIES.filter(c => c.published).sort((a,b) => a.order - b.order).forEach(cat => {
    html += `<a href="shop.html?cat=${encodeURIComponent(cat.slug)}">${KE.esc(cat.name)}</a>`;
    (cat.children || []).filter(c => c.published).forEach(sub => {
      html += `<a class="drawer__sub" href="shop.html?type=${encodeURIComponent(sub.slug)}">— ${KE.esc(sub.name)}</a>`;
    });
  });
  return html;
}

function bindHeaderSearch(){
  ['#q', '#mq'].forEach(sel => {
    const el = document.querySelector(sel); if (!el) return;
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const q = el.value.trim();
        if (q) location.href = 'shop.html?q=' + encodeURIComponent(q);
      }
    });
  });
}

function bindDrawer(){
  const drawer = document.getElementById('navDrawer');
  const openBtn = document.getElementById('menuBtn');
  if (!drawer || !openBtn) return;
  const open  = () => { drawer.setAttribute('data-open','true');  openBtn.setAttribute('aria-expanded','true');  document.body.style.overflow = 'hidden'; };
  const close = () => { drawer.setAttribute('data-open','false'); openBtn.setAttribute('aria-expanded','false'); document.body.style.overflow = ''; };
  openBtn.addEventListener('click', open);
  drawer.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
}

function bindDropdowns(){
  const items = Array.from(document.querySelectorAll('.nav-item[data-dropdown]'));
  if (!items.length) return;
  let hoverTimer;
  const openItem  = it => { items.forEach(i => { if (i !== it) closeItem(i); }); it.setAttribute('data-open','true');  const t = it.querySelector('.nav-trigger'); if (t) t.setAttribute('aria-expanded','true'); };
  const closeItem = it => { it.setAttribute('data-open','false'); const t = it.querySelector('.nav-trigger'); if (t) t.setAttribute('aria-expanded','false'); };
  const closeAll  = () => items.forEach(closeItem);
  items.forEach(item => {
    const trigger = item.querySelector('.nav-trigger');
    trigger.addEventListener('click', e => {
      e.preventDefault();
      const open = item.getAttribute('data-open') === 'true';
      open ? closeItem(item) : openItem(item);
    });
    if (window.matchMedia('(hover: hover)').matches) {
      item.addEventListener('mouseenter', () => { clearTimeout(hoverTimer); hoverTimer = setTimeout(() => openItem(item), 80); });
      item.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); hoverTimer = setTimeout(() => closeItem(item), 150); });
    }
    item.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeItem(item); trigger.focus(); }
      if (e.key === 'ArrowDown' && document.activeElement === trigger) {
        e.preventDefault(); openItem(item);
        const first = item.querySelector('.nav-dropdown a'); if (first) first.focus();
      }
    });
    item.querySelectorAll('.nav-dropdown a').forEach(a => a.addEventListener('click', () => closeItem(item)));
    item.addEventListener('focusout', e => { if (!item.contains(e.relatedTarget)) closeItem(item); });
  });
  document.addEventListener('click', e => { if (!e.target.closest('.nav-item[data-dropdown]')) closeAll(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
}

function bindSticky(){
  const shell = document.getElementById('stickyShell');
  if (!shell) return;
  const onScroll = () => {
    if (window.scrollY > 4) shell.classList.add('is-stuck');
    else shell.classList.remove('is-stuck');
  };
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
}

/* ============================================================
   SHOP LOGIC — URL is the single source of truth
   ============================================================ */
const SHOP = {
  /* Read state from URL */
  readUrl() {
    const p = new URLSearchParams(location.search);
    return {
      cat:   p.get('cat')   || '',
      type:  p.get('type')  || '',
      brand: p.get('brand') || '',
      q:     p.get('q')     || '',
      sort:  p.get('sort')  || 'featured',
      tag:   p.get('tag')   || '',
      min:   p.get('min')   || '',
      max:   p.get('max')   || '',
      stock: p.get('stock') === '1',
      view:  p.get('view')  || 'grid'
    };
  },

  /* Write state back to URL (no page reload) */
  writeUrl(state) {
    const p = new URLSearchParams();
    if (state.cat)   p.set('cat', state.cat);
    if (state.type)  p.set('type', state.type);
    if (state.brand) p.set('brand', state.brand);
    if (state.q)     p.set('q', state.q);
    if (state.sort && state.sort !== 'featured') p.set('sort', state.sort);
    if (state.tag)   p.set('tag', state.tag);
    if (state.min)   p.set('min', state.min);
    if (state.max)   p.set('max', state.max);
    if (state.stock) p.set('stock', '1');
    if (state.view === 'list') p.set('view', 'list');
    const qs = p.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
  },

  /* Apply filters to full catalogue */
  filterProducts(state) {
    let list = KE.PRODUCTS.slice();

    /* Category: match if product categoryPath contains the slug */
    if (state.cat)  list = list.filter(p => p.categoryPath.includes(state.cat));
    if (state.type) list = list.filter(p => p.categoryPath.includes(state.type));

    if (state.brand) list = list.filter(p => p.brand === state.brand);
    if (state.tag)   list = list.filter(p => (p.tag || '').toLowerCase() === state.tag.toLowerCase());

    if (state.q) {
      const t = state.q.toLowerCase();
      list = list.filter(p =>
        p.name.toLowerCase().includes(t) ||
        (p.sku || '').toLowerCase().includes(t) ||
        (p.specs || []).some(([k,v]) => String(k).toLowerCase().includes(t) || String(v).toLowerCase().includes(t))
      );
    }

    if (state.min) list = list.filter(p => p.price >= Number(state.min));
    if (state.max) list = list.filter(p => p.price <= Number(state.max));

    if (state.stock) list = list.filter(p => p.stock > 0);

    /* Sort */
    switch (state.sort) {
      case 'low':     list.sort((a,b) => a.price - b.price); break;
      case 'high':    list.sort((a,b) => b.price - a.price); break;
      case 'popular': list.sort((a,b) => (b.rating||0) - (a.rating||0)); break;
      case 'new':     list.sort((a,b) => (b.tag === 'New' ? 1 : 0) - (a.tag === 'New' ? 1 : 0)); break;
      case 'name':    list.sort((a,b) => a.name.localeCompare(b.name)); break;
    }
    return list;
  },

  /* Render filter sidebar */
  renderFilters(state) {
    /* Categories — tree with 2 levels visible */
    const catHost = document.getElementById('filterCategories');
    const rows = [];

    rows.push(`<button class="filter-opt ${!state.cat && !state.type ? 'is-active' : ''}" data-filter="cat" data-value="">
      <span>All categories</span>
      <span class="count">${KE.PRODUCTS.length}</span>
    </button>`);

    KE.CATEGORIES.filter(c => c.published).sort((a,b) => a.order - b.order).forEach(cat => {
      const catCount = KE.productsInCategory(cat.slug).length;
      const active = state.cat === cat.slug && !state.type;
      rows.push(`<button class="filter-opt ${active ? 'is-active' : ''}" data-filter="cat" data-value="${cat.slug}">
        <span>${KE.esc(cat.name)}</span>
        <span class="count">${catCount}</span>
      </button>`);

      /* Show subs only if this cat is the currently active one, OR always for the two most popular */
      const showSubs = state.cat === cat.slug;
      if (showSubs) {
        (cat.children || []).filter(c => c.published).forEach(sub => {
          const subCount = KE.productsInCategory(sub.slug).length;
          if (!subCount) return;
          rows.push(`<button class="filter-opt is-sub ${state.type === sub.slug ? 'is-active' : ''}" data-filter="type" data-value="${sub.slug}">
            <span>${KE.esc(sub.name)}</span>
            <span class="count">${subCount}</span>
          </button>`);

          /* Nested */
          (sub.children || []).filter(c => c.published).forEach(nested => {
            const nCount = KE.productsInCategory(nested.slug).length;
            if (!nCount) return;
            rows.push(`<button class="filter-opt is-sub2 ${state.type === nested.slug ? 'is-active' : ''}" data-filter="type" data-value="${nested.slug}">
              <span>${KE.esc(nested.name)}</span>
              <span class="count">${nCount}</span>
            </button>`);
          });
        });
      }
    });
    catHost.innerHTML = rows.join('');

    /* Brands */
    const brandHost = document.getElementById('filterBrands');
    const brandRows = KE.BRANDS.map(b => {
      const n = KE.PRODUCTS.filter(p => p.brand === b.slug).length;
      if (!n) return '';
      const active = state.brand === b.slug;
      return `<button class="filter-opt ${active ? 'is-active' : ''}" data-filter="brand" data-value="${b.slug}">
        <input type="checkbox" ${active ? 'checked' : ''} tabindex="-1" aria-hidden="true" />
        <span>${KE.esc(b.name)}</span>
        <span class="count">${n}</span>
      </button>`;
    }).join('');
    brandHost.innerHTML = brandRows;

    /* Price inputs */
    document.getElementById('priceMin').value = state.min || '';
    document.getElementById('priceMax').value = state.max || '';

    /* Stock toggle */
    const t = document.getElementById('inStockToggle');
    t.classList.toggle('is-on', !!state.stock);
    t.setAttribute('aria-pressed', state.stock ? 'true' : 'false');
  },

  /* Render active chips */
  renderChips(state) {
    const chips = [];
    if (state.cat)   chips.push(['cat',   'Category: ' + (KE.findCategory(state.cat)?.name || state.cat)]);
    if (state.type)  chips.push(['type',  'Type: ' + (KE.findCategory(state.type)?.name || state.type)]);
    if (state.brand) chips.push(['brand', 'Brand: ' + KE.brandName(state.brand)]);
    if (state.tag)   chips.push(['tag',   'Tag: ' + state.tag]);
    if (state.q)     chips.push(['q',     'Search: "' + state.q + '"']);
    if (state.min)   chips.push(['min',   'Min ₦' + Number(state.min).toLocaleString()]);
    if (state.max)   chips.push(['max',   'Max ₦' + Number(state.max).toLocaleString()]);
    if (state.stock) chips.push(['stock', 'In stock only']);

    const host = document.getElementById('activeChips');
    if (!chips.length) { host.innerHTML = ''; return; }
    host.innerHTML = chips.map(([k, label]) =>
      `<span class="chip-active">${KE.esc(label)}<button type="button" data-clear="${k}" aria-label="Remove">×</button></span>`
    ).join('');
  },

  /* Render product grid */
  renderGrid(list, state) {
    const grid = document.getElementById('productGrid');
    const empty = document.getElementById('emptyState');
    const count = document.getElementById('resultCount');

    count.textContent = list.length;
    grid.classList.toggle('is-list', state.view === 'list');

    if (!list.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = list.map(p => productCard(p)).join('');
  },

  /* Render page heading based on current filters */
  renderHeading(state) {
    const titleEl = document.getElementById('pageTitle');
    const subEl   = document.getElementById('pageSub');
    const crumbEl = document.getElementById('crumbCurrent');

    let title = 'Shop';
    let sub = 'Browse everything we stock — filter by category, brand or price.';

    if (state.type) {
      const c = KE.findCategory(state.type);
      title = c ? c.name : 'Shop';
      crumbEl.textContent = title;
    } else if (state.cat) {
      const c = KE.findCategory(state.cat);
      title = c ? c.name : 'Shop';
      crumbEl.textContent = title;
    } else if (state.brand) {
      title = KE.brandName(state.brand);
      crumbEl.textContent = title;
    } else if (state.tag) {
      title = state.tag.charAt(0).toUpperCase() + state.tag.slice(1);
      crumbEl.textContent = title;
    } else if (state.q) {
      title = 'Search: "' + state.q + '"';
      crumbEl.textContent = 'Search';
    } else {
      crumbEl.textContent = 'Shop';
    }
    titleEl.textContent = title;
    subEl.textContent = sub;
    document.title = title + ' — KAKA ENTERPRISES';
  },

  /* Full render pass */
  render() {
    const state = this.readUrl();

    /* Sync controls */
    document.getElementById('sortSelect').value = state.sort;
    document.getElementById('viewGrid').classList.toggle('is-active', state.view !== 'list');
    document.getElementById('viewList').classList.toggle('is-active', state.view === 'list');

    this.renderHeading(state);
    this.renderFilters(state);
    this.renderChips(state);

    const list = this.filterProducts(state);
    this.renderGrid(list, state);
  },

  /* Change one filter value */
  set(key, value) {
    const state = this.readUrl();
    state[key] = value;
    /* When switching category, clear the type (sub) filter */
    if (key === 'cat' && value !== state.cat) state.type = '';
    this.writeUrl(state);
    this.render();
  },

  clearAll() {
    history.replaceState(null, '', location.pathname);
    this.render();
  },

  removeChip(key) {
    const state = this.readUrl();
    if (key === 'stock') state.stock = false;
    else state[key] = '';
    this.writeUrl(state);
    this.render();
  }
};

/* ============================================================
   PRODUCT CARD (same design as homepage)
   ============================================================ */
function tagClass(tag){
  if (!tag) return '';
  const t = tag.toLowerCase();
  if (t === 'sale') return 'card__tag--sale';
  if (t === 'new')  return 'card__tag--new';
  return 'card__tag--popular';
}
function productCard(p){
  const out = p.stock <= 0;
  const tint = (p.name.length % 5) + 1;
  return `
    <a class="card" href="product.html?slug=${encodeURIComponent(p.slug)}">
      <div class="card__media" style="background:var(--t${tint});">
        <img src="${KE.img(p.img)}" alt="${KE.esc(p.name)}" loading="lazy" width="500" height="500" />
        ${p.tag ? `<span class="card__tag ${tagClass(p.tag)}">${KE.esc(p.tag)}</span>` : ''}
      </div>
      <div class="card__body">
        <span class="card__brand">${KE.esc(KE.brandName(p.brand))}</span>
        <h3 class="card__name">${KE.esc(p.name)}</h3>
        ${p.rating ? `<span class="card__rating"><span class="star">★</span> ${p.rating} <span>(${p.reviews||0})</span></span>` : ''}
        <div class="card__price">
          <span class="money">${KE.money(p.price)}</span>
          ${p.compare_at_price ? `<del>${KE.money(p.compare_at_price)}</del>` : ''}
        </div>
      </div>
      <div class="card__foot">
        <button class="btn btn--primary btn--sm" type="button" data-add="${KE.esc(p.slug)}" ${out ? 'disabled' : ''}>
          ${out ? 'Sold out' : 'Add to cart'}
        </button>
      </div>
    </a>`;
}

/* ============================================================
   EVENT BINDINGS
   ============================================================ */
document.addEventListener('click', e => {
  /* Add to cart */
  const addBtn = e.target.closest('[data-add]');
  if (addBtn) {
    e.preventDefault();
    const slug = addBtn.getAttribute('data-add');
    const p = KE.findProduct(slug);
    if (!p || p.stock <= 0) return;
    KE.cart.add(slug, 1);
    KE.toast('Added to cart', 'good');
    return;
  }

  /* Filter option click */
  const opt = e.target.closest('[data-filter]');
  if (opt) {
    e.preventDefault();
    const key = opt.getAttribute('data-filter');
    const value = opt.getAttribute('data-value');
    if (key === 'cat') SHOP.set('cat', value);
    else if (key === 'type') SHOP.set('type', value);
    else if (key === 'brand') {
      const state = SHOP.readUrl();
      SHOP.set('brand', state.brand === value ? '' : value);
    }
    return;
  }

  /* Chip removal */
  const chipBtn = e.target.closest('[data-clear]');
  if (chipBtn) {
    SHOP.removeChip(chipBtn.getAttribute('data-clear'));
    return;
  }

  /* Clear buttons */
  if (e.target.closest('#clearFilters') || e.target.closest('#emptyClear')) {
    SHOP.clearAll();
    return;
  }

  /* View toggle */
  if (e.target.closest('#viewGrid')) { SHOP.set('view', 'grid'); return; }
  if (e.target.closest('#viewList')) { SHOP.set('view', 'list'); return; }

  /* Stock toggle */
  if (e.target.closest('#inStockToggle')) {
    const state = SHOP.readUrl();
    SHOP.set('stock', !state.stock);
    return;
  }

  /* Price apply */
  if (e.target.closest('#priceApply')) {
    const min = document.getElementById('priceMin').value.trim();
    const max = document.getElementById('priceMax').value.trim();
    const state = SHOP.readUrl();
    state.min = min; state.max = max;
    SHOP.writeUrl(state);
    SHOP.render();
    return;
  }
});

/* Sort change */
document.addEventListener('change', e => {
  if (e.target.id === 'sortSelect') SHOP.set('sort', e.target.value);
});

/* Mobile filter drawer — reuse the same drawer pattern */
function bindFilterFab(){
  const fab = document.getElementById('filterFab');
  const panel = document.getElementById('filtersPanel');
  if (!fab || !panel) return;

  /* Create a full-screen sheet for mobile filters */
  const sheet = document.createElement('div');
  sheet.className = 'drawer';
  sheet.id = 'filtersDrawer';
  sheet.setAttribute('data-open', 'false');
  sheet.innerHTML = `
    <div class="drawer__scrim" data-close></div>
    <div class="drawer__panel" style="width:min(360px,92vw);">
      <button class="drawer__close" data-close aria-label="Close filters">${ICON.close}</button>
      <div id="filterSheetHost"></div>
    </div>`;
  document.body.appendChild(sheet);

  fab.addEventListener('click', () => {
    /* Move the filter panel content into the sheet */
    const host = sheet.querySelector('#filterSheetHost');
    host.innerHTML = '';
    const clone = panel.cloneNode(true);
    /* Remove sticky positioning from the clone */
    clone.removeAttribute('id');
    clone.classList.remove('filters');
    clone.style.position = 'static';
    clone.style.maxHeight = 'none';
    clone.style.background = 'transparent';
    clone.style.border = '0';
    clone.style.padding = '0';
    host.appendChild(clone);
    /* Re-bind events for the clone by relying on document-level delegation (already active) */
    sheet.setAttribute('data-open', 'true');
    document.body.style.overflow = 'hidden';
  });

  sheet.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) {
      sheet.setAttribute('data-open', 'false');
      document.body.style.overflow = '';
    }
    /* Apply filter inside the sheet → close it */
    const opt = e.target.closest('[data-filter], [data-clear], #clearFilters, #priceApply, #inStockToggle');
    if (opt) {
      setTimeout(() => {
        sheet.setAttribute('data-open', 'false');
        document.body.style.overflow = '';
      }, 60);
    }
  });
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  renderHeader();
  renderFooter();
  updateCartBadge();
  bindHeaderSearch();
  bindDrawer();
  bindDropdowns();
  bindSticky();
  bindFilterFab();

  SHOP.render();

  /* Handle back/forward navigation — re-render without a reload */
  window.addEventListener('popstate', () => SHOP.render());

  document.addEventListener('cart:updated', updateCartBadge);
});
