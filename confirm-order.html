<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A5DFF" />
<title>Order confirmed — KAKA ENTERPRISES</title>
<meta name="description" content="Your order is confirmed at KAKA ENTERPRISES. View your invoice and next steps." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A5DFF'/><g fill='%23FFFFFF'><rect x='7' y='5' width='6' height='22' rx='1'/><polygon points='13,13 21,5 26,5 16,15'/><polygon points='13,19 16,17 26,27 21,27'/></g><path d='M 2 24 Q 8 26, 14 21 Q 20 16, 26 10 Q 28 8, 30 6' fill='none' stroke='%234D9FFF' stroke-width='2.4' stroke-linecap='round'/><circle cx='26' cy='8' r='1.8' fill='%23FFFFFF'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#0A5DFF;--brand-2:#1E7BFF;--brand-spark:#4D9FFF;--brand-soft:#E8F1FF;--brand-soft-2:#F4F8FF;--brand-ink:#001F4B;--wa:#25D366;--wa-2:#1EBE5D;--bg:#F5F6FA;--bg-2:#FFFFFF;--surface:#FFFFFF;--surface-2:#F2F3F8;--surface-3:#E9EBF2;--ink:#0E1020;--ink-2:#2A2F42;--muted:#5F6579;--line:#E4E6EE;--line-2:#D2D5DF;--good:#16A34A;--warn:#D97706;--danger:#DC2626;--t1:#EEF0F7;--t2:#E8F1FF;--t3:#E8F2F6;--t4:#F7EFF4;--t5:#F7F2E6;--topbar-line:#E4ECF5;--topbar-ink:#5F6579;--topbar-ink-strong:#001F4B;--nav-ink:#3A3F55;--search-border:#DCE4EE;--fs-11:11px;--fs-12:12px;--fs-13:13px;--fs-14:14px;--fs-15:15px;--fs-16:16px;--fs-18:18px;--fs-22:22px;--fs-28:28px;--fs-display:clamp(28px,5vw,52px);--fs-h2:clamp(20px,2.6vw,30px);--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;--sp-16:64px;--radius-card:16px;--radius-ctrl:12px;--radius-pill:999px;--gutter:16px;--maxw:1280px;--font-display:'Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--shadow-sm:0 1px 3px rgba(15,23,42,.06);--shadow-md:0 6px 20px rgba(15,23,42,.08);--shadow-lg:0 20px 50px rgba(15,23,42,.12)}
@media (min-width:760px){:root{--gutter:24px}}
[data-theme="dark"]{--brand:#4D9FFF;--brand-2:#6DB0FF;--brand-spark:#6DB0FF;--brand-soft:#0D2A5C;--brand-soft-2:#0A2148;--brand-ink:#E8F1FF;--bg:#0B0B14;--bg-2:#0F0F1A;--surface:#14141F;--surface-2:#1B1B29;--surface-3:#232333;--ink:#F4F5F8;--ink-2:#C7CBD6;--muted:#8A90A2;--line:#262637;--line-2:#33334A;--topbar-line:#262637;--topbar-ink:#8A90A2;--topbar-ink-strong:#F4F5F8;--nav-ink:#C7CBD6;--search-border:#33334A;--t1:#1B1B2E;--t2:#0D2A5C;--t3:#182B3A;--t4:#2F1F2E;--t5:#2B2418}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:170px;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-15);line-height:1.55;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:clip;padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
@supports not (overflow:clip){body{overflow-x:hidden}}
img,svg{max-width:100%;display:block}
h1,h2,h3,h4,h5{font-family:var(--font-display);font-weight:800;line-height:1.15;margin:0 0 var(--sp-3);letter-spacing:-0.02em;color:var(--ink)}
h1{font-size:var(--fs-display);font-weight:900}
h2{font-size:var(--fs-h2)}
h3{font-size:var(--fs-22)}
h5{font-size:var(--fs-16);font-weight:700}
p{margin:0 0 var(--sp-3);color:var(--ink-2)}
a{color:var(--brand);text-decoration:none;transition:color .15s ease}
a:hover{color:var(--brand-2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum" 1}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}

/* ============ HEADER (identical to index.html) ============ */
#siteHeader{position:sticky;position:-webkit-sticky;top:0;z-index:9999;background:#FFFFFF;transition:box-shadow .2s ease}
[data-theme="dark"] #siteHeader{background:#0F0F1A}
#siteHeader:not(.is-stuck){box-shadow:0 1px 0 var(--topbar-line)}
#siteHeader.is-stuck{box-shadow:0 1px 0 var(--topbar-line),0 8px 24px rgba(10,93,255,.10)}
.j-topbar{background:#FFFFFF;color:var(--topbar-ink);border-bottom:1px solid var(--topbar-line);height:36px;display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:0.06em}
[data-theme="dark"] .j-topbar{background:#0F0F1A}
.j-topbar__inner{display:flex;align-items:center;justify-content:space-between;gap:22px;width:100%}
.j-topbar__links,.j-topbar__right{display:flex;align-items:center;gap:18px}
.j-topbar a{color:var(--topbar-ink);display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;transition:color .15s ease;white-space:nowrap}
.j-topbar a:hover{color:var(--brand);text-decoration:none}
.j-topbar a.is-current{color:var(--brand)}
.j-topbar__sep{width:1px;height:12px;background:var(--topbar-line);display:inline-block;flex:0 0 1px}
.j-topbar__cart{color:var(--brand)!important;background:var(--brand-soft);padding:4px 10px;border-radius:6px;font-weight:700}
.j-topbar__cart:hover{background:var(--brand-soft-2)}
.j-topbar__cart .count{font-family:var(--font-mono)}
@media (max-width:900px){.j-topbar__links>*:not(:first-child){display:none}}
@media (max-width:640px){.j-topbar{font-size:10.5px;letter-spacing:0.04em}.j-topbar__links>a:nth-of-type(n+3),.j-topbar__links>.j-topbar__sep:nth-of-type(n+2){display:none}.j-topbar__right>a:not(:first-child):not(.j-topbar__cart),.j-topbar__right>.j-topbar__sep{display:none}.j-topbar__links,.j-topbar__right{gap:12px}}
.j-main{background:#FFFFFF;border-bottom:1px solid var(--topbar-line);padding-block:14px}
[data-theme="dark"] .j-main{background:#0F0F1A}
.j-main__inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:26px}
@media (max-width:900px){.j-main__inner{grid-template-columns:auto 1fr;gap:14px}}
.j-brand{display:flex;align-items:center;color:var(--topbar-ink-strong);text-decoration:none;min-width:0}
.j-brand:hover{color:var(--topbar-ink-strong);text-decoration:none}
.j-brand__logo{height:68px;width:auto;max-width:100%;display:block;flex-shrink:0;transition:transform .2s ease}
.j-brand:hover .j-brand__logo{transform:scale(1.02)}
[data-theme="dark"] .j-brand__logo{filter:brightness(0) invert(1)}
[data-theme="dark"] .j-brand__logo text{fill:#FFFFFF!important}
[data-theme="dark"] .j-brand__logo path[stroke],[data-theme="dark"] .j-brand__logo rect[stroke]{stroke:#FFFFFF!important}
[data-theme="dark"] .j-brand__logo .k-gradient{fill:#4D9FFF}
@media (max-width:900px){.j-brand__logo{height:58px}}
@media (max-width:640px){.j-brand__logo{height:50px}}
@media (max-width:380px){.j-brand__logo{height:44px}}
.j-search{display:flex;align-items:stretch;height:46px;background:#FFFFFF;border:1px solid var(--search-border);border-radius:12px;overflow:hidden;min-width:0;transition:border-color .15s ease,box-shadow .15s ease}
[data-theme="dark"] .j-search{background:#1B1B29}
.j-search:hover{border-color:#C7DCFF}
.j-search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(10,93,255,.10)}
.j-search svg{align-self:center;margin-left:16px;color:var(--brand);flex:0 0 18px;opacity:.85}
.j-search input{flex:1;border:0;outline:0;background:transparent;padding:0 14px;font-size:14px;min-width:0;color:var(--ink)}
.j-search input::placeholder{color:#9A9DB0}
.j-search button{background:var(--brand);color:#fff;border:0;padding:0 28px;font-weight:700;font-size:13.5px;letter-spacing:0.02em;cursor:pointer;white-space:nowrap;transition:background .15s ease}
.j-search button:hover{background:#0A5DFF}
@media (max-width:640px){.j-search button{padding:0 16px;font-size:13px}.j-search svg{margin-left:12px}}
.j-actions{display:flex;align-items:center;gap:6px;white-space:nowrap}
@media (max-width:900px){.j-actions{grid-column:1/-1;justify-content:space-between;gap:4px;margin-top:4px}}
.j-action{display:inline-flex;align-items:center;gap:8px;color:var(--nav-ink);font-weight:600;font-size:13.5px;padding:9px 12px;border-radius:10px;transition:color .15s ease,background .15s ease;position:relative}
.j-action:hover{color:var(--brand);background:var(--brand-soft);text-decoration:none}
.j-action svg{flex:0 0 20px;color:currentColor}
.j-action.is-signed-in{color:var(--brand);background:var(--brand-soft)}
.j-action.is-signed-in:hover{background:var(--brand-soft-2)}
.j-cart{position:relative;background:var(--brand);color:#fff!important;padding:10px 16px;border-radius:10px;box-shadow:0 2px 8px rgba(10,93,255,.22);transition:background .15s ease,transform .1s ease,box-shadow .15s ease}
.j-cart:hover{background:#0A5DFF;color:#fff!important;transform:translateY(-1px);box-shadow:0 4px 14px rgba(10,93,255,.32)}
.j-cart:active{transform:translateY(0)}
.j-cart .icon-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#FFFFFF;color:var(--brand);font-family:var(--font-mono);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--brand);box-shadow:0 1px 4px rgba(10,93,255,.25)}
.j-cart .icon-badge[hidden]{display:none}
.j-menu-btn{display:none;width:44px;height:44px;border:1px solid var(--search-border);background:#FFFFFF;border-radius:10px;align-items:center;justify-content:center;cursor:pointer;color:var(--nav-ink);transition:border-color .15s ease,color .15s ease,background .15s ease}
[data-theme="dark"] .j-menu-btn{background:#1B1B29}
.j-menu-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
@media (max-width:900px){.j-menu-btn{display:inline-flex}}
.j-cats{background:#FFFFFF;border-bottom:1px solid var(--topbar-line)}
[data-theme="dark"] .j-cats{background:#0F0F1A}
.j-cats__scroll{display:flex;align-items:center;gap:4px;padding-block:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.j-cats__scroll::-webkit-scrollbar{display:none}
.j-cats a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;color:var(--nav-ink);font-size:13px;font-weight:600;letter-spacing:-0.005em;white-space:nowrap;border-radius:8px;transition:color .15s ease,background .15s ease}
.j-cats a:hover{color:var(--brand);background:var(--brand-soft);text-decoration:none}
.j-cats a svg{flex:0 0 18px;color:currentColor;opacity:.85}
.j-cats a .chev{flex:0 0 12px;width:12px;height:12px;margin-left:2px;opacity:.55;transition:opacity .15s ease,transform .15s ease}
.j-cats a:hover .chev{opacity:1;transform:translateY(1px)}
@media (max-width:640px){.j-cats a{padding:7px 11px;font-size:12.5px;gap:6px}.j-cats a .chev{width:11px;height:11px}}
.drawer{position:fixed;inset:0;z-index:10000;display:none}
.drawer[data-open="true"]{display:block}
.drawer__scrim{position:absolute;inset:0;background:rgba(0,31,75,.45);backdrop-filter:blur(2px)}
.drawer__panel{position:absolute;top:0;left:0;bottom:0;width:min(320px,88vw);background:#FFFFFF;border-right:1px solid var(--topbar-line);box-shadow:0 20px 50px rgba(10,93,255,.12);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3);overflow-y:auto;transform:translateX(-100%);animation:drawer-in .2s ease forwards}
[data-theme="dark"] .drawer__panel{background:#0F0F1A}
@keyframes drawer-in{to{transform:translateX(0)}}
.drawer__close{align-self:flex-end;width:40px;height:40px;border:1px solid var(--search-border);background:#FFFFFF;border-radius:10px;cursor:pointer;color:var(--nav-ink);transition:border-color .15s ease,color .15s ease,background .15s ease;display:grid;place-items:center}
[data-theme="dark"] .drawer__close{background:#1B1B29}
.drawer__close:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.drawer__nav{display:flex;flex-direction:column;gap:2px;margin-top:var(--sp-3)}
.drawer__link{display:flex;align-items:center;padding:12px;border-radius:10px;color:var(--nav-ink);font-weight:600;font-size:15px;transition:color .15s ease,background .15s ease}
.drawer__link:hover{background:var(--brand-soft);color:var(--brand)}
.drawer__group{display:flex;flex-direction:column}
.drawer__toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-radius:10px;color:var(--nav-ink);font-weight:600;font-size:15px;background:transparent;border:0;cursor:pointer;text-align:left;width:100%;font-family:var(--font-body);transition:color .15s ease,background .15s ease}
.drawer__toggle:hover{background:var(--brand-soft);color:var(--brand)}
.drawer__toggle[aria-expanded="true"]{background:var(--brand-soft);color:var(--brand)}
.drawer__toggle .chev{flex:0 0 auto;opacity:.6;transition:transform .2s ease,opacity .15s ease}
.drawer__toggle[aria-expanded="true"] .chev{transform:rotate(180deg);opacity:1}
.drawer__sub-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;overflow:hidden}
.drawer__sub-list.is-open{grid-template-rows:1fr}
.drawer__sub-list>div{overflow:hidden;display:flex;flex-direction:column;gap:2px}
.drawer__sub{display:block;padding:9px 12px 9px 26px;border-radius:8px;color:var(--topbar-ink);font-weight:500;font-size:14px;transition:color .15s ease,background .15s ease}
.drawer__sub:hover{background:var(--brand-soft);color:var(--brand)}
.drawer__sub--nested{padding-left:42px;font-size:13.5px}
.drawer__sub--all{padding-left:26px;color:var(--brand);font-weight:600;margin-top:2px}
@media (max-width:900px){.j-main__inner{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand actions" "search search";gap:10px 12px;align-items:center}.j-brand{grid-area:brand;min-width:0}.j-search{grid-area:search;height:44px}.j-actions{grid-area:actions;grid-column:auto;justify-content:flex-end;gap:4px;margin-top:0;min-width:0}}
@media (max-width:640px){.j-actions .j-action:not(.j-cart){display:none}}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:44px;padding:11px 22px;border-radius:var(--radius-ctrl);border:1px solid transparent;background:var(--surface);color:var(--ink);font-family:var(--font-body);font-weight:600;font-size:var(--fs-14);line-height:1;cursor:pointer;text-decoration:none;transition:transform .08s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn--primary{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(10,93,255,.22)}
.btn--primary:hover{background:linear-gradient(135deg,#0A5DFF 0%,#1E7BFF 100%);color:#fff;box-shadow:0 6px 20px rgba(10,93,255,.32)}
.btn--outline{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn--outline:hover{border-color:var(--brand);color:var(--brand)}

/* ============ CONFIRMATION PAGE ============ */
.confirm-page{padding-block:var(--sp-6) var(--sp-12)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--fs-13);color:var(--muted);margin-bottom:var(--sp-4)}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--brand)}
.crumbs .sep{opacity:.5}
.crumbs strong{color:var(--ink);font-weight:600}

.success-hero{text-align:center;padding:var(--sp-10) var(--sp-5);background:radial-gradient(900px 380px at 90% 0%,rgba(30,123,255,.10),transparent 60%),radial-gradient(700px 300px at 0% 100%,rgba(10,93,255,.08),transparent 60%),linear-gradient(135deg,#EFF5FF 0%,#E8F1FF 55%,#F5F6FA 100%);border:1px solid var(--line);border-radius:var(--radius-card);margin-bottom:var(--sp-6)}
[data-theme="dark"] .success-hero{background:linear-gradient(135deg,#0D2148 0%,#0A1A38 100%)}
.success-hero__check{width:72px;height:72px;margin:0 auto var(--sp-4);border-radius:50%;background:#fff;color:var(--good);display:grid;place-items:center;box-shadow:0 10px 30px rgba(22,163,74,.25);animation:pop-in .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop-in{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.success-hero h1{font-size:clamp(24px,3.4vw,34px);font-weight:900;margin:0 0 8px}
.success-hero p{color:var(--muted);margin:0 auto;max-width:52ch}
.success-hero__ref{display:inline-flex;align-items:center;gap:10px;margin-top:var(--sp-4);padding:8px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-pill);font-family:var(--font-mono);font-size:var(--fs-13);font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm)}
.success-hero__ref small{font-family:var(--font-body);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10px;color:var(--muted)}

.confirm-grid{display:grid;gap:var(--sp-6);grid-template-columns:1fr}
@media (min-width:900px){.confirm-grid{grid-template-columns:1fr 420px;gap:var(--sp-8);align-items:start}}

.card-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--sp-5);margin-bottom:var(--sp-4)}
.card-block h2{margin:0 0 var(--sp-4);font-size:var(--fs-18);padding-bottom:var(--sp-3);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-block h2 svg{color:var(--brand)}
.card-block ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:var(--fs-14);line-height:1.75}

.pay-next{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-ctrl);padding:var(--sp-4);font-family:var(--font-mono);font-size:var(--fs-13);line-height:1.8}
.pay-next b{font-family:var(--font-body);font-weight:700;color:var(--ink)}
.pay-next .row{display:flex;justify-content:space-between;gap:var(--sp-3);padding:6px 0;border-bottom:1px dashed var(--line)}
.pay-next .row:last-child{border-bottom:0}
.pay-next .label{color:var(--muted)}
.pay-next .value{color:var(--ink);font-weight:600}

.actions-row{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-4)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--radius-ctrl);font-weight:600;font-size:var(--fs-14);cursor:pointer;text-decoration:none;transition:border-color .15s ease,color .15s ease}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-ghost svg{color:currentColor}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;background:#25D366;color:#fff;border:0;border-radius:var(--radius-ctrl);font-weight:600;font-size:var(--fs-14);cursor:pointer;text-decoration:none;transition:background .15s ease}
.btn-wa:hover{background:#1EBE5D;color:#fff}
.btn-wa svg{color:#fff;width:18px;height:18px}

/* ============ INVOICE ============ */
.invoice{background:#ffffff;color:#0E1020;border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--sp-8) var(--sp-6);font-family:var(--font-body)}
.invoice__top{display:flex;justify-content:space-between;gap:var(--sp-6);flex-wrap:wrap;margin-bottom:var(--sp-6);padding-bottom:var(--sp-6);border-bottom:2px solid #0E1020}
.invoice__brand{display:flex;align-items:center;gap:var(--sp-3)}

function bindDrawer(){
  const drawer = document.getElementById('navDrawer'); const openBtn = document.getElementById('menuBtn'); if (!drawer || !openBtn) return;
  let lastFocused = null;
  const open = () => { lastFocused = document.activeElement; drawer.setAttribute('data-open','true'); openBtn.setAttribute('aria-expanded','true'); document.body.style.overflow = 'hidden'; const closeBtn = drawer.querySelector('.drawer__close'); if (closeBtn) closeBtn.focus(); };
  const close = () => { drawer.setAttribute('data-open','false'); openBtn.setAttribute('aria-expanded','false'); document.body.style.overflow = ''; if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus(); };
  openBtn.addEventListener('click', open);
  drawer.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  drawer.querySelectorAll('.drawer__toggle').forEach(btn => { btn.addEventListener('click', () => { const isOpen = btn.getAttribute('aria-expanded') === 'true'; const listId = btn.getAttribute('aria-controls'); const list = listId ? document.getElementById(listId) : null; btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true'); if (list) list.classList.toggle('is-open', !isOpen); }); });
  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.getAttribute('data-open') === 'true') close(); });
}

/* ============================================================
   ORDER CONFIRMATION
   ============================================================ */
function readRef() {
  const p = new URLSearchParams(location.search);
  return p.get('order') || p.get('ref') || p.get('id') || '';
}

function findOrder(ref) {
  if (!ref) return null;
  const target = String(ref).trim();
  try {
    const raw = localStorage.getItem('kaka:last-order:v1');
    if (raw) {
      const last = JSON.parse(raw);
      if (last && (last.id === target || last.ref === target)) return normalizeOrder(last);
    }
  } catch {}
  try {
    const session = JSON.parse(localStorage.getItem('kaka:session:v1') || 'null');
    if (session && session.email) {
      const users = JSON.parse(localStorage.getItem('kaka:users:v1') || '{}');
      const u = users[session.email];
      if (u && Array.isArray(u.orders)) {
        const found = u.orders.find(o => o.id === target || o.ref === target);
        if (found) return normalizeOrder(found);
      }
    }
  } catch {}
  try {
    const users = JSON.parse(localStorage.getItem('kaka:users:v1') || '{}');
    for (const email in users) {
      const list = users[email] && users[email].orders;
      if (Array.isArray(list)) {
        const found = list.find(o => o.id === target || o.ref === target);
        if (found) return normalizeOrder(found);
      }
    }
  } catch {}
  try {
    const last = JSON.parse(sessionStorage.getItem('kaka:lastOrder') || localStorage.getItem('kaka:lastOrder') || 'null');
    if (last && (last.ref === target || last.id === target)) return normalizeOrder(last);
  } catch {}
  try {
    const orders = JSON.parse(localStorage.getItem('kaka:orders') || '[]');
    const found = orders.find(o => o.ref === target || o.id === target);
    if (found) return normalizeOrder(found);
  } catch {}
  return null;
}

function normalizeOrder(raw) {
  if (!raw) return null;
  const isCheckoutShape =
    raw.customerName !== undefined ||
    raw.paymentStatus !== undefined ||
    raw.customerEmail !== undefined ||
    raw.customerPhone !== undefined;
  if (isCheckoutShape) {
    const addr = raw.address || {};
    const items = (raw.items || []).map(it => ({
      name: it.name || 'Item', sku: it.sku || '', qty: Number(it.qty) || 1,
      unit_price: Number(it.price) || 0,
      line_total: Number(it.lineTotal) || (Number(it.price) || 0) * (Number(it.qty) || 1)
    }));
    const pmRaw = String(raw.paymentMethod || '').toLowerCase();
    const paymentMethodSlug =
      pmRaw.includes('pay on delivery') || pmRaw.includes('cod') ? 'cod' :
      pmRaw.includes('transfer') ? 'transfer' : 'paystack';
    const psRaw = String(raw.paymentStatus || 'pending').toLowerCase();
    const paymentStatus =
      (psRaw === 'paid' || psRaw === 'successful') ? 'paid' :
      (paymentMethodSlug === 'cod'      ? 'pending_on_delivery' :
       paymentMethodSlug === 'transfer' ? 'awaiting_transfer' :
       psRaw === 'awaiting'             ? 'awaiting_transfer' : 'pending');
    const delivery = Number(raw.delivery) || 0;
    return {
      ref: raw.id || raw.ref || 'KE-ORDER',
      invoice_number: raw.id || raw.ref || 'KE-INV',
      created_at: raw.createdAt || new Date().toISOString(),
      customer_name: raw.customerName || addr.name || 'Customer',
      phone: raw.customerPhone || addr.phone || '',
      email: raw.customerEmail || addr.email || '',
      address: addr.line1 || '', city: addr.city || '', state: addr.state || '',
      notes: raw.deliveryNotes || '', items,
      subtotal: Number(raw.subtotal) || items.reduce((a,b)=>a+b.line_total, 0),
      shipping_fee: delivery, delivery_free: delivery === 0,
      total: Number(raw.total) || 0,
      payment_method: paymentMethodSlug, payment_status: paymentStatus,
      order_type: 'retail', business_name: ''
    };
  }
  const c = raw.customer || {}; const s = raw.shipping || {}; const t = raw.totals || {};
  const items = (raw.items || []).map(it => ({
    name: it.name || it.name_snapshot || 'Item', sku: it.sku || '', qty: Number(it.qty) || 1,
    unit_price: it.unitPrice || it.unit_price_snapshot || 0,
    line_total: it.lineTotal || it.line_total || ((it.unitPrice || 0) * (it.qty || 1))
  }));
  const subtotal     = t.subtotal ?? raw.subtotal     ?? items.reduce((a,b)=>a+b.line_total,0);
  const shipping_fee = t.delivery ?? raw.shipping_fee ?? 0;
  const total        = t.total    ?? raw.total        ?? (subtotal + shipping_fee);
  const payment = raw.paymentMethod || raw.payment_method || 'paystack';
  const payment_status = raw.payment_status
    || (payment === 'cod' ? 'pending_on_delivery'
      : payment === 'transfer' ? 'awaiting_transfer' : 'pending');
  return {
    ref: raw.ref || raw.id || 'KE-ORDER',
    invoice_number: raw.invoice_number || (raw.ref || raw.id || 'KE-INV'),
    created_at: raw.created_at || raw.createdAt || new Date().toISOString(),
    customer_name: raw.customer_name || c.fullName || 'Customer',
    phone: raw.phone || c.phone || '',
    email: raw.email || c.email || '',
    address: raw.address || s.address || '',
    city: raw.city || s.city || '',
    state: raw.state || s.state || '',
    notes: raw.notes || s.notes || '',
    items, subtotal, shipping_fee, delivery_free: shipping_fee === 0, total,
    payment_method: payment, payment_status,
    order_type: raw.order_type || 'retail',
    business_name: raw.business_name || ''
  };
}

function paymentNextSteps(order) {
  const payment = order.payment_method;
  const total = KE.money(order.total);
  if (payment === 'cod') {
    return {
      title: 'Pay on delivery',
      body: `<p>Your order is confirmed. Please have <b>${total}</b> ready in cash when the courier arrives.</p>
             <p>Keep your phone reachable — we'll call the number you provided before dispatch.</p>`
    };
  }
  if (payment === 'transfer') {
    const b = KE.CONFIG.business.bank;
    return {
      title: 'Bank transfer',
      body: `<p>Please transfer <b>${total}</b> to the account below, then send your proof of payment on WhatsApp.</p>
        <div class="pay-next">
          <div class="row"><span class="label">Bank</span><span class="value">${KE.esc(b.bank_name)}</span></div>
          <div class="row"><span class="label">Account name</span><span class="value">${KE.esc(b.account_name)}</span></div>
          <div class="row"><span class="label">Account number</span><span class="value">${KE.esc(b.account_number)}</span></div>
          <div class="row"><span class="label">Amount</span><span class="value">${total}</span></div>
          <div class="row"><span class="label">Reference</span><span class="value">${KE.esc(order.ref)}</span></div>
        </div>
        <p style="margin-top:12px;">Your order will be dispatched once the transfer clears.</p>`
    };
  }
  return {
    title: 'Card payment',
    body: `<p>Card payments are being finalized. For now, please use bank transfer or pay on delivery.</p>
           <p>Message us on WhatsApp and we'll help you complete the order.</p>`
  };
}

const OC = {
  renderNotFound() {
    document.getElementById('confirmRoot').innerHTML = `
      <div class="not-found">
        <div class="not-found__icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <h1>We couldn't find that order</h1>
        <p>The reference may be mistyped, or the order was placed on a different device.</p>
        <a class="btn btn--primary" href="shop.html">Back to the shop</a>
      </div>`;
    document.title = 'Order not found — KAKA ENTERPRISES';
  },

  render(order) {
    document.title = 'Order ' + order.ref + ' confirmed — KAKA ENTERPRISES';
    const created = new Date(order.created_at || Date.now());
    const dateStr = created.toLocaleDateString('en-NG', { day:'2-digit', month:'short', year:'numeric' });
    const timeStr = created.toLocaleTimeString('en-NG', { hour:'2-digit', minute:'2-digit' });
    const next = paymentNextSteps(order);
    const isWholesale = order.order_type === 'wholesale';
    const waHref = `https://wa.me/${KE.CONFIG.business.whatsapp}?text=${encodeURIComponent(`Hi KAKA ENTERPRISES, I'd like to follow up on my order ${order.ref}.`)}`;

    const itemRows = (order.items || []).map((it, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>
          <div class="item-name">${KE.esc(it.name)}</div>
          ${it.sku ? `<div class="item-sku">${KE.esc(it.sku)}</div>` : ''}
        </td>
        <td class="num mono">${KE.money(it.unit_price)}</td>
        <td class="num mono">${it.qty}</td>
        <td class="num mono">${KE.money(it.line_total)}</td>
      </tr>`).join('');

    const stampCls = (order.payment_status === 'paid') ? 'paid' : 'pending';
    const stampText = (order.payment_status === 'paid') ? 'PAID'
      : (order.payment_status === 'pending_on_delivery') ? 'PAY ON DELIVERY'
      : (order.payment_status === 'awaiting_transfer') ? 'AWAITING TRANSFER'
      : 'PENDING';

    document.getElementById('confirmRoot').innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep" aria-hidden="true">/</span>
        <a href="shop.html">Shop</a><span class="sep" aria-hidden="true">/</span>
        <strong>Order ${KE.esc(order.ref)}</strong>
      </nav>

      <section class="success-hero">
        <div class="success-hero__check" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <h1>Thank you, ${KE.esc((order.customer_name || '').split(' ')[0] || 'there')} — your order is placed.</h1>
        <p>We've received your order. A copy of your invoice is below. Keep this page — you can print it or save it as a PDF.</p>
        <div class="success-hero__ref"><small>Order ref</small><span>${KE.esc(order.ref)}</span></div>
      </section>

      <div class="confirm-grid">
        <div>
          <div class="card-block">
            <h2>${ICON.shield} Next steps</h2>
            <h4 style="margin:0 0 8px;font-size:14px;">${KE.esc(next.title)}</h4>
            <div style="font-size:14px;color:var(--ink-2);line-height:1.7;">${next.body}</div>
            <div class="actions-row">
              <a class="btn-wa" href="${waHref}" target="_blank" rel="noopener noreferrer">${ICON.wa} Message us on WhatsApp</a>
              <button class="btn-ghost" type="button" id="printBtn">${ICON.print} Print / Save PDF</button>
              <button class="btn-ghost" type="button" id="copyLinkBtn">${ICON.link} Copy order link</button>
            </div>
          </div>

          <div class="card-block">
            <h2>${ICON.truck} Delivery</h2>
            <ul style="list-style:none;padding:0;margin:0;">
              <li style="padding:6px 0;"><b>Name:</b> ${KE.esc(order.customer_name || '—')}</li>
              <li style="padding:6px 0;"><b>Phone:</b> ${KE.esc(order.phone || '—')}</li>
              ${order.email ? `<li style="padding:6px 0;"><b>Email:</b> ${KE.esc(order.email)}</li>` : ''}
              <li style="padding:6px 0;"><b>Address:</b> ${KE.esc(order.address || '—')}${order.city ? ', ' + KE.esc(order.city) : ''}${order.state ? ', ' + KE.esc(order.state) : ''}</li>
              ${order.notes ? `<li style="padding:6px 0;"><b>Notes:</b> ${KE.esc(order.notes)}</li>` : ''}
              <li style="padding:6px 0;"><b>Estimated delivery:</b> ${KE.esc(KE.CONFIG.business.deliveryWindow)}</li>
            </ul>
          </div>

          <div class="card-block">
            <h2>Order type</h2>
            <p style="margin:0;font-size:14px;">
              ${isWholesale
                ? `This is a <b>wholesale</b> order${order.business_name ? ` for <b>${KE.esc(order.business_name)}</b>` : ''}. Wholesale prices have been applied automatically.`
                : `This is a <b>retail</b> order. If you're buying for a business, our team can upgrade the order to wholesale — just send us a WhatsApp message.`}
            </p>
          </div>
        </div>

        <aside>
          <div class="invoice" id="invoice">
            <div class="invoice__top">
              <div class="invoice__brand">
                <div class="invoice__brand-mark">${INVOICE_MARK}</div>
                <div class="invoice__brand-text">
                  <h3>${KE.esc(KE.CONFIG.business.name)}</h3>
                  <p>${KE.esc(KE.CONFIG.business.address)}</p>
                  <p>${KE.esc(KE.CONFIG.business.phonePretty)}</p>
                </div>
              </div>
              <div class="invoice__meta">
                <h2>INVOICE</h2>
                <p><b>#</b> ${KE.esc(order.invoice_number)}</p>
                <p><b>Ref</b> ${KE.esc(order.ref)}</p>
                <p><b>Date</b> ${KE.esc(dateStr)} ${KE.esc(timeStr)}</p>
              </div>
            </div>

            <div class="invoice__parties">
              <div class="invoice__party">
                <h4>Billed to</h4>
                <p><b>${KE.esc(order.customer_name || '—')}</b></p>
                ${order.business_name ? `<p>${KE.esc(order.business_name)}</p>` : ''}
                <p class="mono">${KE.esc(order.phone || '')}</p>
                ${order.email ? `<p class="mono">${KE.esc(order.email)}</p>` : ''}
              </div>
              <div class="invoice__party">
                <h4>Deliver to</h4>
                <p>${KE.esc(order.address || '')}</p>
                <p>${KE.esc(order.city || '')}${order.state ? ', ' + KE.esc(order.state) : ''}</p>
              </div>
              <div class="invoice__party">
                <h4>Payment</h4>
                <p><b>${order.payment_method === 'cod' ? 'Pay on delivery' : order.payment_method === 'transfer' ? 'Bank transfer' : 'Card'}</b></p>
                <p class="mono">${stampText}</p>
              </div>
            </div>

            <table class="invoice__table">
              <thead><tr><th style="width:36px;">#</th><th>Item</th><th class="num">Unit price</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead>
              <tbody>${itemRows}</tbody>
            </table>

            <div class="invoice__totals">
              <div class="invoice__totals-inner">
                <div class="row"><span class="label">Subtotal</span><span class="value">${KE.money(order.subtotal)}</span></div>
                <div class="row"><span class="label">Delivery fee</span><span class="value">${order.delivery_free ? 'Free' : KE.money(order.shipping_fee)}</span></div>
                <div class="row total"><span class="label">Total</span><span class="value">${KE.money(order.total)}</span></div>
              </div>
            </div>

            <div class="invoice__footer">
              <p><b>Thank you for shopping with ${KE.esc(KE.CONFIG.business.name)}.</b></p>
              <p>This invoice is generated automatically and is valid without a signature. For any questions about your order, contact us on WhatsApp or call ${KE.esc(KE.CONFIG.business.phonePretty)}.</p>
              <span class="invoice__stamp ${stampCls}">${stampText}</span>
            </div>
          </div>
        </aside>
      </div>
    `;

    this.bindActions();
  },

  bindActions() {
    const printBtn = document.getElementById('printBtn');
    if (printBtn) printBtn.addEventListener('click', () => window.print());
    const copyBtn = document.getElementById('copyLinkBtn');
    if (copyBtn) copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(location.href); KE.toast('Order link copied', 'good'); }
      catch { KE.toast('Could not copy — copy the URL manually', 'warn'); }
    });
  }
};

document.addEventListener('DOMContentLoaded', () => {
  renderHeader();
  renderFooter();
  updateCartBadge();
  bindDrawer();
  bindHeaderSticky();

  const ref = readRef();
  const order = ref ? findOrder(ref) : null;
  if (!order) OC.renderNotFound();
  else OC.render(order);

  window.addEventListener('storage', e => {
    if (e.key === 'kaka:cart:v1') updateCartBadge();
    if (e.key === 'kaka:session:v1') { renderHeader(); bindHeaderSticky(); bindDrawer(); updateCartBadge(); }
  });
  document.addEventListener('cart:updated', updateCartBadge);
});
</script>
</body>
</html>
