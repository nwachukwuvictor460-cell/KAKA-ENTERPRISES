<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Your cart — KAKA ENTERPRISES</title>
<meta name="description" content="Review your cart and proceed to checkout at KAKA ENTERPRISES." />
<link rel="canonical" href="https://kakaenterprises.ng/cart.html" />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236C3BF0'/><path d='M 10 8 C 18 8, 22 12, 22 16 C 22 20, 18 24, 10 24' fill='none' stroke='%23ffffff' stroke-width='3.2' stroke-linecap='round'/><path d='M 10 16 L 16 16' fill='none' stroke='%23ffffff' stroke-width='3.2' stroke-linecap='round'/><circle cx='18' cy='16' r='2.2' fill='%23E8A33D'/></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --brand:#6C3BF0; --brand-2:#8B5CF6; --brand-spark:#E8A33D; --brand-soft:#EFE9FD;
  --brand-soft-2:#F5F1FE; --brand-ink:#4A1FB8;
  --wa:#25D366; --wa-2:#1EBE5D;
  --bg:#F5F6FA; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F3F8; --surface-3:#E9EBF2;
  --ink:#0E1020; --ink-2:#2A2F42; --muted:#5F6579; --line:#E4E6EE; --line-2:#D2D5DF;
  --good:#16A34A; --warn:#D97706; --danger:#DC2626;
  --t1:#EEF0F7; --t2:#F4EFFA; --t3:#E8F2F6; --t4:#F7EFF4; --t5:#F7F2E6;
  --topbar-line:#EDEAF6;
  --topbar-ink:#6B6F85;
  --topbar-ink-strong:#2A2F42;
  --nav-ink:#3A3F55;
  --search-border:#E4E1F0;
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-15:15px; --fs-16:16px;
  --fs-18:18px; --fs-22:22px; --fs-28:28px;
  --fs-display:clamp(28px,5vw,52px); --fs-h2:clamp(20px,2.6vw,30px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --radius-card:16px; --radius-ctrl:12px; --radius-pill:999px;
  --gutter:16px; --maxw:1280px;
  --font-display:'Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 6px 20px rgba(15,23,42,.08);
  --shadow-lg:0 20px 50px rgba(15,23,42,.12);
}
@media (min-width:760px){ :root{ --gutter:24px; } }

[data-theme="dark"]{
  --bg:#0B0B14; --bg-2:#0F0F1A; --surface:#14141F; --surface-2:#1B1B29; --surface-3:#232333;
  --ink:#F4F5F8; --ink-2:#C7CBD6; --muted:#8A90A2; --line:#262637; --line-2:#33334A;
  --topbar-line:#262637; --topbar-ink:#8A90A2; --topbar-ink-strong:#F4F5F8;
  --nav-ink:#C7CBD6; --search-border:#33334A;
  --t1:#1B1B2E;--t2:#2A1F3D;--t3:#182B3A;--t4:#2F1F2E;--t5:#2B2418;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
  scroll-padding-top:170px;
  overflow-x:clip;
}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:var(--fs-15); line-height:1.55; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left,0);
  padding-right:env(safe-area-inset-right,0);
}
img,svg{ max-width:100%; display:block; }
h1,h2,h3,h4,h5{ font-family:var(--font-display); font-weight:800; line-height:1.15;
  margin:0 0 var(--sp-3); letter-spacing:-0.02em; color:var(--ink); }
h1{ font-size:var(--fs-display); font-weight:900; }
h2{ font-size:var(--fs-h2); }
h3{ font-size:var(--fs-22); }
h5{ font-size:var(--fs-16); font-weight:700; }
p{ margin:0 0 var(--sp-3); color:var(--ink-2); }
a{ color:var(--brand); text-decoration:none; transition:color .15s ease; }
a:hover{ color:var(--brand-2); text-decoration:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:6px; }
.wrap{ width:100%; max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gutter); }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.mono{ font-family:var(--font-mono); font-feature-settings:"tnum" 1; }
.muted{ color:var(--muted); }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:0.01ms !important; transition-duration:0.01ms !important;
    scroll-behavior:auto !important; }
}

/* ============================================================
   HEADER
   ============================================================ */
#siteHeader{
  position:sticky; position:-webkit-sticky; top:0; z-index:9999;
  background:#FFFFFF;
  transition:box-shadow .2s ease;
}
[data-theme="dark"] #siteHeader{ background:#0F0F1A; }
#siteHeader:not(.is-stuck){ box-shadow:0 1px 0 var(--topbar-line); }
#siteHeader.is-stuck{ box-shadow:0 1px 0 var(--topbar-line), 0 8px 24px rgba(108,59,240,.10); }

.j-topbar{
  background:#FFFFFF; color:var(--topbar-ink);
  border-bottom:1px solid var(--topbar-line);
  height:36px; display:flex; align-items:center;
  font-size:11px; font-weight:600; letter-spacing:0.06em;
}
[data-theme="dark"] .j-topbar{ background:#0F0F1A; }
.j-topbar__inner{
  display:flex; align-items:center; justify-content:space-between;
  gap:22px; width:100%;
}
.j-topbar__links, .j-topbar__right{ display:flex; align-items:center; gap:18px; }
.j-topbar a{
  color:var(--topbar-ink); display:inline-flex; align-items:center; gap:6px;
  text-transform:uppercase; transition:color .15s ease; white-space:nowrap;
}
.j-topbar a:hover{ color:var(--brand); text-decoration:none; }
.j-topbar a.is-current{ color:var(--brand); }
.j-topbar__sep{
  width:1px; height:12px; background:var(--topbar-line);
  display:inline-block; flex:0 0 1px;
}
@media (max-width:640px){
  .j-topbar{ font-size:10.5px; letter-spacing:0.04em; }
  .j-topbar__links > a:nth-of-type(n+3),
  .j-topbar__links > .j-topbar__sep:nth-of-type(n+2){ display:none; }
  .j-topbar__right > a:not(:first-child),
  .j-topbar__right > .j-topbar__sep{ display:none; }
  .j-topbar__links, .j-topbar__right{ gap:12px; }
}

.j-main{
  background:#FFFFFF; border-bottom:1px solid var(--topbar-line);
  padding-block:14px;
}
[data-theme="dark"] .j-main{ background:#0F0F1A; }
.j-main__inner{
  display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; gap:26px;
}
@media (max-width:900px){ .j-main__inner{ grid-template-columns:auto 1fr; gap:14px; } }

.j-brand{
  display:flex; align-items:center; gap:12px;
  color:var(--topbar-ink-strong); text-decoration:none; min-width:0;
}
.j-brand:hover{ color:var(--topbar-ink-strong); text-decoration:none; }
.j-brand__mark{
  width:42px; height:42px; border-radius:12px;
  background:linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
  display:grid; place-items:center; flex:0 0 42px;
  box-shadow:0 2px 8px rgba(108,59,240,.22);
}
.j-brand__mark svg{ width:24px; height:24px; color:#fff; }
.j-brand__text{ display:flex; flex-direction:column; min-width:0; }
.j-brand__name{
  font-family:var(--font-display); font-weight:900; font-size:20px;
  letter-spacing:-0.02em; line-height:1.05;
  color:var(--topbar-ink-strong); text-transform:uppercase; white-space:nowrap;
}
.j-brand__tag{
  font-size:10px; font-weight:700; letter-spacing:0.14em;
  color:var(--brand); text-transform:uppercase; margin-top:3px; white-space:nowrap;
}
@media (max-width:520px){
  .j-brand__mark{ width:36px; height:36px; flex:0 0 36px; border-radius:10px; }
  .j-brand__mark svg{ width:20px; height:20px; }
  .j-brand__name{ font-size:16px; }
  .j-brand__tag{ font-size:9px; letter-spacing:0.1em; }
}

.j-search{
  display:flex; align-items:stretch;
  height:46px; background:#FFFFFF;
  border:1px solid var(--search-border); border-radius:12px;
  overflow:hidden; min-width:0;
  transition:border-color .15s ease, box-shadow .15s ease;
}
[data-theme="dark"] .j-search{ background:#1B1B29; }
.j-search:hover{ border-color:#D6D0EC; }
.j-search:focus-within{ border-color:var(--brand); box-shadow:0 0 0 4px rgba(108,59,240,.10); }
.j-search svg{ align-self:center; margin-left:16px; color:var(--brand); flex:0 0 18px; opacity:.85; }
.j-search input{
  flex:1; border:0; outline:0; background:transparent;
  padding:0 14px; font-size:16px; min-width:0; color:var(--ink);
}
.j-search input::placeholder{ color:#9A9DB0; }
.j-search button{
  background:var(--brand); color:#fff; border:0;
  padding:0 28px; font-weight:700; font-size:13.5px;
  letter-spacing:0.02em; cursor:pointer; white-space:nowrap;
  transition:background .15s ease;
}
.j-search button:hover{ background:#5A2FE0; }
@media (max-width:640px){
  .j-search button{ padding:0 16px; font-size:13px; }
  .j-search svg{ margin-left:12px; }
}

.j-actions{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
@media (max-width:900px){
  .j-actions{ grid-column:1/-1; justify-content:space-between; gap:4px; margin-top:4px; }
}
.j-action{
  display:inline-flex; align-items:center; gap:8px;
  color:var(--nav-ink); font-weight:600; font-size:13.5px;
  padding:9px 12px; border-radius:10px;
  transition:color .15s ease, background .15s ease; position:relative;
}
.j-action:hover{ color:var(--brand); background:var(--brand-soft); text-decoration:none; }
.j-action svg{ flex:0 0 20px; color:currentColor; }

.j-cart{
  position:relative; background:var(--brand); color:#fff !important;
  padding:10px 16px; border-radius:10px;
  box-shadow:0 2px 8px rgba(108,59,240,.22);
  transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
}
.j-cart:hover{
  background:#5A2FE0; color:#fff !important;
  transform:translateY(-1px); box-shadow:0 4px 14px rgba(108,59,240,.32);
}
.j-cart:active{ transform:translateY(0); }
.j-cart .icon-badge{
  position:absolute; top:-6px; right:-6px;
  min-width:20px; height:20px; padding:0 5px;
  border-radius:999px; background:#FFFFFF; color:var(--brand);
  font-family:var(--font-mono); font-size:11px; font-weight:800;
  display:inline-flex; align-items:center; justify-content:center;
  border:2px solid var(--brand); box-shadow:0 1px 4px rgba(108,59,240,.25);
}
.j-cart .icon-badge[hidden]{ display:none; }

.j-menu-btn{
  display:none; width:42px; height:42px;
  border:1px solid var(--search-border); background:#FFFFFF;
  border-radius:10px; align-items:center; justify-content:center;
  cursor:pointer; color:var(--nav-ink);
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
[data-theme="dark"] .j-menu-btn{ background:#1B1B29; }
.j-menu-btn:hover{ border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }
@media (max-width:900px){ .j-menu-btn{ display:inline-flex; } }

.j-cats{ background:#FFFFFF; border-bottom:1px solid var(--topbar-line); }
[data-theme="dark"] .j-cats{ background:#0F0F1A; }
.j-cats__scroll{
  display:flex; align-items:center; gap:4px;
  padding-block:8px; overflow-x:auto;
  scrollbar-width:none; -ms-overflow-style:none;
}
.j-cats__scroll::-webkit-scrollbar{ display:none; }
.j-cats a{
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; color:var(--nav-ink);
  font-size:13px; font-weight:600; letter-spacing:-0.005em;
  white-space:nowrap; border-radius:8px;
  transition:color .15s ease, background .15s ease;
}
.j-cats a:hover{ color:var(--brand); background:var(--brand-soft); text-decoration:none; }
.j-cats a svg{ flex:0 0 18px; color:currentColor; opacity:.85; }
.j-cats a .chev{
  flex:0 0 12px; width:12px; height:12px; margin-left:2px;
  opacity:.55; transition:opacity .15s ease, transform .15s ease;
}
.j-cats a:hover .chev{ opacity:1; transform:translateY(1px); }
@media (max-width:640px){
  .j-cats a{ padding:7px 11px; font-size:12.5px; gap:6px; }
  .j-cats a .chev{ width:11px; height:11px; }
}

/* ============================================================
   DRAWER
   ============================================================ */
.drawer{ position:fixed; inset:0; z-index:10000; display:none; }
.drawer[data-open="true"]{ display:block; }
.drawer__scrim{ position:absolute; inset:0; background:rgba(30,20,70,.45); backdrop-filter:blur(2px); }
.drawer__panel{
  position:absolute; top:0; left:0; bottom:0;
  width:min(320px,88vw); background:#FFFFFF;
  border-right:1px solid var(--topbar-line);
  box-shadow:0 20px 50px rgba(108,59,240,.12);
  padding:var(--sp-5);
  display:flex; flex-direction:column;
  gap:var(--sp-3); overflow-y:auto;
  transform:translateX(-100%);
  animation:drawer-in .2s ease forwards;
}
[data-theme="dark"] .drawer__panel{ background:#0F0F1A; }
@keyframes drawer-in{ to{ transform:translateX(0); } }
.drawer__close{
  align-self:flex-end; width:40px; height:40px;
  border:1px solid var(--search-border); background:#FFFFFF;
  border-radius:10px; cursor:pointer; color:var(--nav-ink);
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
[data-theme="dark"] .drawer__close{ background:#1B1B29; }
.drawer__close:hover{ border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }
.drawer__nav{ display:flex; flex-direction:column; gap:2px; margin-top:var(--sp-3); }
.drawer__link{
  display:flex; align-items:center;
  padding:12px 12px; border-radius:10px;
  color:var(--nav-ink); font-weight:600; font-size:15px;
  transition:color .15s ease, background .15s ease;
}
.drawer__link:hover{ background:var(--brand-soft); color:var(--brand); }
.drawer__group{ display:flex; flex-direction:column; }
.drawer__toggle{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:12px 12px; border-radius:10px;
  color:var(--nav-ink); font-weight:600; font-size:15px;
  background:transparent; border:0; cursor:pointer;
  text-align:left; width:100%; font-family:var(--font-body);
  transition:color .15s ease, background .15s ease;
}
.drawer__toggle:hover{ background:var(--brand-soft); color:var(--brand); }
.drawer__toggle[aria-expanded="true"]{ background:var(--brand-soft); color:var(--brand); }
.drawer__toggle .chev{
  flex:0 0 auto; opacity:.6;
  transition:transform .2s ease, opacity .15s ease;
}
.drawer__toggle[aria-expanded="true"] .chev{ transform:rotate(180deg); opacity:1; }
.drawer__sub-list{
  display:grid; grid-template-rows:0fr;
  transition:grid-template-rows .25s ease;
  overflow:hidden;
}
.drawer__sub-list.is-open{ grid-template-rows:1fr; }
.drawer__sub-list > div{
  overflow:hidden;
  display:flex; flex-direction:column; gap:2px;
}
.drawer__sub{
  display:block;
  padding:9px 12px 9px 26px;
  border-radius:8px;
  color:var(--topbar-ink);
  font-weight:500; font-size:14px;
  transition:color .15s ease, background .15s ease;
}
.drawer__sub:hover{ background:var(--brand-soft); color:var(--brand); }
.drawer__sub--nested{ padding-left:42px; font-size:13.5px; }
.drawer__sub--all{
  padding-left:26px;
  color:var(--brand);
  font-weight:600;
  margin-top:2px;
}

/* ============================================================
   CART PAGE
   ============================================================ */
.cart-page{ padding-block:var(--sp-6) var(--sp-12); }

.breadcrumb{
  display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  font-size:var(--fs-13); color:var(--muted); margin-bottom:var(--sp-4);
}
.breadcrumb a{ color:var(--muted); }
.breadcrumb a:hover{ color:var(--brand); }
.breadcrumb span.sep{ opacity:.5; }
.breadcrumb strong{ color:var(--ink); font-weight:600; }

.cart-head{
  display:flex; align-items:end; justify-content:space-between;
  gap:var(--sp-4); margin-bottom:var(--sp-6); flex-wrap:wrap;
}
.cart-head h1{ margin:0; font-size:var(--fs-28); }
.cart-head p{ margin:0; color:var(--muted); font-size:var(--fs-14); }
.cart-head__clear{
  background:transparent; border:1px solid var(--line-2);
  color:var(--muted); font-size:var(--fs-13); font-weight:600;
  padding:8px 14px; border-radius:var(--radius-ctrl);
  cursor:pointer; transition:color .15s ease, border-color .15s ease;
}
.cart-head__clear:hover{ color:var(--danger); border-color:var(--danger); }

.cart-layout{
  display:grid;
  grid-template-columns:1fr;
  gap:var(--sp-6);
}
@media (min-width:900px){
  .cart-layout{ grid-template-columns:1fr 360px; gap:var(--sp-8); align-items:start; }
}

/* Notice bar */
.notice{
  display:flex; gap:10px; align-items:flex-start;
  padding:12px 16px; border-radius:var(--radius-ctrl);
  background:color-mix(in srgb, var(--warn) 10%, transparent);
  border:1px solid color-mix(in srgb, var(--warn) 30%, transparent);
  color:#7a4b00; font-size:var(--fs-13); margin-bottom:var(--sp-4);
}
[data-theme="dark"] .notice{ color:var(--warn); }
.notice svg{ flex:0 0 18px; color:var(--warn); margin-top:1px; }
.notice b{ font-weight:700; }
.notice button{
  margin-left:auto; background:transparent; border:0;
  color:inherit; cursor:pointer; font-weight:700; font-size:12px;
  text-decoration:underline;
}

/* Cart lines */
.cart-lines{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-card); overflow:hidden;
}
.line{
  display:grid;
  grid-template-columns:88px 1fr;
  gap:var(--sp-3);
  padding:var(--sp-4);
  border-bottom:1px solid var(--line);
  align-items:start;
  position:relative;
}
.line:last-child{ border-bottom:0; }
@media (min-width:640px){
  .line{ grid-template-columns:100px 1fr auto; gap:var(--sp-4); padding:var(--sp-5); align-items:center; }
}
.line__media{
  width:100%; aspect-ratio:1/1;
  border-radius:12px; overflow:hidden;
  background:var(--t1); flex:0 0 auto;
  display:block;
}
.line__media img{ width:100%; height:100%; object-fit:contain; padding:4px; }
.line__body{ min-width:0; }
.line__brand{
  font-size:var(--fs-11); color:var(--muted);
  text-transform:uppercase; letter-spacing:0.06em; font-weight:600;
}
.line__name{
  font-weight:600; font-size:var(--fs-15);
  color:var(--ink); margin:2px 0 4px;
  display:-webkit-box; -webkit-box-orient:vertical;
  overflow:hidden; overflow-wrap:break-word;
}
.line__name a{ color:inherit; }
.line__name a:hover{ color:var(--brand); }
.line__sku{
  font-family:var(--font-mono); font-size:11px;
  color:var(--muted); margin-bottom:4px;
}
.line__unit{
  font-size:var(--fs-13); color:var(--muted);
  font-family:var(--font-mono);
}
.line__unit .save{
  display:inline-block; margin-left:6px;
  padding:1px 8px; border-radius:6px;
  background:color-mix(in srgb, var(--good) 14%, transparent);
  color:var(--good); font-weight:600; font-size:11px;
}
.line__hint{
  font-size:var(--fs-12); color:var(--brand);
  margin-top:4px; font-weight:500;
}
.line__actions{
  display:flex; align-items:center; gap:var(--sp-3);
  margin-top:var(--sp-3);
  flex-wrap:wrap;
}
@media (min-width:640px){
  .line__actions{ flex-direction:column; align-items:flex-end; margin-top:0; }
}
.line__qty{
  display:inline-flex; align-items:center;
  border:1px solid var(--line); border-radius:10px;
  overflow:hidden; background:var(--surface);
  height:40px;
}
.line__qty button{
  width:38px; height:40px; border:0;
  background:transparent; cursor:pointer;
  color:var(--ink); font-size:18px; font-weight:600;
  display:grid; place-items:center;
  touch-action:manipulation;
}

/* Empty state */

.cart-empty h2{ margin:0 0 8px; font-size:var(--fs-22); }

/* Summary */

}
.summary__row{

  gap:var(--sp-3); font-size:var(--fs-14);
  padding:8px 0;
}
.summary__row .label{ color:var(--muted); }
.summary__row .value{ font-family:var(--font-mono); color:var(--ink); font-weight:600; text-align:right; }
.summary__row--save .label,
.summary__row--save .value{ color:var(--good); font-weight:600; }

  font-size:var(--fs-13);
  font-weight:500;
}
.summary__note{
  font-size:var(--fs-12); color:var(--muted);
  padding:var(--sp-3) 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin:var(--sp-2) 0 var(--sp-4);
  line-height:1.6;
}
.summary__note a{ color:var(--brand); font-weight:600; }
.summary__total{
  display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-3);
  padding-top:var(--sp-2);
}
.summary__total .label{ font-weight:700; font-size:var(--fs-15); }
.summary__total .value{
  font-family:var(--font-display);
  font-size:var(--fs-22); font-weight:900;
  color:var(--ink);
}
.btn-checkout{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:52px;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
  color:#fff; border:0; border-radius:var(--radius-ctrl);
  font-weight:700; font-size:var(--fs-15);
  cursor:pointer; text-decoration:none;
  margin-top:var(--sp-4);
  box-shadow:0 4px 14px rgba(108,59,240,.22);
  transition:transform .08s ease, box-shadow .15s ease;
}
.btn-checkout:hover{
  background:linear-gradient(135deg,#5A2FE0 0%,#7B4CF0 100%);
  color:#fff;
  box-shadow:0 6px 20px rgba(108,59,240,.32);
}
.btn-checkout:active{ transform:translateY(1px); }
.summary__keep{
  display:block; text-align:center;
  margin-top:var(--sp-3); font-size:var(--fs-13);
  color:var(--brand); font-weight:600;
}
.summary__keep:hover{ color:var(--brand-2); }

.summary__trust{
  margin-top:var(--sp-5);

  list-style:none; padding-left:0;
}
.summary__trust li{
  display:flex; align-items:center; gap:10px;
  font-size:var(--fs-12); color:var(--muted);
}
.summary__trust svg{ color:var(--brand); flex:0 0 16px; }

/* Cross-sell */
.crosssell{ margin-top:var(--sp-12); }
.crosssell h2{ margin:0 0 var(--sp-4); font-size:var(--fs-22); }
.crosssell-grid{
  display:grid; gap:var(--sp-4);
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
}
@media (min-width:640px){ .crosssell-grid{ grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); } }
@media (min-width:1200px){ .crosssell-grid{ grid-template-columns:repeat(4, 1fr); } }

.card{
  display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-card); overflow:hidden;
  color:var(--ink); height:100%;

  transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}

  transform:translateY(-3px);

}
.card__link{
  display:flex; flex-direction:column; flex:1;
  color:inherit; text-decoration:none;
}
.card__link:hover{ color:inherit; text-decoration:none; }

.card__media img{

}

.card__tag{ position:absolute; top:10px; left:10px;

  text-transform:uppercase; color:#fff; z-index:2; }
.card__tag--sale{ background:var(--danger); }
.card__tag--new{ background:var(--good); }

.card__body{ padding:var(--sp-4); display:flex; flex-direction:column;

.card__brand{ font-size:var(--fs-11); color:var(--muted);
  text-transform:uppercase; letter-spacing:0.06em; font-weight:600; }
.card__name{ font-family:var(--font-body); font-weight:600; font-size:var(--fs-14);
  line-height:1.35; margin:0; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; min-height:2.7em; }
.card__rating{ display:inline-flex; align-items:center; gap:4px;
  font-size:var(--fs-11); color:var(--muted); }
.card__rating .star{ color:var(--brand-spark); }
.card__price{ margin-top:auto; display:flex; align-items:baseline;
  gap:8px; flex-wrap:wrap; padding-top:var(--sp-2); }
.card__price .money{ font-size:var(--fs-16); font-weight:700; color:var(--ink); }
.card__price del{ color:var(--muted); font-size:var(--fs-13); }
.card__foot{ padding:0 var(--sp-4) var(--sp-4); display:flex; gap:8px; }
.card__foot .btn{ flex:1; }

/* ============================================================
   MOBILE STICKY CHECKOUT BAR
   ============================================================ */
.checkout-bar{
  position:fixed; left:0; right:0; bottom:0;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));
  background:var(--bg-2);

}
.checkout-bar__info{
  display:flex; flex-direction:column; line-height:1.15;
  min-width:0;
}
.checkout-bar__info small{
  font-size:10px; color:var(--muted);
  text-transform:uppercase; letter-spacing:0.06em;
}
.checkout-bar__info b{

  font-size:var(--fs-18); color:var(--ink);
}
.checkout-bar__btn{

  font-weight:700; font-size:var(--fs-14);
  text-decoration:none; cursor:pointer; white-space:nowrap;
  box-shadow:0 4px 14px rgba(108,59,240,.22);
}
.checkout-bar__btn:hover{ color:#fff; }
@media (min-width:900px){ .checkout-bar{ display:none !important; } }
@media (max-width:899px){

}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{ display:inline-flex; align-items:center; justify-content:center;
  gap:var(--sp-2); min-height:44px; padding:11px 22px;
  border-radius:var(--radius-ctrl); border:1px solid transparent;
  background:var(--surface); color:var(--ink);
  font-family:var(--font-body); font-weight:600; font-size:var(--fs-14);
  line-height:1; cursor:pointer; text-decoration:none;
  transition:transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color:transparent; white-space:nowrap; }
.btn:active{ transform:translateY(1px); }
.btn--primary{ background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);

  box-shadow:0 4px 14px rgba(108,59,240,.22); }
.btn--primary:hover{ background:linear-gradient(135deg,#5A2FE0 0%,#7B4CF0 100%); color:#fff;

.btn--outline{ background:var(--surface); color:var(--ink); border-color:var(--line-2); }
.btn--outline:hover{ border-color:var(--brand); color:var(--brand); }
.btn--sm{ min-height:36px; padding:8px 14px; font-size:var(--fs-13); border-radius:10px; }

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer{
  margin-top:var(--sp-12);
  background:var(--bg-2);
  border-top:1px solid var(--line);
  padding-block:var(--sp-12) var(--sp-6);
  color:var(--muted);
  font-size:var(--fs-14);
}
.site-footer__grid{

}
@media (min-width:760px){

}
.site-footer h5{

  margin-bottom:var(--sp-4); text-transform:uppercase; letter-spacing:0.06em;
}
.site-footer a{

}
.site-footer a:hover{ color:var(--brand); }
.site-footer a.footer-inline{ display:inline; padding:0; }
.site-footer__brand{

}

.site-footer__name{

.site-footer__bottom{

.pay-badge{

   WHATSAPP FLOAT
   ============================================================ */
.wa-float{
  position:fixed; right:16px;
  bottom:calc(96px + env(safe-area-inset-bottom,0));

}
@media (min-width:900px){

}
.wa-float:hover{

}

.wa-float__text{ white-space:nowrap; font-weight:700; font-size:14px; }

  .wa-float__icon svg{ width:32px; height:32px; }
  .wa-float__text{ display:none; }
}

   ============================================================ */
.toast-stack{
  position:fixed; left:50%;
  bottom:max(16px, env(safe-area-inset-bottom, 16px));
  transform:translateX(-50%);
  z-index:3000;
  display:flex; flex-direction:column;
  gap:8px;
  width:min(92vw,380px);
  pointer-events:none;
}
@media (max-width:899px){

.toast{

  font-size:var(--fs-14); font-weight:500;

.toast--good{ background:var(--good); color:#fff; }
.toast--warn{ background:var(--warn); color:#fff; }
.toast a{
  color:#fff; font-weight:700; text-decoration:underline;
  font-size:var(--fs-13); pointer-events:auto;
}
@keyframes toast-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

/* ---------- HELPERS ---------- */
KE.money = n => '₦' + (Number(n) || 0).toLocaleString('en-NG', { maximumFractionDigits: 0 });
KE.esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

KE.PLACEHOLDER_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
  '<rect width="200" height="200" fill="#EFE9FD"/>' +
  '<text x="50%" y="50%" text-anchor="middle" fill="#6C3BF0" font-family="system-ui,sans-serif" font-size="16" font-weight="700" dy=".35em">KAKA</text>' +
  '</svg>'
);

KE.img = (id, w = 400) => {
  if (!id) return KE.PLACEHOLDER_IMG;
  if (id.startsWith('http') || id.startsWith('data:') || id.startsWith('/') || id.startsWith('assets/')) return id;
  return `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=70`;
};

KE.imgFallback = function(el){
  if (!el || el.dataset.fallbackApplied) return;
  el.dataset.fallbackApplied = '1';
  el.src = KE.PLACEHOLDER_IMG;
};

KE.tierFor = q => KE.CONFIG.wholesale.find(t => q >= t.min && q <= t.max) || KE.CONFIG.wholesale[0];
KE.unitPrice = (p, q = 1) => Math.round(p.price * (1 - KE.tierFor(q).off));
KE.findProduct = slug => KE.PRODUCTS.find(p => p.slug === slug) || null;
KE.findBrand = slug => KE.BRANDS.find(b => b.slug === slug) || null;
KE.brandName = slug => KE.findBrand(slug)?.name || slug;
KE.productsInCategory = cat => KE.PRODUCTS.filter(p => p.categoryPath.includes(cat));

/* ---------- CART ---------- */
KE.cart = (function(){
  const KEY = 'kaka:cart:v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const write = c => {
    try { localStorage.setItem(KEY, JSON.stringify(c)); } catch {}
    document.dispatchEvent(new CustomEvent('cart:updated'));
  };
  return {
    items: () => read(),
    count: () => Object.values(read()).reduce((a,b) => a+b, 0),
    add(slug, qty = 1) {
      const p = KE.findProduct(slug); if (!p) return;
      const c = read(); c[slug] = Math.min((c[slug] || 0) + qty, p.stock); write(c);
    },
    setQty(slug, qty) {
      const p = KE.findProduct(slug); if (!p) return;
      const c = read();
      const n = Math.max(0, Math.min(qty, p.stock));
      if (n <= 0) delete c[slug]; else c[slug] = n;
      write(c);
    },
    remove(slug) { const c = read(); delete c[slug]; write(c); },
    clear() { write({}); },
    lines() {
      const c = read();
      const out = [];
      for (const [slug, qty] of Object.entries(c)) {
        const p = KE.findProduct(slug);
        if (!p) continue;
        out.push({ product: p, qty });
      }
      return out;
    },
    /* Subtotal only — delivery is resolved at checkout based on the
       customer's location, using admin-configured rates. */
    totals() {
      const c = read();
      let subtotal = 0;
      let itemCount = 0;
      let savings = 0;
      for (const [slug, qty] of Object.entries(c)) {
        const p = KE.findProduct(slug); if (!p) continue;
        const unit = KE.unitPrice(p, qty);
        subtotal += unit * qty;
        itemCount += qty;
        /* "Savings" = how much lower our price is vs. retail (p.price) */
        savings += (p.price - unit) * qty;
      }
      return { subtotal, itemCount, savings };
    }
  };
})();

KE.toast = function(msg, kind = '', action){
  const stack = document.getElementById('toastStack'); if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if (action && action.href && action.label) {
    const a = document.createElement('a');
    a.href = action.href;
    a.textContent = action.label;
    el.appendChild(a);
  }
  stack.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s ease, transform .2s ease';
    el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 240);
  }, 2200);
};

function buildDrawerNav(){
  let html = `
    <a href="shop.html" class="drawer__link">Shop all products</a>
    <a href="shop.html?tag=Sale" class="drawer__link">Deals</a>
    <a href="shop.html?sort=new" class="drawer__link">New Arrivals</a>`;

  KE.CATEGORIES.filter(c => c.published).sort((a,b) => a.order - b.order).forEach(cat => {
    const subs = (cat.children || []).filter(c => c.published);
    if (!subs.length) {
      html += `<a href="shop.html?cat=${encodeURIComponent(cat.slug)}" class="drawer__link">${KE.esc(cat.name)}</a>`;
      return;
    }
    const groupId = 'drawer-group-' + cat.slug;
    const subLinks = subs.map(sub => {
      const nested = (sub.children || []).filter(c => c.published);
      return `
        <a class="drawer__sub" href="shop.html?type=${encodeURIComponent(sub.slug)}">${KE.esc(sub.name)}</a>
        ${nested.map(n => `<a class="drawer__sub drawer__sub--nested" href="shop.html?type=${encodeURIComponent(n.slug)}">${KE.esc(n.name)}</a>`).join('')}
      `;
    }).join('');
    html += `
      <div class="drawer__group">
        <button type="button" class="drawer__toggle" aria-expanded="false" aria-controls="${groupId}">
          <span>${KE.esc(cat.name)}</span>
          ${ICON.chevron}
        </button>
        <div class="drawer__sub-list" id="${groupId}">
          <div>
            ${subLinks}
            <a class="drawer__sub drawer__sub--all" href="shop.html?cat=${encodeURIComponent(cat.slug)}">View all ${KE.esc(cat.name)} →</a>
          </div>
        </div>
      </div>`;
  });

  html += `
    <a href="store-location.html" class="drawer__link">Visit our store</a>
    <a href="track-order.html" class="drawer__link">Track order</a>
    <a href="cart.html" class="drawer__link">Cart</a>`;
  return html;
}

function updateCartBadge(){
  const b = document.getElementById('cartBadge'); if (!b) return;
  const n = KE.cart.count();
  if (n > 0) { b.hidden = false; b.textContent = n > 99 ? '99+' : String(n); }
  else { b.hidden = true; b.textContent = '0'; }
}

function bindDrawer(){
  const drawer = document.getElementById('navDrawer');
  const openBtn = document.getElementById('menuBtn');
  if (!drawer || !openBtn) return;
  let lastFocused = null;

  const open = () => {
    lastFocused = document.activeElement;
    drawer.setAttribute('data-open','true');
    openBtn.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
    const closeBtn = drawer.querySelector('.drawer__close');
    if (closeBtn) closeBtn.focus();
  };
  const close = () => {
    drawer.setAttribute('data-open','false');
    openBtn.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
  };

  openBtn.addEventListener('click', open);
  drawer.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });

  drawer.querySelectorAll('.drawer__toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const isOpen = btn.getAttribute('aria-expanded') === 'true';
      const listId = btn.getAttribute('aria-controls');
      const list = listId ? document.getElementById(listId) : null;
      btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      if (list) list.classList.toggle('is-open', !isOpen);
    });
  });

  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.getAttribute('data-open') === 'true') close();
  });
}

function bindHeaderSticky(){
  const header = document.getElementById('siteHeader');
  if (!header) return;
  const onScroll = () => {
    if (window.scrollY > 4) header.classList.add('is-stuck');
    else header.classList.remove('is-stuck');
  };
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
}

/* ============================================================
   CART PAGE — main logic
   ============================================================ */
const CT = {
  reconcile() {
    const c = KE.cart.items();
    const notices = [];
    Object.keys(c).forEach(slug => {
      const p = KE.findProduct(slug);
      if (!p) {
        KE.cart.remove(slug);
        notices.push({ slug, reason:'removed' });
        return;
      }
      if (c[slug] > p.stock) {
        const reduced = p.stock;
        KE.cart.setQty(slug, reduced);
        notices.push({ slug, reason:'reduced', from:c[slug], to:reduced, name:p.name });
      }
    });
    return notices;
  },

  tierHint(product, qty) {
    const t = KE.tierFor(qty);
    const idx = KE.CONFIG.wholesale.indexOf(t);
    const next = KE.CONFIG.wholesale[idx + 1];
    if (!next || next.off <= t.off) return '';
    const need = next.min - qty;
    const nextUnit = Math.round(product.price * (1 - next.off));
    const save = product.price - nextUnit;
    return `Add ${need} more → save ${KE.money(save)} per unit`;
  },

  crosssell() {
    const items = KE.cart.items();
    const slugs = Object.keys(items);
    if (!slugs.length) return [];
    const cats = new Set();
    slugs.forEach(s => {
      const p = KE.findProduct(s);
      if (p) p.categoryPath.forEach(c => cats.add(c));
    });
    const seen = new Set(slugs);
    const out = [];
    KE.PRODUCTS.forEach(p => {
      if (out.length >= 4) return;
      if (seen.has(p.slug)) return;
      if (p.categoryPath.some(c => cats.has(c))) { out.push(p); seen.add(p.slug); }
    });
    KE.PRODUCTS.forEach(p => {
      if (out.length >= 4) return;
      if (seen.has(p.slug)) return;
      out.push(p); seen.add(p.slug);
    });
    return out;
  },

  card(p) {
    const out = p.stock <= 0;
    const tint = (p.name.length % 5) + 1;
    const tagCls = p.tag ? `card__tag--${p.tag.toLowerCase()}` : '';
    const altText = p.image_alt || p.name;
    return `
      <div class="card">
        <a class="card__link" href="product.html?slug=${encodeURIComponent(p.slug)}">
          <div class="card__media" style="background:var(--t${tint});">
            <img src="${KE.img(p.img)}" alt="${KE.esc(altText)}"
                 loading="lazy" decoding="async" width="500" height="500"
                 onerror="window.KE && window.KE.imgFallback && window.KE.imgFallback(this)" />
            ${p.tag ? `<span class="card__tag ${tagCls}">${KE.esc(p.tag)}</span>` : ''}
          </div>
          <div class="card__body">
            <span class="card__brand">${KE.esc(KE.brandName(p.brand))}</span>
            <h3 class="card__name">${KE.esc(p.name)}</h3>
            ${p.rating ? `<span class="card__rating"><span class="star">★</span> ${p.rating} <span>(${p.reviews||0})</span></span>` : ''}
            <div class="card__price">
              <span class="money">${KE.money(p.price)}</span>
              ${p.compare_at_price ? `<del>${KE.money(p.compare_at_price)}</del>` : ''}
            </div>
          </div>
        </a>
        <div class="card__foot">
          <button class="btn btn--primary btn--sm" type="button" data-add="${KE.esc(p.slug)}" ${out ? 'disabled' : ''}>
            ${out ? 'Sold out' : 'Add to cart'}
          </button>
        </div>
      </div>`;
  },

  renderEmpty() {
    const root = document.getElementById('cartRoot');
    const cross = KE.PRODUCTS.slice(0, 4);
    root.innerHTML = `
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep" aria-hidden="true">/</span><strong>Cart</strong>
      </nav>
      <div class="cart-empty">
        <div class="cart-empty__icon">${ICON.cartEmpty}</div>
        <h2>Your cart is empty</h2>
        <p>Browse our accessories and add a few items to get started.</p>
        <a class="btn btn--primary" href="shop.html">Start shopping</a>
      </div>
      <div class="crosssell">
        <h2>Popular right now</h2>
        <div class="crosssell-grid">
          ${cross.map(p => this.card(p)).join('')}
        </div>
      </div>`;
    this.hideBar();
  },

  render() {
    const notices = this.reconcile();
    const lines = KE.cart.lines();

    if (!lines.length) { this.renderEmpty(); return; }

    const totals = KE.cart.totals();
    const itemCount = totals.itemCount;

    let noticeHtml = '';
    const reduced = notices.filter(n => n.reason === 'reduced');
    if (reduced.length) {
      noticeHtml = `
        <div class="notice">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <div>
            <b>Some quantities were adjusted.</b>
            Stock changed for ${reduced.length} item${reduced.length>1?'s':''}. We updated your cart to match available stock.
          </div>
          <button type="button" data-dismiss-notice>Dismiss</button>
        </div>`;
    }

    const linesHtml = lines.map(({ product, qty }) => {
      const unit = KE.unitPrice(product, qty);
      const lineTotal = unit * qty;
      const savePerUnit = product.price - unit;
      const hint = this.tierHint(product, qty);
      const tint = (product.name.length % 5) + 1;
      return `
        <div class="line" data-slug="${KE.esc(product.slug)}">
          <a class="line__media" href="product.html?slug=${encodeURIComponent(product.slug)}" style="background:var(--t${tint});">
            <img src="${KE.img(product.img, 200)}" alt="${KE.esc(product.image_alt || product.name)}"
                 loading="lazy" decoding="async"
                 onerror="window.KE && window.KE.imgFallback && window.KE.imgFallback(this)" />
          </a>
          <div class="line__body">
            <div class="line__brand">${KE.esc(KE.brandName(product.brand))}</div>
            <h3 class="line__name"><a href="product.html?slug=${encodeURIComponent(product.slug)}">${KE.esc(product.name)}</a></h3>
            ${product.sku ? `<div class="line__sku">SKU ${KE.esc(product.sku)}</div>` : ''}
            <div class="line__unit">
              ${KE.money(unit)} each
              ${savePerUnit > 0 ? `<span class="save">You save ${KE.money(savePerUnit)}/unit</span>` : ''}
            </div>
            ${hint ? `<div class="line__hint">${KE.esc(hint)}</div>` : ''}
          </div>
          <div class="line__actions">
            <div class="line__qty" role="group" aria-label="Quantity for ${KE.esc(product.name)}">
              <button type="button" data-line-minus ${qty <= 1 ? 'disabled' : ''} aria-label="Decrease quantity">−</button>
              <input type="number" value="${qty}" min="1" max="${product.stock}" data-line-input aria-label="Quantity" />
              <button type="button" data-line-plus ${qty >= product.stock ? 'disabled' : ''} aria-label="Increase quantity">+</button>
            </div>
            <div class="line__total">${KE.money(lineTotal)}</div>
            <button type="button" class="line__remove" data-line-remove aria-label="Remove ${KE.esc(product.name)}">Remove</button>
          </div>
        </div>`;
    }).join('');

    const savingsHtml = totals.savings > 0 ? `
      <div class="summary__row summary__row--save">
        <span class="label">Wholesale savings</span>
        <span class="value">−${KE.money(totals.savings)}</span>
      </div>` : '';

    const summaryHtml = `
      <aside class="summary" aria-label="Order summary">
        <h3>Order summary</h3>
        <div class="summary__row">
          <span class="label">Subtotal (${itemCount} item${itemCount>1?'s':''})</span>
          <span class="value">${KE.money(totals.subtotal)}</span>
        </div>
        ${savingsHtml}
        <div class="summary__row summary__row--delivery">
          <span class="label">Delivery</span>
          <span class="value">Calculated at checkout</span>
        </div>
        <div class="summary__note">
          Delivery fee depends on your location. We'll calculate it at checkout using our current rates.
          <a href="delivery.html">See delivery info →</a>
        </div>
        <div class="summary__total">
          <span class="label">Subtotal due now</span>
          <span class="value">${KE.money(totals.subtotal)}</span>
        </div>
        <a class="btn-checkout" href="checkout.html">
          Proceed to checkout
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a class="summary__keep" href="shop.html">Continue shopping</a>
        <ul class="summary__trust">
          <li>${ICON.shield}<span>Secure checkout</span></li>
          <li>${ICON.truck}<span>Fast dispatch within 24 hours</span></li>
          <li>${ICON.file}<span>Invoice emailed with every order</span></li>
        </ul>
      </aside>`;

    const cross = this.crosssell();
    const crossHtml = cross.length ? `
      <div class="crosssell">
        <h2>You may also like</h2>
        <div class="crosssell-grid">
          ${cross.map(p => this.card(p)).join('')}
        </div>
      </div>` : '';

    document.getElementById('cartRoot').innerHTML = `
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep" aria-hidden="true">/</span><strong>Cart</strong>
      </nav>

      <div class="cart-head">
        <div>
          <h1>Your cart</h1>
          <p>Review your items and proceed to checkout when ready.</p>
        </div>
        <button class="cart-head__clear" type="button" id="clearCart">Clear cart</button>
      </div>

      ${noticeHtml}

      <div class="cart-layout">
        <div class="cart-lines" id="cartLines">
          ${linesHtml}
        </div>
        ${summaryHtml}
      </div>

      ${crossHtml}
    `;

    this.updateBar(totals.subtotal, itemCount);
    this.bindLines();
  },

  bindLines() {
    const host = document.getElementById('cartLines');
    if (!host) return;

    host.addEventListener('click', e => {
      const line = e.target.closest('[data-slug]');
      if (!line) return;
      const slug = line.getAttribute('data-slug');
      const p = KE.findProduct(slug);
      if (!p) return;
      const cur = KE.cart.items()[slug] || 0;

      if (e.target.closest('[data-line-minus]')) {
        KE.cart.setQty(slug, cur - 1);
        this.render();
        return;
      }
      if (e.target.closest('[data-line-plus]')) {
        if (cur >= p.stock) { KE.toast(`Only ${p.stock} in stock`, 'warn'); return; }
        KE.cart.setQty(slug, cur + 1);
        this.render();
        return;
      }
      if (e.target.closest('[data-line-remove]')) {
        KE.cart.remove(slug);
        KE.toast('Removed from cart');
        this.render();
        return;
      }
    });

    host.addEventListener('change', e => {
      const input = e.target.closest('[data-line-input]');
      if (!input) return;
      const line = input.closest('[data-slug]');
      const slug = line.getAttribute('data-slug');
      const p = KE.findProduct(slug);
      if (!p) return;
      let n = parseInt(input.value, 10) || 1;
      n = Math.max(1, Math.min(n, p.stock));
      KE.cart.setQty(slug, n);
      this.render();
    });
  },

  updateBar(subtotal, count) {
    const bar = document.getElementById('checkoutBar');
    if (!bar) return;
    if (!count) { bar.style.display = 'none'; document.body.classList.remove('has-checkout-bar'); return; }
    bar.style.display = 'grid';
    document.body.classList.add('has-checkout-bar');
    const totalEl = document.getElementById('barTotal');
    if (totalEl) totalEl.textContent = KE.money(subtotal);
  },

  hideBar() {
    const bar = document.getElementById('checkoutBar');
    if (bar) bar.style.display = 'none';
    document.body.classList.remove('has-checkout-bar');
  }
};

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const addBtn = e.target.closest('[data-add]');
  if (addBtn) {
    e.preventDefault();
    e.stopPropagation();
    const slug = addBtn.getAttribute('data-add');
    const p = KE.findProduct(slug);
    if (!p || p.stock <= 0) return;
    const cur = KE.cart.items()[slug] || 0;
    if (cur >= p.stock) { KE.toast(`Only ${p.stock} in stock`, 'warn'); return; }
    KE.cart.add(slug, 1);
    KE.toast('Added to cart', 'good', { href:'cart.html', label:'View cart →' });
    CT.render();
    return;
  }

  if (e.target.closest('#clearCart')) {
    if (confirm('Clear all items from your cart?')) {
      KE.cart.clear();
      KE.toast('Cart cleared');
      CT.render();
    }
    return;
  }

  if (e.target.closest('[data-dismiss-notice]')) {
    const notice = e.target.closest('.notice');
    if (notice) notice.remove();
    return;
  }
});

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  renderHeader();
  renderFooter();
  updateCartBadge();
  bindDrawer();
  bindHeaderSticky();
  CT.render();
  document.addEventListener('cart:updated', updateCartBadge);
});
</script>
</body>
</html>
