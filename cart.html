<style>
/* ============================================================
   TOKENS — identical to index.html
   ============================================================ */
:root{--brand:#0A5DFF;--brand-2:#1E7BFF;--brand-spark:#4D9FFF;--brand-soft:#E8F1FF;--brand-soft-2:#F4F8FF;--brand-ink:#001F4B;--wa:#25D366;--wa-2:#1EBE5D;--bg:#F5F6FA;--bg-2:#FFFFFF;--surface:#FFFFFF;--surface-2:#F2F3F8;--surface-3:#E9EBF2;--ink:#0E1020;--ink-2:#2A2F42;--muted:#5F6579;--line:#E4E6EE;--line-2:#D2D5DF;--good:#16A34A;--warn:#D97706;--danger:#DC2626;--t1:#EEF0F7;--t2:#E8F1FF;--t3:#E8F2F6;--t4:#F7EFF4;--t5:#F7F2E6;--topbar-line:#E4ECF5;--topbar-ink:#5F6579;--topbar-ink-strong:#001F4B;--nav-ink:#3A3F55;--search-border:#DCE4EE;--fs-11:11px;--fs-12:12px;--fs-13:13px;--fs-14:14px;--fs-15:15px;--fs-16:16px;--fs-18:18px;--fs-22:22px;--fs-28:28px;--fs-display:clamp(28px,5vw,52px);--fs-h2:clamp(20px,2.6vw,30px);--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;--sp-16:64px;--radius-card:16px;--radius-ctrl:12px;--radius-pill:999px;--gutter:16px;--maxw:1280px;--font-display:'Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--shadow-sm:0 1px 3px rgba(15,23,42,.06);--shadow-md:0 6px 20px rgba(15,23,42,.08);--shadow-lg:0 20px 50px rgba(15,23,42,.12)}
@media (min-width:760px){:root{--gutter:24px}}
[data-theme="dark"]{--brand:#4D9FFF;--brand-2:#6DB0FF;--brand-spark:#6DB0FF;--brand-soft:#0D2A5C;--brand-soft-2:#0A2148;--brand-ink:#E8F1FF;--bg:#0B0B14;--bg-2:#0F0F1A;--surface:#14141F;--surface-2:#1B1B29;--surface-3:#232333;--ink:#F4F5F8;--ink-2:#C7CBD6;--muted:#8A90A2;--line:#262637;--line-2:#33334A;--topbar-line:#262637;--topbar-ink:#8A90A2;--topbar-ink-strong:#F4F5F8;--nav-ink:#C7CBD6;--search-border:#33334A;--t1:#1B1B2E;--t2:#0D2A5C;--t3:#182B3A;--t4:#2F1F2E;--t5:#2B2418}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:170px;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-15);line-height:1.55;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:clip;overflow-wrap:anywhere;padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
@supports not (overflow:clip){body{overflow-x:hidden}}
img,svg{max-width:100%;display:block}
h1,h2,h3,h4,h5{font-family:var(--font-display);font-weight:800;line-height:1.15;margin:0 0 var(--sp-3);letter-spacing:-0.02em;color:var(--ink);overflow-wrap:break-word}
h1{font-size:var(--fs-display);font-weight:900}
h2{font-size:var(--fs-h2)}
h3{font-size:var(--fs-22)}
p{margin:0 0 var(--sp-3);color:var(--ink-2);overflow-wrap:break-word}
a{color:var(--brand);text-decoration:none;transition:color .15s ease}
a:hover{color:var(--brand-2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum" 1}
.muted{color:var(--muted)}
[data-placeholder]{opacity:.55;cursor:not-allowed;pointer-events:none;text-decoration:line-through;text-decoration-color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}
.skip-link{position:absolute;left:8px;top:-60px;z-index:20000;background:var(--brand);color:#fff;padding:10px 16px;border-radius:0 0 10px 10px;font-weight:700;font-size:14px;transition:top .15s ease}
.skip-link:focus{top:0;color:#fff}

/* ============================================================
   HEADER — identical to index.html
   ============================================================ */
#siteHeader{position:sticky;position:-webkit-sticky;top:0;z-index:9999;background:#FFFFFF;transition:box-shadow .2s ease}
[data-theme="dark"] #siteHeader{background:#0F0F1A}
#siteHeader:not(.is-stuck){box-shadow:0 1px 0 var(--topbar-line)}
#siteHeader.is-stuck{box-shadow:0 1px 0 var(--topbar-line),0 8px 24px rgba(10,93,255,.10)}
.j-topbar{background:#FFFFFF;color:var(--topbar-ink);border-bottom:1px solid var(--topbar-line);height:36px;display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:0.06em}
[data-theme="dark"] .j-topbar{background:#0F0F1A}
.j-topbar__inner{display:flex;align-items:center;justify-content:space-between;gap:22px;width:100%}
.j-topbar__links,.j-topbar__right{display:flex;align-items:center;gap:18px}
.j-topbar a{color:var(--topbar-ink);display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;transition:color .15s ease;white-space:nowrap}
.j-topbar a:hover{color:var(--brand);text-decoration:none}
.j-topbar a.is-current{color:var(--brand)}
.j-topbar__sep{width:1px;height:12px;background:var(--topbar-line);display:inline-block;flex:0 0 1px}
.j-topbar__cart{color:var(--brand)!important;background:var(--brand-soft);padding:4px 10px;border-radius:6px;font-weight:700}
.j-topbar__cart:hover{background:var(--brand-soft-2)}
.j-topbar__cart .count{font-family:var(--font-mono)}
@media (max-width:900px){.j-topbar__links>*:not(:first-child){display:none}}
@media (max-width:640px){.j-topbar{font-size:10.5px;letter-spacing:0.04em}.j-topbar__links>a:nth-of-type(n+3),.j-topbar__links>.j-topbar__sep:nth-of-type(n+2){display:none}.j-topbar__right>a:not(:first-child):not(.j-topbar__cart),.j-topbar__right>.j-topbar__sep{display:none}.j-topbar__links,.j-topbar__right{gap:12px}}
.j-main{background:#FFFFFF;border-bottom:1px solid var(--topbar-line);padding-block:14px}
[data-theme="dark"] .j-main{background:#0F0F1A}
.j-main__inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:26px}
@media (max-width:900px){.j-main__inner{grid-template-columns:auto 1fr;gap:14px}}
.j-brand{display:flex;align-items:center;color:var(--topbar-ink-strong);text-decoration:none;min-width:0}
.j-brand:hover{color:var(--topbar-ink-strong);text-decoration:none}
.j-brand__logo{height:68px;width:auto;max-width:100%;display:block;flex-shrink:0;transition:transform .2s ease}
.j-brand:hover .j-brand__logo{transform:scale(1.02)}
[data-theme="dark"] .j-brand__logo{filter:brightness(0) invert(1)}
[data-theme="dark"] .j-brand__logo text{fill:#FFFFFF!important}
[data-theme="dark"] .j-brand__logo path[stroke],[data-theme="dark"] .j-brand__logo rect[stroke]{stroke:#FFFFFF!important}
[data-theme="dark"] .j-brand__logo .k-gradient{fill:#4D9FFF}
@media (max-width:900px){.j-brand__logo{height:58px}}
@media (max-width:640px){.j-brand__logo{height:50px}}
@media (max-width:380px){.j-brand__logo{height:44px}}
.j-search{display:flex;align-items:stretch;height:46px;background:#FFFFFF;border:1px solid var(--search-border);border-radius:12px;overflow:hidden;min-width:0;transition:border-color .15s ease,box-shadow .15s ease}
[data-theme="dark"] .j-search{background:#1B1B29}
.j-search:hover{border-color:#C7DCFF}
.j-search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(10,93,255,.10)}
.j-search svg{align-self:center;margin-left:16px;color:var(--brand);flex:0 0 18px;opacity:.85}
.j-search input{flex:1;border:0;outline:0;background:transparent;padding:0 14px;font-size:14px;min-width:0;color:var(--ink)}
.j-search input::placeholder{color:#9A9DB0}
.j-search button{background:var(--brand);color:#fff;border:0;padding:0 28px;font-weight:700;font-size:13.5px;letter-spacing:0.02em;cursor:pointer;white-space:nowrap;transition:background .15s ease}
.j-search button:hover{background:#0A5DFF}
@media (max-width:640px){.j-search button{padding:0 16px;font-size:13px}.j-search svg{margin-left:12px}}
.j-actions{display:flex;align-items:center;gap:6px;white-space:nowrap}
@media (max-width:900px){.j-actions{grid-column:1/-1;justify-content:space-between;gap:4px;margin-top:4px}}
.j-action{display:inline-flex;align-items:center;gap:8px;color:var(--nav-ink);font-weight:600;font-size:13.5px;padding:9px 12px;border-radius:10px;transition:color .15s ease,background .15s ease;position:relative}
.j-action:hover{color:var(--brand);background:var(--brand-soft);text-decoration:none}
.j-action svg{flex:0 0 20px;color:currentColor}
.j-cart{position:relative;background:var(--brand);color:#fff!important;padding:10px 16px;border-radius:10px;box-shadow:0 2px 8px rgba(10,93,255,.22);transition:background .15s ease,transform .1s ease,box-shadow .15s ease}
.j-cart:hover{background:#0A5DFF;color:#fff!important;transform:translateY(-1px);box-shadow:0 4px 14px rgba(10,93,255,.32)}
.j-cart:active{transform:translateY(0)}
.j-cart .icon-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#FFFFFF;color:var(--brand);font-family:var(--font-mono);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--brand);box-shadow:0 1px 4px rgba(10,93,255,.25)}
.j-cart .icon-badge[hidden]{display:none}
.j-menu-btn{display:none;width:44px;height:44px;border:1px solid var(--search-border);background:#FFFFFF;border-radius:10px;align-items:center;justify-content:center;cursor:pointer;color:var(--nav-ink);transition:border-color .15s ease,color .15s ease,background .15s ease}
[data-theme="dark"] .j-menu-btn{background:#1B1B29}
.j-menu-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
@media (max-width:900px){.j-menu-btn{display:inline-flex}}
.j-cats{background:#FFFFFF;border-bottom:1px solid var(--topbar-line)}
[data-theme="dark"] .j-cats{background:#0F0F1A}
.j-cats__scroll{display:flex;align-items:center;gap:4px;padding-block:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.j-cats__scroll::-webkit-scrollbar{display:none}
.j-cats a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;color:var(--nav-ink);font-size:13px;font-weight:600;letter-spacing:-0.005em;white-space:nowrap;border-radius:8px;transition:color .15s ease,background .15s ease}
.j-cats a:hover{color:var(--brand);background:var(--brand-soft);text-decoration:none}
.j-cats a svg{flex:0 0 18px;color:currentColor;opacity:.85}
.j-cats a .chev{flex:0 0 12px;width:12px;height:12px;margin-left:2px;opacity:.55;transition:opacity .15s ease,transform .15s ease}
.j-cats a:hover .chev{opacity:1;transform:translateY(1px)}
@media (max-width:640px){.j-cats a{padding:7px 11px;font-size:12.5px;gap:6px}.j-cats a .chev{width:11px;height:11px}}
.drawer{position:fixed;inset:0;z-index:10000;display:none}
.drawer[data-open="true"]{display:block}
.drawer__scrim{position:absolute;inset:0;background:rgba(0,31,75,.45);backdrop-filter:blur(2px)}
.drawer__panel{position:absolute;top:0;left:0;bottom:0;width:min(320px,88vw);background:#FFFFFF;border-right:1px solid var(--topbar-line);box-shadow:0 20px 50px rgba(10,93,255,.12);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3);overflow-y:auto;transform:translateX(-100%);animation:drawer-in .2s ease forwards}
[data-theme="dark"] .drawer__panel{background:#0F0F1A}
@keyframes drawer-in{to{transform:translateX(0)}}
.drawer__close{align-self:flex-end;width:40px;height:40px;border:1px solid var(--search-border);background:#FFFFFF;border-radius:10px;cursor:pointer;color:var(--nav-ink);transition:border-color .15s ease,color .15s ease,background .15s ease;display:grid;place-items:center}
[data-theme="dark"] .drawer__close{background:#1B1B29}
.drawer__close:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.drawer__nav{display:flex;flex-direction:column;gap:2px;margin-top:var(--sp-3)}
.drawer__link{display:flex;align-items:center;padding:12px;border-radius:10px;color:var(--nav-ink);font-weight:600;font-size:15px;transition:color .15s ease,background .15s ease}
.drawer__link:hover{background:var(--brand-soft);color:var(--brand)}
.drawer__link[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.drawer__group{display:flex;flex-direction:column}
.drawer__toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-radius:10px;color:var(--nav-ink);font-weight:600;font-size:15px;background:transparent;border:0;cursor:pointer;text-align:left;width:100%;font-family:var(--font-body);transition:color .15s ease,background .15s ease}
.drawer__toggle:hover{background:var(--brand-soft);color:var(--brand)}
.drawer__toggle[aria-expanded="true"]{background:var(--brand-soft);color:var(--brand)}
.drawer__toggle .chev{flex:0 0 auto;opacity:.6;transition:transform .2s ease,opacity .15s ease}
.drawer__toggle[aria-expanded="true"] .chev{transform:rotate(180deg);opacity:1}
.drawer__sub-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;overflow:hidden}
.drawer__sub-list.is-open{grid-template-rows:1fr}
.drawer__sub-list>div{overflow:hidden;display:flex;flex-direction:column;gap:2px}
.drawer__sub{display:block;padding:9px 12px 9px 26px;border-radius:8px;color:var(--topbar-ink);font-weight:500;font-size:14px;transition:color .15s ease,background .15s ease}
.drawer__sub:hover{background:var(--brand-soft);color:var(--brand)}
.drawer__sub--nested{padding-left:42px;font-size:13.5px}
.drawer__sub--all{padding-left:26px;color:var(--brand);font-weight:600;margin-top:2px}
@media (max-width:900px){.j-main__inner{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand actions" "search search";gap:10px 12px;align-items:center}.j-brand{grid-area:brand;min-width:0}.j-search{grid-area:search;height:44px}.j-actions{grid-area:actions;grid-column:auto;justify-content:flex-end;gap:4px;margin-top:0;min-width:0}}
@media (max-width:640px){.j-actions .j-action:not(.j-cart){display:none}}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:44px;padding:11px 22px;border-radius:var(--radius-ctrl);border:1px solid transparent;background:var(--surface);color:var(--ink);font-family:var(--font-body);font-weight:600;font-size:var(--fs-14);line-height:1;cursor:pointer;text-decoration:none;transition:transform .08s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn--primary{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(10,93,255,.22)}
.btn--primary:hover{background:linear-gradient(135deg,#0A5DFF 0%,#1E7BFF 100%);color:#fff;box-shadow:0 6px 20px rgba(10,93,255,.32)}
.btn--outline{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn--outline:hover{border-color:var(--brand);color:var(--brand)}
.btn--lg{min-height:50px;padding:14px 26px;font-size:var(--fs-15)}
.btn--block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn[aria-disabled="true"]:hover{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);box-shadow:0 4px 14px rgba(10,93,255,.22)}

/* ============================================================
   FOOTER — identical to index.html
   ============================================================ */
.site-footer{margin-top:var(--sp-12);background:var(--bg-2);border-top:1px solid var(--line);padding-block:var(--sp-12) var(--sp-6);padding-bottom:calc(var(--sp-6) + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:var(--fs-14)}
.site-footer__grid{display:grid;gap:var(--sp-8);grid-template-columns:1fr}
@media (min-width:760px){.site-footer__grid{grid-template-columns:1.6fr 1fr 1fr 1fr}}
.site-footer h5{color:var(--ink);font-size:var(--fs-13);font-weight:700;margin-bottom:var(--sp-4);text-transform:uppercase;letter-spacing:0.06em}
.site-footer a{display:block;padding:5px 0;color:var(--muted);font-size:var(--fs-14)}
.site-footer a:hover{color:var(--brand)}
.site-footer a.footer-inline{display:inline;padding:0}
.site-footer__brand{display:flex;align-items:center;margin-bottom:var(--sp-4)}
.site-footer__brand-col{min-width:0}
.site-footer__tagline{font-size:var(--fs-13);color:var(--muted);margin:0 0 var(--sp-4);line-height:1.55;max-width:38ch}
.site-footer__contact{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.site-footer__contact li{display:flex;align-items:flex-start;gap:10px;font-size:var(--fs-13);color:var(--muted);line-height:1.5}
.site-footer__contact li>svg{flex:0 0 14px;margin-top:3px;color:var(--brand);opacity:.85}
.site-footer__contact li>span,.site-footer__contact li>a{display:inline;padding:0;color:var(--ink-2);font-weight:600;font-size:var(--fs-13);line-height:1.5}
.site-footer__contact li>a:hover{color:var(--brand)}
.site-footer__logo{height:80px;width:auto;max-width:280px;display:block}
[data-theme="dark"] .site-footer__logo{filter:brightness(0) invert(1)}
[data-theme="dark"] .site-footer__logo text{fill:#FFFFFF!important}
[data-theme="dark"] .site-footer__logo path[stroke],[data-theme="dark"] .site-footer__logo rect[stroke]{stroke:#FFFFFF!important}
[data-theme="dark"] .site-footer__logo .k-gradient{fill:#4D9FFF}
@media (max-width:760px){.site-footer__logo{height:65px}}
.site-footer__bottom{margin-top:var(--sp-10);padding-top:var(--sp-4);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:var(--sp-3);justify-content:space-between;align-items:center;font-size:var(--fs-12)}
.site-footer__pay{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pay-badge{padding:6px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink);letter-spacing:0.02em}

/* ============================================================
   WHATSAPP FLOAT
   ============================================================ */
.wa-float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:1500;display:inline-flex;align-items:center;gap:10px;padding:12px 20px 12px 12px;background:#25D366;color:#fff;border-radius:var(--radius-pill);text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 14px 32px rgba(37,211,102,.40),0 4px 10px rgba(0,0,0,.10);transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
.wa-float:hover{transform:translateY(-2px) scale(1.02);background:#1EBE5D;box-shadow:0 20px 42px rgba(37,211,102,.5),0 6px 14px rgba(0,0,0,.15);color:#fff}
.wa-float__icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:0 0 36px}

KE.img = (id, w = 400) => {
  if (!id) return KE.PLACEHOLDER_IMG;
  if (id.startsWith('http') || id.startsWith('data:') || id.startsWith('/') || id.startsWith('assets/')) return id;
  return `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=70`;
};

KE.findProduct = slug => KE.PRODUCTS.find(p => p.slug === slug) || null;
KE.findBrand = slug => KE.BRANDS.find(b => b.slug === slug) || null;
KE.brandName = slug => KE.findBrand(slug)?.name || slug;

KE.getPackages = function(product) {
  if (!product) return [];
  const stock = Math.max(0, Number(product.stock) || 0);
  const cartonSize = Number(product.cartonSize) || 0;
  const halfSize = Number(product.halfCartonSize) || (cartonSize > 0 ? Math.ceil(cartonSize / 2) : 0);
  const halfPrice = Number(product.halfCartonPrice) || 0;
  const fullPrice = Number(product.fullCartonPrice) || 0;
  const packs = [];

  packs.push({
    key: 'unit', label: 'Single Unit', sublabel: '1 item',
    unitsPerPackage: 1, totalPrice: product.price, perUnit: product.price,
    savePct: 0, available: stock >= 1,
    disabledReason: stock < 1 ? 'Out of stock' : null
  });

  if (halfSize > 0 && halfPrice > 0) {
    const retail = product.price * halfSize;
    packs.push({
      key: 'half-pack', label: 'Half Pack', sublabel: halfSize + ' items',
      unitsPerPackage: halfSize, totalPrice: halfPrice,
      perUnit: Math.round(halfPrice / halfSize),
      savePct: retail > 0 ? Math.max(0, Math.round((1 - halfPrice / retail) * 100)) : 0,
      available: stock >= halfSize,
      disabledReason: stock < halfSize ? `Only ${stock} in stock — need ${halfSize} for this pack` : null
    });
  } else {
    packs.push({
      key: 'half-pack', label: 'Half Pack',
      sublabel: halfSize > 0 ? halfSize + ' items' : 'Size not configured',
      unitsPerPackage: halfSize, totalPrice: 0, perUnit: 0, savePct: 0, available: false,
      disabledReason: 'Package not configured yet — available once admin sets size and price'
    });
  }

  if (cartonSize > 0 && fullPrice > 0) {
    const retail = product.price * cartonSize;
    packs.push({
      key: 'full-pack', label: 'Full Pack', sublabel: cartonSize + ' items',
      unitsPerPackage: cartonSize, totalPrice: fullPrice,
      perUnit: Math.round(fullPrice / cartonSize),
      savePct: retail > 0 ? Math.max(0, Math.round((1 - fullPrice / retail) * 100)) : 0,
      available: stock >= cartonSize,
      disabledReason: stock < cartonSize ? `Only ${stock} in stock — need ${cartonSize} for this pack` : null
    });
  } else {
    packs.push({
      key: 'full-pack', label: 'Full Pack',
      sublabel: cartonSize > 0 ? cartonSize + ' items' : 'Size not configured',
      unitsPerPackage: cartonSize, totalPrice: 0, perUnit: 0, savePct: 0, available: false,
      disabledReason: 'Package not configured yet — available once admin sets size and price'
    });
  }
  return packs;
};

KE.cart = (function(){
  const KEY = 'kaka:cart:v2';
  const OLD_KEY = 'kaka:cart:v1';
  const OLD_PKG = 'kaka:cart:packages:v1';

  const read = () => {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY)) || {};
      return Array.isArray(raw.lines) ? raw : { lines: [] };
    } catch { return { lines: [] }; }
  };
  const write = data => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
    document.dispatchEvent(new CustomEvent('cart:updated'));
  };
  const unitsInLine  = l => (Number(l.qtyPacks) || 0) * (Number(l.unitsPerPackage) || 0);
  const lineTotalVal = l => (Number(l.qtyPacks) || 0) * (Number(l.pricePerPackage) || 0);

  const migrateLegacy = () => {
    let oldCart = {}, oldPkgs = {};
    try {
      oldCart = JSON.parse(localStorage.getItem(OLD_KEY)) || {};
      oldPkgs = JSON.parse(localStorage.getItem(OLD_PKG)) || {};
    } catch { return; }
    const slugList = Object.keys(oldCart);
    if (!slugList.length) return;

    const data = read();
    if (data.lines.length > 0) {
      try { localStorage.removeItem(OLD_KEY); localStorage.removeItem(OLD_PKG); } catch {}
      return;
    }
    for (const slug of slugList) {
      const qty = Number(oldCart[slug]) || 0;
      if (qty <= 0) continue;
      const product = KE.findProduct(slug);
      if (!product) continue;
      const livePkgs = KE.getPackages(product);
      const hint = oldPkgs[slug];
      let migrated = false;
      if (hint && hint.key) {
        const livePkg = livePkgs.find(pk => pk.key === hint.key);
        if (livePkg && livePkg.available && livePkg.unitsPerPackage > 0 && livePkg.totalPrice > 0) {
          const packs = Math.max(1, Math.floor(qty / livePkg.unitsPerPackage));
          data.lines.push({
            id: slug + '::' + livePkg.key, slug,
            pkgKey: livePkg.key, pkgLabel: livePkg.label,
            unitsPerPackage: livePkg.unitsPerPackage,
            pricePerPackage: livePkg.totalPrice, qtyPacks: packs
          });
          migrated = true;
        }
      }
      if (!migrated) {
        data.lines.push({
          id: slug + '::pending::' + Date.now() + Math.random().toString(36).slice(2, 6), slug,
          pkgKey: null, pkgLabel: null, unitsPerPackage: 0, pricePerPackage: 0, qtyPacks: 0
        });
      }
    }
    write(data);
    try { localStorage.removeItem(OLD_KEY); localStorage.removeItem(OLD_PKG); } catch {}
  };

  const reconcileStock = () => {
    const data = read();
    let clamped = 0;
    const stockUsed = {};
    for (const line of data.lines) {
      if (!line.pkgKey) continue;
      const product = KE.findProduct(line.slug);
      if (!product) continue;
      const used = stockUsed[line.slug] || 0;
      const availableUnits = Math.max(0, product.stock - used);
      const upp = Number(line.unitsPerPackage) || 0;
      const maxPacks = upp > 0 ? Math.floor(availableUnits / upp) : 0;
      if (maxPacks >= 1 && line.qtyPacks > maxPacks) {
        line.qtyPacks = maxPacks;
        clamped++;
      }
      stockUsed[line.slug] = used + (line.qtyPacks * upp);
    }
    if (clamped > 0) write(data);
    return clamped;
  };

  return {
    migrateLegacy,
    reconcileStock,
    lines: () => read().lines,
    count: () => read().lines.reduce((s, l) => {
      if (!l.pkgKey) return s + 1;
      const u = unitsInLine(l);
      return s + (u > 0 ? u : 0);
    }, 0),
    subtotal: () => read().lines.reduce((s, l) => s + lineTotalVal(l), 0),
    hasPending: () => read().lines.some(l => !l.pkgKey),
    unitsOf(slug) {
      return read().lines.filter(l => l.slug === slug).reduce((s, l) => s + unitsInLine(l), 0);
    },
    addPending(slug) {
      const p = KE.findProduct(slug);
      if (!p || p.stock <= 0) return false;
      const data = read();
      if (data.lines.some(l => l.slug === slug && !l.pkgKey)) return true;
      if (this.unitsOf(slug) >= p.stock) return false;
      data.lines.push({
        id: slug + '::pending::' + Date.now() + Math.random().toString(36).slice(2, 6), slug,
        pkgKey: null, pkgLabel: null, unitsPerPackage: 0, pricePerPackage: 0, qtyPacks: 0
      });
      write(data);
      return true;
    },
    setPackage(lineId, pkgKey) {
      const data = read();
      const line = data.lines.find(l => l.id === lineId);
      if (!line) return { ok: false, reason: 'Line not found' };
      const product = KE.findProduct(line.slug);
      if (!product) return { ok: false, reason: 'Product not found' };

      const pkgs = KE.getPackages(product);
      const pkg = pkgs.find(pk => pk.key === pkgKey);
      if (!pkg) return { ok: false, reason: 'Package not found' };
      if (!pkg.available) return { ok: false, reason: pkg.disabledReason || 'Package unavailable' };

      const upp = pkg.unitsPerPackage;
      if (!upp || upp < 1) return { ok: false, reason: 'Package size unknown' };
      if (pkg.totalPrice == null || pkg.totalPrice <= 0) return { ok: false, reason: 'Package price not configured' };

      const otherUnits = data.lines
        .filter(l => l.slug === line.slug && l.id !== lineId)
        .reduce((s, l) => s + unitsInLine(l), 0);
      if (otherUnits + upp > product.stock) {
        return { ok: false, reason: `Only ${product.stock - otherUnits} unit(s) available for this product` };
      }

      const existing = data.lines.find(l => l.slug === line.slug && l.pkgKey === pkg.key && l.id !== lineId);
      if (existing) {
        existing.qtyPacks += 1;
        data.lines = data.lines.filter(l => l.id !== lineId);
      } else {
        line.pkgKey = pkg.key;
        line.pkgLabel = pkg.label;
        line.unitsPerPackage = upp;
        line.pricePerPackage = pkg.totalPrice;
        line.qtyPacks = 1;
        line.id = line.slug + '::' + pkg.key;
      }
      write(data);
      return { ok: true };
    },
    setQtyPacks(lineId, qtyPacks) {
      const data = read();
      const line = data.lines.find(l => l.id === lineId);
      if (!line || !line.pkgKey) return { ok: false, reason: 'Line is not ready' };
      const product = KE.findProduct(line.slug);
      if (!product) return { ok: false, reason: 'Product not found' };

      const n = Math.max(1, Math.floor(Number(qtyPacks) || 1));
      const upp = Number(line.unitsPerPackage) || 0;
      if (upp < 1) return { ok: false, reason: 'Package size unknown' };

      const otherUnits = data.lines
        .filter(l => l.slug === line.slug && l.id !== lineId)
        .reduce((s, l) => s + unitsInLine(l), 0);
      const totalUnits = otherUnits + n * upp;
      if (totalUnits > product.stock) {
        return { ok: false, reason: `Only ${product.stock - otherUnits} unit(s) available for this line` };
      }
      line.qtyPacks = n;
      write(data);
      return { ok: true };
    },
    remove(lineId) {
      const data = read();
      data.lines = data.lines.filter(l => l.id !== lineId);
      write(data);
    },
    clear() {
      write({ lines: [] });
      try { localStorage.removeItem(OLD_KEY); localStorage.removeItem(OLD_PKG); } catch {}
    }
  };
})();

KE.toast = function(msg, kind = '', action){
  const stack = document.getElementById('toastStack'); if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
  if (action && action.href && action.label) {
    const a = document.createElement('a'); a.href = action.href; a.textContent = action.label;
    el.appendChild(a);
  }
  stack.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s ease, transform .2s ease';
    el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 240);
  }, 2600);
};

function buildDrawerNav(){
  let html = `
    <a href="shop.html" class="drawer__link">Shop all products</a>

    <a href="shop.html?sort=new" class="drawer__link">New Arrivals</a>`;
  KE.CATEGORIES.filter(c => c.published).sort((a,b) => a.order - b.order).forEach(cat => {
    const subs = (cat.children || []).filter(c => c.published);
    if (!subs.length) {
      html += `<a href="shop.html?cat=${encodeURIComponent(cat.slug)}" class="drawer__link">${KE.esc(cat.name)}</a>`;
      return;
    }
    const groupId = 'drawer-group-' + cat.slug;
    const subLinks = subs.map(sub => {
      const nested = (sub.children || []).filter(c => c.published);
      return `<a class="drawer__sub" href="shop.html?type=${encodeURIComponent(sub.slug)}">${KE.esc(sub.name)}</a>
        ${nested.map(n => `<a class="drawer__sub drawer__sub--nested" href="shop.html?type=${encodeURIComponent(n.slug)}">${KE.esc(n.name)}</a>`).join('')}`;
    }).join('');
    html += `<div class="drawer__group">
      <button type="button" class="drawer__toggle" aria-expanded="false" aria-controls="${groupId}">
        <span>${KE.esc(cat.name)}</span>${ICON.chevron}

        <a class="drawer__sub drawer__sub--all" href="shop.html?cat=${encodeURIComponent(cat.slug)}">View all ${KE.esc(cat.name)} →</a>
      </div></div>
    </div>`;
  });
  html += `
    <a href="store-location.html" class="drawer__link">Visit our store</a>
    <a href="track-order.html" class="drawer__link">Track order</a>
    <a href="warranty.html" class="drawer__link">Warranty &amp; claims</a>
    <a href="return.html" class="drawer__link">Returns &amp; refunds</a>
    <a href="cart.html" class="drawer__link" aria-current="page">Cart</a>`;
  return html;
}

  const n = KE.cart.count();

    if (n > 0) { b.hidden = false; b.textContent = n > 99 ? '99+' : String(n); }
    else { b.hidden = true; b.textContent = '0'; }
  }
  const link = document.getElementById('topbarCartLink');
  const sep = document.getElementById('topbarCartSep');
  const cnt = document.getElementById('topbarCartCount');
  if (link && cnt && sep){
    if (n > 0){

      cnt.textContent = n > 99 ? '99+' : String(n);

function bindDrawer(){
  const drawer = document.getElementById('navDrawer');
  const openBtn = document.getElementById('menuBtn');
  if (!drawer || !openBtn) return;
  const open = () => {
    drawer.setAttribute('data-open','true');
    openBtn.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
  };
  const close = () => {
    drawer.setAttribute('data-open','false');
    openBtn.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
  };
  openBtn.addEventListener('click', open);
  drawer.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  drawer.querySelectorAll('.drawer__toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const isOpen = btn.getAttribute('aria-expanded') === 'true';
      const list = document.getElementById(btn.getAttribute('aria-controls'));
      btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      if (list) list.classList.toggle('is-open', !isOpen);
    });
  });
  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.getAttribute('data-open') === 'true') close();
  });
}

function bindHeaderSticky(){
  const header = document.getElementById('siteHeader'); if (!header) return;
  const onScroll = () => {
    if (window.scrollY > 4) header.classList.add('is-stuck');
    else header.classList.remove('is-stuck');
  };
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
}

/* ============================================================
   CART PAGE (logic preserved 1:1)
   ============================================================ */
const CartPage = {
  state: { highlightedSlug: null, highlightedLineId: null },

  init() {
    try { KE.cart.migrateLegacy(); } catch {}
    const clamped = KE.cart.reconcileStock();
    this.readHighlight();
    this.render();
    this.bindGlobal();
    if (clamped > 0) {
      setTimeout(() => KE.toast(`${clamped} cart line${clamped > 1 ? 's' : ''} reduced to available stock`, 'warn'), 300);
    }
  },

  readHighlight() {
    const hash = location.hash || '';
    if (hash.startsWith('#line-')) {
      this.state.highlightedLineId = decodeURIComponent(hash.slice(6));
    } else if (hash.startsWith('#item-')) {
      this.state.highlightedSlug = decodeURIComponent(hash.slice(6));
    }
    try {
      const last = sessionStorage.getItem('kaka:cart:lastAdded');
      if (last && !this.state.highlightedSlug && !this.state.highlightedLineId) {
        this.state.highlightedSlug = last;
      }
      sessionStorage.removeItem('kaka:cart:lastAdded');
    } catch {}
  },

  clearHighlight() {
    if (this.state.highlightedSlug || this.state.highlightedLineId) {
      this.state.highlightedSlug = null;
      this.state.highlightedLineId = null;
      if (location.hash) {
        try { history.replaceState(null, '', location.pathname + location.search); } catch {}
      }
    }
  },

  availableFor(line) {
    const product = KE.findProduct(line.slug);
    if (!product) return 0;
    const used = KE.cart.unitsOf(line.slug) - ((line.qtyPacks || 0) * (line.unitsPerPackage || 0));
    return Math.max(0, product.stock - Math.max(0, used));
  },

  analyze() {
    const lines = KE.cart.lines();
    const pending = lines.filter(l => !l.pkgKey);
    const invalid = [];
    for (const line of lines) {
      if (!line.pkgKey) continue;
      const product = KE.findProduct(line.slug);
      if (!product) { invalid.push({ line, reason: 'Product no longer available' }); continue; }
      const totalForProduct = KE.cart.unitsOf(line.slug);
      if (totalForProduct > product.stock) {
        invalid.push({ line, reason: `Exceeds stock (${product.stock})` });
      }
      if (!line.qtyPacks || line.qtyPacks < 1) {
        invalid.push({ line, reason: 'Quantity invalid' });
      }
      if (!line.unitsPerPackage || !line.pricePerPackage) {
        invalid.push({ line, reason: 'Package data missing' });
      }
    }
    return { pending, invalid, canCheckout: lines.length > 0 && pending.length === 0 && invalid.length === 0 };
  },

  render() {
    const lines = KE.cart.lines();
    const root = document.getElementById('cartRoot');
    const subtitle = document.getElementById('cartSubtitle');

    if (!lines.length) {
      subtitle.textContent = 'Your cart is empty.';
      this.renderEmpty(root);
      return;
    }
    const analysis = this.analyze();
    if (analysis.pending.length) {
      subtitle.textContent = analysis.pending.length === 1
        ? 'One item needs a package selected before checkout.'
        : `${analysis.pending.length} items need a package selected before checkout.`;
    } else if (analysis.invalid.length) {
      subtitle.textContent = 'Some items need attention before checkout.';
    } else {
      subtitle.textContent = 'Review your items and proceed when ready.';
    }
    this.renderFull(root, lines, analysis);
  },

  renderEmpty(root) {
    root.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty__icon">${ICON.cart}</div>
        <h2>Your cart is empty</h2>
        <p>Add products from the shop to start your order.</p>
        <div class="cart-empty__actions">
          <a class="btn btn--primary btn--lg" href="shop.html">Shop now ${ICON.arrowRight}</a>
          <a class="btn btn--outline btn--lg" href="index.html">Back to home</a>
        </div>
      </div>`;
  },

  renderFull(root, lines, analysis) {
    const subtotal = KE.cart.subtotal();
    const warnMsg = analysis.pending.length
      ? `Select a package for ${analysis.pending.length === 1 ? '1 item' : analysis.pending.length + ' items'} to enable checkout.`
      : (analysis.invalid.length
        ? `${analysis.invalid.length} item${analysis.invalid.length > 1 ? 's need' : ' needs'} attention before checkout.`
        : '');

    root.innerHTML = `
      <div class="cart-layout">
        <section class="cart-items" aria-label="Cart items">
          ${lines.map(line => this.renderLine(line)).join('')}
        </section>

        <aside class="cart-summary" aria-label="Order summary">
          <h2>Order summary</h2>
          <div class="summary-rows">
            <div class="summary-row">
              <span class="label">Subtotal</span>
              <span class="value">${KE.money(subtotal)}</span>
            </div>
            <div class="summary-row">
              <span class="label">Delivery</span>
              <span class="value muted">Calculated at checkout</span>
            </div>
            ${warnMsg ? `<p class="summary-hint summary-hint--warn">${ICON.warn}<span>${KE.esc(warnMsg)}</span></p>` : ''}
            <div class="summary-row summary-row--total">
              <span class="label">Total (before delivery)</span>
              <span class="value">${KE.money(subtotal)}</span>
            </div>
            <p class="summary-hint">Final delivery fee is added at checkout based on your address.</p>
          </div>

          <div class="cart-summary__actions">
            <button class="btn btn--primary btn--lg btn--block" type="button"
                    id="checkoutBtn" ${analysis.canCheckout ? '' : 'aria-disabled="true"'}>
              Proceed to Checkout ${ICON.arrowRight}
            </button>
            <a class="btn btn--outline btn--block" href="shop.html">
              ${ICON.arrowLeft} Continue Shopping
            </a>
          </div>

          <p class="cart-summary__secure">
            ${ICON.lock} Secure checkout · Delivery &amp; payment confirmed on WhatsApp
          </p>
        </aside>
      </div>`;

    if (this.state.highlightedLineId || this.state.highlightedSlug) {
      let el = null;
      if (this.state.highlightedLineId) {
        el = root.querySelector(`[data-line-id="${CSS.escape(this.state.highlightedLineId)}"]`);
      }
      if (!el && this.state.highlightedSlug) {
        const pending = KE.cart.lines().find(l => l.slug === this.state.highlightedSlug && !l.pkgKey);
        const tid = pending ? pending.id : null;
        if (tid) el = root.querySelector(`[data-line-id="${CSS.escape(tid)}"]`);
        if (!el) el = root.querySelector(`[data-item-slug="${CSS.escape(this.state.highlightedSlug)}"]`);
      }
      if (el) {
        el.classList.add('cart-item--new');
        const y = el.getBoundingClientRect().top + window.scrollY - 200;
        window.scrollTo({ top: y < 0 ? 0 : y, behavior: 'smooth' });
        setTimeout(() => el.classList.remove('cart-item--new'), 1500);
      }
      this.clearHighlight();
    }
  },

  renderLine(line) {
    const product = KE.findProduct(line.slug);
    if (!product) return '';
    const tint = (product.name.length % 5) + 1;
    const allPkgs = KE.getPackages(product);
    const awaiting = !line.pkgKey;
    const available = this.availableFor(line);
    const lineTotal = (Number(line.qtyPacks) || 0) * (Number(line.pricePerPackage) || 0);
    const totalUnits = (Number(line.qtyPacks) || 0) * (Number(line.unitsPerPackage) || 0);

    const pkgOptionsHtml = allPkgs.map(pkg => {
      const isSelected = pkg.key === line.pkgKey;
      const fitsStock = pkg.unitsPerPackage > 0 && available >= pkg.unitsPerPackage;
      const configured = pkg.totalPrice != null && pkg.totalPrice > 0 && pkg.unitsPerPackage > 0;
      const isAvailable = configured && fitsStock && pkg.available;
      let disabledNote = '';
      if (!configured) disabledNote = pkg.disabledReason || 'Package not configured yet';
      else if (!fitsStock) disabledNote = `Not enough stock — ${available} unit${available === 1 ? '' : 's'} available for this product`;

      const priceHtml = configured
        ? `${KE.money(pkg.totalPrice)}${pkg.unitsPerPackage > 1 ? `<span class="pkg-option__per">${KE.money(pkg.perUnit)}/ea</span>` : ''}`
        : '—';
      const saveHtml = configured && pkg.savePct > 0 ? `<span class="pkg-save">−${pkg.savePct}%</span>` : '';

      return `
        <label class="pkg-option ${isSelected ? 'is-selected' : ''} ${!isAvailable ? 'is-disabled' : ''}">
          <input type="radio" name="pkg-${KE.esc(line.id)}" value="${KE.esc(pkg.key)}"
                 ${isSelected ? 'checked' : ''} ${!isAvailable ? 'disabled' : ''}
                 data-pkg-select="${KE.esc(line.id)}" data-pkg-key="${KE.esc(pkg.key)}" />
          <div class="pkg-option__info">
            <span class="pkg-option__label">${KE.esc(pkg.label)} ${saveHtml}</span>
            <span class="pkg-option__sub">${KE.esc(pkg.sublabel)}</span>
            ${disabledNote ? `<div class="pkg-option__disabled-note">${KE.esc(disabledNote)}</div>` : ''}
          </div>
          <div class="pkg-option__price">${priceHtml}</div>
        </label>`;
    }).join('');

    const pkgTag = line.pkgKey
      ? `<span class="cart-item__pkg-tag">${KE.esc(line.pkgLabel)}</span>`
      : `<span class="cart-item__awaiting">${ICON.warn} Select a package</span>`;

    const maxPacks = (line.unitsPerPackage > 0) ? Math.floor(available / line.unitsPerPackage) : 0;

    const qtyBlock = line.pkgKey
      ? `<div class="cart-item__qty">
          <span class="cart-item__qty-label">Number of ${line.unitsPerPackage === 1 ? 'units' : 'packs'}</span>
          <div class="cart-item__qty-stepper" role="group" aria-label="Adjust quantity">
            <button type="button" data-qty-minus="${KE.esc(line.id)}" aria-label="Decrease"
                    ${line.qtyPacks <= 1 ? 'disabled' : ''}>−</button>
            <span class="cart-item__qty-val" aria-live="polite">${line.qtyPacks}</span>
            <button type="button" data-qty-plus="${KE.esc(line.id)}" aria-label="Increase"
                    ${line.qtyPacks >= maxPacks ? 'disabled' : ''}>+</button>
          </div>
          <span class="cart-item__qty-hint">
            ${line.qtyPacks} × ${line.unitsPerPackage} unit${line.unitsPerPackage === 1 ? '' : 's'} = ${totalUnits} unit${totalUnits === 1 ? '' : 's'} total
          </span>
        </div>`
      : `<div class="cart-item__qty">
          <span class="cart-item__qty-label">Quantity</span>
          <span class="cart-item__empty-note">Choose a package to set quantity</span>
        </div>`;

    const totalBlock = line.pkgKey
      ? `<div class="cart-item__total">
          <span class="cart-item__total-label">Line total</span>
          <span class="cart-item__total-value">${KE.money(lineTotal)}</span>
          <span class="cart-item__total-pkg">${line.qtyPacks} × ${KE.money(line.pricePerPackage)}/pack</span>
        </div>`
      : `<div class="cart-item__total">
          <span class="cart-item__total-label">Line total</span>
          <span class="cart-item__total-value muted">—</span>
        </div>`;

    const stockLine = product.stock <= 0
      ? `<div class="cart-item__stock-warn">${ICON.warn} Out of stock</div>`
      : (product.stock <= 5
        ? `<div class="cart-item__stock-warn" style="color:var(--warn)">Only ${product.stock} left</div>`
        : '');

    return `
      <article class="cart-item ${awaiting ? 'cart-item--awaiting' : ''}"
               data-line-id="${KE.esc(line.id)}" data-item-slug="${KE.esc(line.slug)}">
        <div class="cart-item__head">
          <div class="cart-item__media" style="background:var(--t${tint});">
            <img src="${KE.img(product.img, 200)}" alt="${KE.esc(product.name)}"
                 loading="lazy" onerror="this.src='${KE.PLACEHOLDER_IMG}'" />
          </div>
          <div class="cart-item__info">
            <div class="cart-item__brand">${KE.esc(KE.brandName(product.brand))}</div>
            <h2 class="cart-item__name">${KE.esc(product.name)}</h2>
            <div class="cart-item__unit-price">Unit price: <span class="money">${KE.money(product.price)}</span></div>
            ${pkgTag}
            ${stockLine}
          </div>
          <button class="cart-item__remove" type="button"
                  data-remove="${KE.esc(line.id)}"
                  aria-label="Remove ${KE.esc(product.name)}${line.pkgLabel ? ' (' + line.pkgLabel + ')' : ''} from cart">
            ${ICON.trash}
          </button>
        </div>

        <div class="cart-item__packages">
          <div class="cart-item__packages-label">Choose purchase option</div>
          ${pkgOptionsHtml}
        </div>

        <div class="cart-item__foot">
          ${qtyBlock}
          ${totalBlock}
        </div>
      </article>`;
  },

  selectPackage(lineId, pkgKey) {
    const slug = lineId.split('::')[0];
    const res = KE.cart.setPackage(lineId, pkgKey);
    if (!res.ok) {
      KE.toast(res.reason || 'Could not select package', 'warn');
      updateCartBadge();
      this.render();
      return;
    }
    const updatedLine = KE.cart.lines().find(l => l.slug === slug && l.pkgKey === pkgKey);
    KE.toast(`Package selected${updatedLine ? ': ' + updatedLine.pkgLabel : ''}`, 'good');
    updateCartBadge();
    this.render();
  },

  changeQty(lineId, delta) {
    const line = KE.cart.lines().find(l => l.id === lineId);
    if (!line) return;
    const next = (Number(line.qtyPacks) || 0) + delta;
    if (next < 1) return;
    const res = KE.cart.setQtyPacks(lineId, next);
    if (!res.ok) { KE.toast(res.reason || 'Could not update quantity', 'warn'); return; }
    updateCartBadge();
    this.render();
  },

  removeLine(lineId) {
    const line = KE.cart.lines().find(l => l.id === lineId);
    KE.cart.remove(lineId);
    updateCartBadge();
    if (line) {
      const product = KE.findProduct(line.slug);
      KE.toast(`Removed ${product ? product.name : 'item'}${line.pkgLabel ? ' (' + line.pkgLabel + ')' : ''}`, 'good');
    }
    this.render();
  },

  bindGlobal() {
    const root = document.getElementById('cartRoot');
    if (!root) return;
    root.addEventListener('change', e => {
      const input = e.target.closest('[data-pkg-select]');
      if (!input) return;
      this.selectPackage(input.getAttribute('data-pkg-select'), input.getAttribute('data-pkg-key'));
    });
    root.addEventListener('click', e => {
      const removeBtn = e.target.closest('[data-remove]');
      if (removeBtn) { this.removeLine(removeBtn.getAttribute('data-remove')); return; }
      const minus = e.target.closest('[data-qty-minus]');
      if (minus) { this.changeQty(minus.getAttribute('data-qty-minus'), -1); return; }
      const plus = e.target.closest('[data-qty-plus]');
      if (plus) { this.changeQty(plus.getAttribute('data-qty-plus'), +1); return; }

      const checkout = e.target.closest('#checkoutBtn');
      if (checkout) {
        const analysis = this.analyze();
        if (!analysis.canCheckout) {
          let msg;
          if (analysis.pending.length > 0) {
            msg = analysis.pending.length === 1
              ? 'Choose a package for this item first'
              : `Choose a package for ${analysis.pending.length} items first`;
          } else if (analysis.invalid.length > 0) {
            msg = analysis.invalid[0].reason || 'Fix cart issues before checkout';
          } else {
            msg = 'Your cart is empty';
          }
          KE.toast(msg, 'warn');

          const targetLine = analysis.pending[0] || analysis.invalid[0]?.line;
          if (targetLine) {
            const targetEl = root.querySelector(`[data-line-id="${CSS.escape(targetLine.id)}"]`);
            if (targetEl) {
              targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
              targetEl.classList.add('cart-item--new');
              setTimeout(() => targetEl.classList.remove('cart-item--new'), 1600);
            }
          }
          return;
        }
        window.location.href = 'checkout.html';
      }
    });
    window.addEventListener('storage', e => {
      if (e.key === 'kaka:cart:v2' || e.key === 'kaka:cart:v1' || e.key === 'kaka:cart:packages:v1') {
        updateCartBadge();
        this.render();
      }
    });
    document.addEventListener('cart:updated', () => updateCartBadge());
  }
};

document.addEventListener('DOMContentLoaded', () => {
  renderHeader();
  renderFooter();
  updateCartBadge();
  bindDrawer();
  bindHeaderSticky();
  CartPage.init();
});
</script>
</body>
