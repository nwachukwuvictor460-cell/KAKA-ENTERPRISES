<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A5DFF" />
<title>Product — KAKA ENTERPRISES</title>
<meta name="description" content="Product details at KAKA ENTERPRISES — specs, wholesale pricing and delivery." />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A5DFF'/><g fill='%23FFFFFF'><rect x='7' y='5' width='6' height='22' rx='1'/><polygon points='13,13 21,5 26,5 16,15'/><polygon points='13,19 16,17 26,27 21,27'/></g><path d='M 2 24 Q 8 26, 14 21 Q 20 16, 26 10 Q 28 8, 30 6' fill='none' stroke='%234D9FFF' stroke-width='2.4' stroke-linecap='round'/><circle cx='26' cy='8' r='1.8' fill='%23FFFFFF'/></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS — unified with index.html (blue & white brand)
   ============================================================ */
:root {
  --brand:#0A5DFF; --brand-2:#1E7BFF; --brand-spark:#4D9FFF; --brand-soft:#E8F1FF;
  --brand-soft-2:#F4F8FF; --brand-ink:#001F4B;
  --wa:#25D366; --wa-2:#1EBE5D;
  --bg:#F5F6FA; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F3F8; --surface-3:#E9EBF2;
  --ink:#0E1020; --ink-2:#2A2F42; --muted:#5F6579; --line:#E4E6EE; --line-2:#D2D5DF;
  --good:#16A34A; --warn:#D97706; --danger:#DC2626;
  --t1:#EEF0F7; --t2:#E8F1FF; --t3:#E8F2F6; --t4:#F7EFF4; --t5:#F7F2E6;
  --topbar-line:#E4ECF5; --topbar-ink:#5F6579; --topbar-ink-strong:#001F4B;
  --nav-ink:#3A3F55; --search-border:#DCE4EE;
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-15:15px; --fs-16:16px;
  --fs-18:18px; --fs-22:22px; --fs-28:28px;
  --fs-display:clamp(30px,5.5vw,58px); --fs-h2:clamp(20px,2.6vw,30px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --radius-card:16px; --radius-ctrl:12px; --radius-pill:999px;
  --gutter:16px; --maxw:1280px;
  --font-display:'Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 6px 20px rgba(15,23,42,.08);
  --shadow-lg:0 20px 50px rgba(15,23,42,.12);
}
@media (min-width:760px){ :root{ --gutter:24px; } }

[data-theme="dark"]{
  --brand:#4D9FFF; --brand-2:#6DB0FF; --brand-spark:#6DB0FF;
  --brand-soft:#0D2A5C; --brand-soft-2:#0A2148; --brand-ink:#E8F1FF;
  --bg:#0B0B14; --bg-2:#0F0F1A; --surface:#14141F; --surface-2:#1B1B29; --surface-3:#232333;
  --ink:#F4F5F8; --ink-2:#C7CBD6; --muted:#8A90A2; --line:#262637; --line-2:#33334A;
  --topbar-line:#262637; --topbar-ink:#8A90A2; --topbar-ink-strong:#F4F5F8;
  --nav-ink:#C7CBD6; --search-border:#33334A;
  --t1:#1B1B2E; --t2:#0D2A5C; --t3:#182B3A; --t4:#2F1F2E; --t5:#2B2418;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:170px;overflow-x:clip;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:var(--fs-15);line-height:1.55;min-height:100dvh;-webkit-font-smoothing:antialiased;
  overflow-x:clip;padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0);}
@supports not (overflow:clip){ body{overflow-x:hidden;} }
img,svg{max-width:100%;display:block;}
h1,h2,h3,h4,h5{font-family:var(--font-display);font-weight:800;line-height:1.15;
  margin:0 0 var(--sp-3);letter-spacing:-0.02em;color:var(--ink);}
h1{font-size:var(--fs-display);font-weight:900;}
h2{font-size:var(--fs-h2);}
h3{font-size:var(--fs-22);}
h5{font-size:var(--fs-16);font-weight:700;}
p{margin:0 0 var(--sp-3);color:var(--ink-2);}
a{color:var(--brand);text-decoration:none;transition:color .15s ease;}
a:hover{color:var(--brand-2);text-decoration:none;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px;}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter);}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum" 1;}
.muted{color:var(--muted);}
[data-placeholder]{opacity:.55;cursor:not-allowed;pointer-events:none;text-decoration:line-through;text-decoration-color:var(--muted);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}

/* ============================================================
   HEADER (from index.html — identical)
   ============================================================ */
#siteHeader{position:sticky;position:-webkit-sticky;top:0;z-index:9999;background:#FFFFFF;transition:box-shadow .2s ease;}
[data-theme="dark"] #siteHeader{background:#0F0F1A;}
#siteHeader:not(.is-stuck){box-shadow:0 1px 0 var(--topbar-line);}
#siteHeader.is-stuck{box-shadow:0 1px 0 var(--topbar-line),0 8px 24px rgba(10,93,255,.10);}

.j-topbar{background:#FFFFFF;color:var(--topbar-ink);border-bottom:1px solid var(--topbar-line);
  height:36px;display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:0.06em;}
[data-theme="dark"] .j-topbar{background:#0F0F1A;}
.j-topbar__inner{display:flex;align-items:center;justify-content:space-between;gap:22px;width:100%;}
.j-topbar__links,.j-topbar__right{display:flex;align-items:center;gap:18px;}
.j-topbar a{color:var(--topbar-ink);display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;transition:color .15s ease;white-space:nowrap;}
.j-topbar a:hover{color:var(--brand);text-decoration:none;}
.j-topbar a.is-current{color:var(--brand);}
.j-topbar__sep{width:1px;height:12px;background:var(--topbar-line);display:inline-block;flex:0 0 1px;}
.j-topbar__cart{color:var(--brand)!important;background:var(--brand-soft);padding:4px 10px;border-radius:6px;font-weight:700;}
.j-topbar__cart:hover{background:var(--brand-soft-2);}
.j-topbar__cart .count{font-family:var(--font-mono);}
@media (max-width:900px){.j-topbar__links>*:not(:first-child){display:none;}}
@media (max-width:640px){
  .j-topbar{font-size:10.5px;letter-spacing:0.04em;}
  .j-topbar__links>a:nth-of-type(n+3),.j-topbar__links>.j-topbar__sep:nth-of-type(n+2){display:none;}
  .j-topbar__right>a:not(:first-child):not(.j-topbar__cart),.j-topbar__right>.j-topbar__sep{display:none;}
  .j-topbar__links,.j-topbar__right{gap:12px;}
}

.j-main{background:#FFFFFF;border-bottom:1px solid var(--topbar-line);padding-block:14px;}
[data-theme="dark"] .j-main{background:#0F0F1A;}
.j-main__inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:26px;}
@media (max-width:900px){.j-main__inner{grid-template-columns:auto 1fr;gap:14px;}}

.j-brand{display:flex;align-items:center;color:var(--topbar-ink-strong);text-decoration:none;min-width:0;}
.j-brand:hover{color:var(--topbar-ink-strong);text-decoration:none;}
.j-brand__logo{height:68px;width:auto;max-width:100%;display:block;flex-shrink:0;transition:transform .2s ease;}
.j-brand:hover .j-brand__logo{transform:scale(1.02);}
[data-theme="dark"] .j-brand__logo{filter:brightness(0) invert(1);}
[data-theme="dark"] .j-brand__logo text{fill:#FFFFFF !important;}
[data-theme="dark"] .j-brand__logo path[stroke],
[data-theme="dark"] .j-brand__logo rect[stroke]{stroke:#FFFFFF !important;}
[data-theme="dark"] .j-brand__logo .k-gradient{fill:#4D9FFF;}
@media (max-width:900px){.j-brand__logo{height:58px;}}
@media (max-width:640px){.j-brand__logo{height:50px;}}
@media (max-width:380px){.j-brand__logo{height:44px;}}

.j-search{display:flex;align-items:stretch;height:46px;background:#FFFFFF;border:1px solid var(--search-border);border-radius:12px;overflow:hidden;min-width:0;transition:border-color .15s ease,box-shadow .15s ease;}
[data-theme="dark"] .j-search{background:#1B1B29;}
.j-search:hover{border-color:#C7DCFF;}
.j-search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(10,93,255,.10);}
.j-search svg{align-self:center;margin-left:16px;color:var(--brand);flex:0 0 18px;opacity:.85;}
.j-search input{flex:1;border:0;outline:0;background:transparent;padding:0 14px;font-size:14px;min-width:0;color:var(--ink);}
.j-search input::placeholder{color:#9A9DB0;}
.j-search button{background:var(--brand);color:#fff;border:0;padding:0 28px;font-weight:700;font-size:13.5px;letter-spacing:0.02em;cursor:pointer;white-space:nowrap;transition:background .15s ease;}
.j-search button:hover{background:#0A5DFF;}
@media (max-width:640px){.j-search button{padding:0 16px;font-size:13px;}.j-search svg{margin-left:12px;}}

.j-actions{display:flex;align-items:center;gap:6px;white-space:nowrap;}
@media (max-width:900px){.j-actions{grid-column:1/-1;justify-content:space-between;gap:4px;margin-top:4px;}}
.j-action{display:inline-flex;align-items:center;gap:8px;color:var(--nav-ink);font-weight:600;font-size:13.5px;padding:9px 12px;border-radius:10px;transition:color .15s ease,background .15s ease;position:relative;}
.j-action:hover{color:var(--brand);background:var(--brand-soft);text-decoration:none;}
.j-action svg{flex:0 0 20px;color:currentColor;}
.j-cart{position:relative;background:var(--brand);color:#fff!important;padding:10px 16px;border-radius:10px;box-shadow:0 2px 8px rgba(10,93,255,.22);transition:background .15s ease,transform .1s ease,box-shadow .15s ease;}
.j-cart:hover{background:#0A5DFF;color:#fff!important;transform:translateY(-1px);box-shadow:0 4px 14px rgba(10,93,255,.32);}
.j-cart:active{transform:translateY(0);}
.j-cart .icon-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#FFFFFF;color:var(--brand);font-family:var(--font-mono);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--brand);box-shadow:0 1px 4px rgba(10,93,255,.25);}
.j-cart .icon-badge[hidden]{display:none;}

.j-menu-btn{display:none;width:44px;height:44px;border:1px solid var(--search-border);background:#FFFFFF;border-radius:10px;align-items:center;justify-content:center;cursor:pointer;color:var(--nav-ink);transition:border-color .15s ease,color .15s ease,background .15s ease;}
[data-theme="dark"] .j-menu-btn{background:#1B1B29;}
.j-menu-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);}
@media (max-width:900px){.j-menu-btn{display:inline-flex;}}

.j-cats{background:#FFFFFF;border-bottom:1px solid var(--topbar-line);}
[data-theme="dark"] .j-cats{background:#0F0F1A;}
.j-cats__scroll{display:flex;align-items:center;gap:4px;padding-block:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;}
.j-cats__scroll::-webkit-scrollbar{display:none;}
.j-cats a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;color:var(--nav-ink);font-size:13px;font-weight:600;letter-spacing:-0.005em;white-space:nowrap;border-radius:8px;transition:color .15s ease,background .15s ease;}
.j-cats a:hover{color:var(--brand);background:var(--brand-soft);text-decoration:none;}
.j-cats a svg{flex:0 0 18px;color:currentColor;opacity:.85;}
.j-cats a .chev{flex:0 0 12px;width:12px;height:12px;margin-left:2px;opacity:.55;transition:opacity .15s ease,transform .15s ease;}
.j-cats a:hover .chev{opacity:1;transform:translateY(1px);}
@media (max-width:640px){.j-cats a{padding:7px 11px;font-size:12.5px;gap:6px;}.j-cats a .chev{width:11px;height:11px;}}

.drawer{position:fixed;inset:0;z-index:10000;display:none;}
.drawer[data-open="true"]{display:block;}
.drawer__scrim{position:absolute;inset:0;background:rgba(0,31,75,.45);backdrop-filter:blur(2px);}
.drawer__panel{position:absolute;top:0;left:0;bottom:0;width:min(320px,88vw);background:#FFFFFF;border-right:1px solid var(--topbar-line);box-shadow:0 20px 50px rgba(10,93,255,.12);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3);overflow-y:auto;transform:translateX(-100%);animation:drawer-in .2s ease forwards;}
[data-theme="dark"] .drawer__panel{background:#0F0F1A;}
@keyframes drawer-in{to{transform:translateX(0);}}
.drawer__close{align-self:flex-end;width:40px;height:40px;border:1px solid var(--search-border);background:#FFFFFF;border-radius:10px;cursor:pointer;color:var(--nav-ink);transition:border-color .15s ease,color .15s ease,background .15s ease;}
[data-theme="dark"] .drawer__close{background:#1B1B29;}
.drawer__close:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);}
.drawer__nav{display:flex;flex-direction:column;gap:2px;margin-top:var(--sp-3);}
.drawer__link{display:flex;align-items:center;padding:12px 12px;border-radius:10px;color:var(--nav-ink);font-weight:600;font-size:15px;transition:color .15s ease,background .15s ease;}
.drawer__link:hover{background:var(--brand-soft);color:var(--brand);}
.drawer__group{display:flex;flex-direction:column;}
.drawer__toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px;border-radius:10px;color:var(--nav-ink);font-weight:600;font-size:15px;background:transparent;border:0;cursor:pointer;text-align:left;width:100%;font-family:var(--font-body);transition:color .15s ease,background .15s ease;}
.drawer__toggle:hover{background:var(--brand-soft);color:var(--brand);}
.drawer__toggle[aria-expanded="true"]{background:var(--brand-soft);color:var(--brand);}
.drawer__toggle .chev{flex:0 0 auto;opacity:.6;transition:transform .2s ease,opacity .15s ease;}
.drawer__toggle[aria-expanded="true"] .chev{transform:rotate(180deg);opacity:1;}
.drawer__sub-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;overflow:hidden;}
.drawer__sub-list.is-open{grid-template-rows:1fr;}
.drawer__sub-list>div{overflow:hidden;display:flex;flex-direction:column;gap:2px;}
.drawer__sub{display:block;padding:9px 12px 9px 26px;border-radius:8px;color:var(--topbar-ink);font-weight:500;font-size:14px;transition:color .15s ease,background .15s ease;}
.drawer__sub:hover{background:var(--brand-soft);color:var(--brand);}
.drawer__sub--nested{padding-left:42px;font-size:13.5px;}
.drawer__sub--all{padding-left:26px;color:var(--brand);font-weight:600;margin-top:2px;}

/* ============================================================
   PRODUCT PAGE — preserved from original product.html
   ============================================================ */
.product-page{padding-block:var(--sp-5) var(--sp-12);}

.breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--fs-13);color:var(--muted);margin-bottom:var(--sp-5);}
.breadcrumb a{color:var(--muted);}
.breadcrumb a:hover{color:var(--brand);}
.breadcrumb span.sep{opacity:.5;}
.breadcrumb strong{color:var(--ink);font-weight:600;}

.product-layout{display:grid;gap:var(--sp-8);grid-template-columns:1fr;align-items:start;}
@media (min-width:900px){.product-layout{grid-template-columns:1fr 1fr;gap:var(--sp-10);}}
@media (min-width:1200px){.product-layout{grid-template-columns:1.1fr 1fr;gap:var(--sp-12);}}

.gallery{display:flex;flex-direction:column;gap:var(--sp-3);}
.gallery__main{position:relative;aspect-ratio:1/1;border-radius:var(--radius-card);overflow:hidden;border:1px solid var(--line);background:var(--t1);}
.gallery__main img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
.gallery__main:hover img{transform:scale(1.04);}
.gallery__tag{position:absolute;top:14px;left:14px;padding:6px 12px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#fff;}
.gallery__tag--sale{background:var(--danger);}
.gallery__tag--new{background:var(--good);}
.gallery__tag--popular{background:var(--brand);color:#fff;}
.gallery__thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.gallery__thumb{aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--t1);padding:0;}
.gallery__thumb.is-active{border-color:var(--brand);}
.gallery__thumb img{width:100%;height:100%;object-fit:cover;}

.info{display:flex;flex-direction:column;gap:var(--sp-4);}
.info__brand{display:inline-flex;align-items:center;gap:8px;color:var(--brand);font-size:var(--fs-13);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;text-decoration:none;width:fit-content;}
.info__brand:hover{color:var(--brand-2);}
.info h1{font-size:clamp(22px,3vw,32px);font-weight:800;margin:0;}
.info__rating{display:flex;align-items:center;gap:8px;font-size:var(--fs-13);color:var(--muted);}
.info__rating .stars{color:var(--brand-spark);letter-spacing:1px;}
.info__price-row{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap;}
.info__price{font-size:clamp(24px,3vw,32px);font-weight:900;color:var(--ink);font-family:var(--font-display);letter-spacing:-0.02em;}
.info__was{font-size:var(--fs-16);color:var(--muted);text-decoration:line-through;}
.info__save{font-size:var(--fs-13);font-weight:700;color:var(--good);background:color-mix(in srgb, var(--good) 12%, transparent);padding:3px 10px;border-radius:8px;}
.info__stock{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-13);color:var(--good);font-weight:600;}
.info__stock.is-low{color:var(--warn);}
.info__stock.is-out{color:var(--danger);}
.info__stock .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
.info__desc{color:var(--muted);font-size:var(--fs-14);line-height:1.7;margin:0;}

.actions{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:stretch;}
.btn--buy{flex:1;min-width:180px;min-height:52px;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border:0;border-radius:var(--radius-ctrl);font-weight:700;font-size:var(--fs-15);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn--buy:hover{background:linear-gradient(135deg,#0A5DFF 0%,#1E7BFF 100%);color:#fff;}
.btn--buy:disabled{opacity:.6;cursor:not-allowed;}
.btn--outline-lg{min-height:52px;padding-inline:20px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--radius-ctrl);font-weight:600;font-size:var(--fs-14);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn--outline-lg:hover{border-color:var(--brand);color:var(--brand);}
.btn--wa{min-height:52px;padding-inline:20px;background:#25D366;color:#fff;border:0;border-radius:var(--radius-ctrl);font-weight:600;font-size:var(--fs-14);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
.btn--wa:hover{background:#1EBE5D;color:#fff;}
.btn--wa svg{width:20px;height:20px;}

.cart-hint{display:flex;align-items:flex-start;gap:8px;font-size:var(--fs-12);color:var(--muted);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 20%,var(--line));padding:10px 12px;border-radius:10px;line-height:1.5;}
.cart-hint svg{flex:0 0 16px;color:var(--brand);margin-top:1px;}

.delivery-note{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-ctrl);padding:var(--sp-4);font-size:var(--fs-13);color:var(--ink-2);}
.delivery-note svg{color:var(--brand);flex:0 0 20px;margin-top:2px;}
.delivery-note b{color:var(--ink);}

.tiers{border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden;background:var(--surface);}
.tiers__head{display:flex;align-items:center;gap:10px;padding:var(--sp-4) var(--sp-5);background:linear-gradient(135deg,#E8F1FF 0%,#F4F8FF 100%);border-bottom:1px solid var(--line);}
.tiers__head svg{color:var(--brand);}

/* ---------- HELPERS ---------- */
KE.money = n => '₦' + (Number(n) || 0).toLocaleString('en-NG', { maximumFractionDigits: 0 });
KE.esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
KE.img = (id, w = 900) => {
  if (!id) return '';
  if (id.startsWith('assets/') || id.startsWith('http')) return id;
  return `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=75`;
};
KE.findProduct = slug => KE.PRODUCTS.find(p => p.slug === slug) || null;
KE.findBrand = slug => KE.BRANDS.find(b => b.slug === slug) || null;
KE.brandName = slug => KE.findBrand(slug)?.name || slug;

KE.findCategory = function (slug, list = KE.CATEGORIES){
  for (const c of list) {
    if (c.slug === slug) return c;
    if (c.children?.length) { const f = KE.findCategory(slug, c.children); if (f) return f; }
  }
  return null;
};
KE.productsInCategory = cat => KE.PRODUCTS.filter(p => p.categoryPath.includes(cat));

/* ----------------------------------------------------------------
   KE.getPackages — same behaviour as before
   ---------------------------------------------------------------- */
KE.getPackages = function(product) {
  if (!product) return [];
  const stock = Math.max(0, Number(product.stock) || 0);
  const cartonSize = Number(product.cartonSize) || 0;
  const halfSize = Number(product.halfCartonSize) || (cartonSize > 0 ? Math.ceil(cartonSize / 2) : 0);
  const halfPrice = Number(product.halfCartonPrice) || 0;
  const fullPrice = Number(product.fullCartonPrice) || 0;
  const packs = [];

  packs.push({
    key: 'unit', label: 'Single Unit', sublabel: '1 item',
    unitsPerPackage: 1, totalPrice: product.price, perUnit: product.price,
    savePct: 0, available: stock >= 1,
    disabledReason: stock < 1 ? 'Out of stock' : null
  });

  if (halfSize > 0 && halfPrice > 0) {
    const retail = product.price * halfSize;
    packs.push({
      key: 'half-pack', label: 'Half Pack', sublabel: halfSize + ' items',
      unitsPerPackage: halfSize, totalPrice: halfPrice,
      perUnit: Math.round(halfPrice / halfSize),
      savePct: retail > 0 ? Math.max(0, Math.round((1 - halfPrice / retail) * 100)) : 0,
      available: stock >= halfSize,
      disabledReason: stock < halfSize ? `Only ${stock} in stock — need ${halfSize} for this pack` : null
    });
  } else {
    packs.push({
      key: 'half-pack', label: 'Half Pack',
      sublabel: halfSize > 0 ? halfSize + ' items' : 'Size not configured',
      unitsPerPackage: halfSize, totalPrice: 0, perUnit: 0, savePct: 0, available: false,
      disabledReason: 'Package not configured yet — available once admin sets size and price'
    });
  }

  if (cartonSize > 0 && fullPrice > 0) {
    const retail = product.price * cartonSize;
    packs.push({
      key: 'full-pack', label: 'Full Pack', sublabel: cartonSize + ' items',
      unitsPerPackage: cartonSize, totalPrice: fullPrice,
      perUnit: Math.round(fullPrice / cartonSize),
      savePct: retail > 0 ? Math.max(0, Math.round((1 - fullPrice / retail) * 100)) : 0,
      available: stock >= cartonSize,
      disabledReason: stock < cartonSize ? `Only ${stock} in stock — need ${cartonSize} for this pack` : null
    });
  } else {
    packs.push({
      key: 'full-pack', label: 'Full Pack',
      sublabel: cartonSize > 0 ? cartonSize + ' items' : 'Size not configured',
      unitsPerPackage: cartonSize, totalPrice: 0, perUnit: 0, savePct: 0, available: false,
      disabledReason: 'Package not configured yet — available once admin sets size and price'
    });
  }
  return packs;
};

/* ----------------------------------------------------------------
   KE.cart — v2 (unchanged)
   ---------------------------------------------------------------- */
KE.cart = (function(){
  const KEY = 'kaka:cart:v2';
  const OLD_KEY = 'kaka:cart:v1';
  const OLD_PKG = 'kaka:cart:packages:v1';
  const read = () => {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY)) || {};
      return Array.isArray(raw.lines) ? raw : { lines: [] };
    } catch { return { lines: [] }; }
  };
  const write = data => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
    document.dispatchEvent(new CustomEvent('cart:updated'));
  };
  const unitsInLine = l => (Number(l.qtyPacks) || 0) * (Number(l.unitsPerPackage) || 0);

  const migrateLegacy = () => {
    let oldCart = {}, oldPkgs = {};
    try {
      oldCart = JSON.parse(localStorage.getItem(OLD_KEY)) || {};
      oldPkgs = JSON.parse(localStorage.getItem(OLD_PKG)) || {};
    } catch { return; }
    const slugList = Object.keys(oldCart);
    if (!slugList.length) return;
    const data = read();
    if (data.lines.length > 0) {
      try { localStorage.removeItem(OLD_KEY); localStorage.removeItem(OLD_PKG); } catch {}
      return;
    }
    for (const slug of slugList) {
      const qty = Number(oldCart[slug]) || 0;
      if (qty <= 0) continue;
      const product = KE.findProduct(slug);
      if (!product) continue;
      const livePkgs = KE.getPackages(product);
      const hint = oldPkgs[slug];
      let migrated = false;
      if (hint && hint.key) {
        const livePkg = livePkgs.find(pk => pk.key === hint.key);
        if (livePkg && livePkg.available && livePkg.unitsPerPackage > 0 && livePkg.totalPrice > 0) {
          const packs = Math.max(1, Math.floor(qty / livePkg.unitsPerPackage));
          data.lines.push({
            id: slug + '::' + livePkg.key, slug,
            pkgKey: livePkg.key, pkgLabel: livePkg.label,
            unitsPerPackage: livePkg.unitsPerPackage,
            pricePerPackage: livePkg.totalPrice, qtyPacks: packs
          });
          migrated = true;
        }
      }
      if (!migrated) {
        data.lines.push({
          id: slug + '::pending::' + Date.now() + Math.random().toString(36).slice(2, 6), slug,
          pkgKey: null, pkgLabel: null, unitsPerPackage: 0, pricePerPackage: 0, qtyPacks: 0
        });
      }
    }
    write(data);
    try { localStorage.removeItem(OLD_KEY); localStorage.removeItem(OLD_PKG); } catch {}
  };

  return {
    migrateLegacy,
    lines: () => read().lines,
    count: () => read().lines.reduce((s, l) => {
      if (!l.pkgKey) return s + 1;
      const u = unitsInLine(l);
      return s + (u > 0 ? u : 0);
    }, 0),
    unitsOf(slug) {
      return read().lines.filter(l => l.slug === slug).reduce((s, l) => s + unitsInLine(l), 0);
    },
    addPending(slug) {
      const p = KE.findProduct(slug);
      if (!p || p.stock <= 0) return false;
      const data = read();
      if (data.lines.some(l => l.slug === slug && !l.pkgKey)) return true;
      if (this.unitsOf(slug) >= p.stock) return false;
      data.lines.push({
        id: slug + '::pending::' + Date.now() + Math.random().toString(36).slice(2, 6), slug,
        pkgKey: null, pkgLabel: null, unitsPerPackage: 0, pricePerPackage: 0, qtyPacks: 0
      });
      write(data);
      return true;
    }
  };
})();

KE.toast = function(msg, kind = ''){
  const stack = document.getElementById('toastStack'); if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s ease, transform .2s ease';
    el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 240);
  }, 2200);
};

function buildDrawerNav(){
  let html = `
    <a href="shop.html" class="drawer__link">Shop all products</a>
    <a href="shop.html?tag=Sale" class="drawer__link">Deals</a>
    <a href="shop.html?sort=new" class="drawer__link">New Arrivals</a>`;
  KE.CATEGORIES.filter(c => c.published).sort((a,b) => a.order - b.order).forEach(cat => {
    const subs = (cat.children || []).filter(c => c.published);
    if (!subs.length) {
      html += `<a href="shop.html?cat=${encodeURIComponent(cat.slug)}" class="drawer__link">${KE.esc(cat.name)}</a>`;
      return;
    }
    const groupId = 'drawer-group-' + cat.slug;
    const subLinks = subs.map(sub => {
      const nested = (sub.children || []).filter(c => c.published);
      return `<a class="drawer__sub" href="shop.html?type=${encodeURIComponent(sub.slug)}">${KE.esc(sub.name)}</a>
        ${nested.map(n => `<a class="drawer__sub drawer__sub--nested" href="shop.html?type=${encodeURIComponent(n.slug)}">${KE.esc(n.name)}</a>`).join('')}`;
    }).join('');
    html += `
      <div class="drawer__group">
        <button type="button" class="drawer__toggle" aria-expanded="false" aria-controls="${groupId}">
          <span>${KE.esc(cat.name)}</span>
          ${ICON.chevron}

        <div class="drawer__sub-list" id="${groupId}">
          <div>${subLinks}<a class="drawer__sub drawer__sub--all" href="shop.html?cat=${encodeURIComponent(cat.slug)}">View all ${KE.esc(cat.name)} →</a></div>
        </div>

  });
  html += `

    <a href="track-order.html" class="drawer__link">Track order</a>
    <a href="cart.html" class="drawer__link">Cart</a>`;
  return html;
}

function updateCartBadge(){
  const n = KE.cart.count();
  const b = document.getElementById('cartBadge');
  if (b) {
    if (n > 0) { b.hidden = false; b.textContent = n > 99 ? '99+' : String(n); }

  }
  const link = document.getElementById('topbarCartLink');

  const cnt  = document.getElementById('topbarCartCount');
  if (link && cnt && sep) {

      sep.style.display  = 'inline-block';
      cnt.textContent = n > 99 ? '99+' : String(n);

function bindHeaderSearch(){
  const el = document.querySelector('#q');
  if (!el) return;
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = el.value.trim();
      if (q) location.href = 'shop.html?q=' + encodeURIComponent(q);
    }
  });
}

function bindDrawer(){
  const drawer = document.getElementById('navDrawer');
  const openBtn = document.getElementById('menuBtn');
  if (!drawer || !openBtn) return;
  let lastFocused = null;
  const open = () => {
    lastFocused = document.activeElement;
    drawer.setAttribute('data-open','true');
    openBtn.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
    const closeBtn = drawer.querySelector('.drawer__close');
    if (closeBtn) closeBtn.focus();
  };
  const close = () => {
    drawer.setAttribute('data-open','false');
    openBtn.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
  };
  openBtn.addEventListener('click', open);
  drawer.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  drawer.querySelectorAll('.drawer__toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const isOpen = btn.getAttribute('aria-expanded') === 'true';
      const listId = btn.getAttribute('aria-controls');
      const list = listId ? document.getElementById(listId) : null;
      btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      if (list) list.classList.toggle('is-open', !isOpen);
    });
  });
  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.getAttribute('data-open') === 'true') close();
  });
}

function bindHeaderSticky(){
  const header = document.getElementById('siteHeader');
  if (!header) return;
  const onScroll = () => {
    if (window.scrollY > 4) header.classList.add('is-stuck');
    else header.classList.remove('is-stuck');
  };
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
}

/* ============================================================
   PRODUCT PAGE RENDER (preserved from original)
   ============================================================ */
const PR = {
  state: { product: null, galleryIndex: 0 },

  readSlug() {
    const p = new URLSearchParams(location.search);
    return p.get('slug') || '';
  },

  renderNotFound() {
    const root = document.getElementById('productRoot');
    root.innerHTML = `
      <div class="not-found">
        <div class="not-found__icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <h1>We can't find that product</h1>
        <p>It may have been removed, or the link is broken.</p>
        <a class="btn btn--primary" href="shop.html">Back to the shop</a>
      </div>`;
    document.title = 'Not found — KAKA ENTERPRISES';
  },

  renderBreadcrumb(product) {
    const parts = ['<a href="index.html">Home</a>', '<span class="sep">/</span>', '<a href="shop.html">Shop</a>'];
    product.categoryPath.forEach((slug, idx) => {
      const cat = KE.findCategory(slug);
      if (!cat) return;
      parts.push('<span class="sep">/</span>');
      const isLast = idx === product.categoryPath.length - 1;
      if (isLast) parts.push(`<strong>${KE.esc(cat.name)}</strong>`);
      else parts.push(`<a href="shop.html?type=${encodeURIComponent(slug)}">${KE.esc(cat.name)}</a>`);
    });
    return `<nav class="breadcrumb" aria-label="Breadcrumb">${parts.join('')}</nav>`;
  },

  tagClass(tag) {
    if (!tag) return '';
    const t = tag.toLowerCase();
    if (t === 'sale') return 'gallery__tag--sale';
    if (t === 'new')  return 'gallery__tag--new';
    return 'gallery__tag--popular';
  },

  stars(rating) {
    const full = Math.floor(rating);
    const half = rating - full >= .5;
    let out = '';
    for (let i = 0; i < full; i++) out += '★';
    if (half) out += '⯪';
    while (out.length < 5) out += '☆';
    return out;
  },

  stockInfo(product) {
    if (product.stock <= 0) return { text: 'Out of stock', cls: 'is-out' };
    if (product.stock < 5) return { text: `Low stock: only ${product.stock} left`, cls: 'is-low' };
    return { text: `In stock (${product.stock} available)`, cls: '' };
  },

  related(product, limit = 4) {
    const type = product.categoryPath[product.categoryPath.length - 1];
    const cat  = product.categoryPath[0];
    const seen = new Set([product.slug]);
    const out = [];
    KE.PRODUCTS.forEach(p => {
      if (out.length >= limit) return;
      if (seen.has(p.slug)) return;
      if (p.categoryPath.includes(type)) { out.push(p); seen.add(p.slug); }
    });
    KE.PRODUCTS.forEach(p => {
      if (out.length >= limit) return;
      if (seen.has(p.slug)) return;
      if (p.categoryPath.includes(cat)) { out.push(p); seen.add(p.slug); }
    });
    return out;
  },

  card(p) {
    const out = p.stock <= 0;
    const tint = (p.name.length % 5) + 1;
    const tagCls = p.tag ? `card__tag--${p.tag.toLowerCase()}` : '';
    return `
      <a class="card" href="product.html?slug=${encodeURIComponent(p.slug)}">
        <div class="card__media" style="background:var(--t${tint});">
          <img src="${KE.img(p.img, 400)}" alt="${KE.esc(p.name)}" loading="lazy" width="400" height="400" />
          ${p.tag ? `<span class="card__tag ${tagCls}">${KE.esc(p.tag)}</span>` : ''}
        </div>
        <div class="card__body">
          <span class="card__brand">${KE.esc(KE.brandName(p.brand))}</span>
          <h3 class="card__name">${KE.esc(p.name)}</h3>
          ${p.rating ? `<span class="card__rating"><span class="star">★</span> ${p.rating} <span>(${p.reviews||0})</span></span>` : ''}
          <div class="card__price">
            <span class="money">${KE.money(p.price)}</span>
            ${p.compare_at_price ? `<del>${KE.money(p.compare_at_price)}</del>` : ''}
          </div>
        </div>
        <div class="card__foot">
          <button class="btn btn--primary btn--sm" type="button" data-add="${KE.esc(p.slug)}" ${out ? 'disabled' : ''}>
            ${out ? 'Sold out' : 'Add to cart'}
          </button>
        </div>
      </a>`;
  },

  packRows(product) {
    const pkgs = KE.getPackages(product);
    return pkgs.map(pkg => {
      const configured = pkg.totalPrice > 0 && pkg.unitsPerPackage > 0;
      const isUnit = pkg.key === 'unit';
      const priceHtml = configured
        ? KE.money(pkg.totalPrice)
        : `<span style="color:var(--muted)">Not configured</span>`;
      const perUnitHtml = configured && pkg.unitsPerPackage > 1
        ? `<span style="display:block;font-size:11px;color:var(--muted);font-weight:500;">${KE.money(pkg.perUnit)}/ea</span>`
        : '';
      const saveHtml = configured && pkg.savePct > 0
        ? `${pkg.savePct}% off`
        : (configured && isUnit ? '—' : '');
      return `
        <tr>
          <td>${KE.esc(pkg.label)}
            <span style="display:block;font-size:11px;color:var(--muted);font-weight:500;">${KE.esc(pkg.sublabel)}</span>
          </td>
          <td class="price">${priceHtml}${perUnitHtml}</td>
          <td class="save">${saveHtml}</td>
        </tr>`;
    }).join('');
  },

  render() {
    const slug = this.readSlug();
    const product = KE.findProduct(slug);
    const root = document.getElementById('productRoot');

    if (!product) { this.renderNotFound(); this.hideSticky(); return; }

    this.state.product = product;
    this.state.galleryIndex = 0;

    document.title = product.name + ' — ' + KE.CONFIG.business.name;
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', (product.short || product.name) + ' — Buy at ' + KE.CONFIG.business.name + '.');

    const stock = this.stockInfo(product);
    const save = product.compare_at_price ? product.compare_at_price - product.price : 0;
    const savePct = save ? Math.round((save / product.compare_at_price) * 100) : 0;

    const specsRows = (product.specs || []).map(([k, v]) =>
      `<tr><th>${KE.esc(k)}</th><td>${KE.esc(v)}</td></tr>`
    ).join('') || '<tr><td colspan="2" style="text-align:center;color:var(--muted);">No specs listed</td></tr>';

    const related = this.related(product, 4);

    const waMsg = `Hi KAKA ENTERPRISES, I'd like to enquire about:\n\n• ${product.name}\n• SKU: ${product.sku || '—'}\n• Price: ${KE.money(product.price)}\n\nPlease confirm availability and delivery.`;
    const waHref = `https://wa.me/${KE.CONFIG.business.whatsapp}?text=${encodeURIComponent(waMsg)}`;

    root.innerHTML = `
      ${this.renderBreadcrumb(product)}

      <div class="product-layout">

        <div class="gallery">
          <div class="gallery__main">
            <img id="galleryMain" src="${KE.img(product.img, 900)}" alt="${KE.esc(product.name)}" />
            ${product.tag ? `<span class="gallery__tag ${this.tagClass(product.tag)}">${KE.esc(product.tag)}</span>` : ''}
          </div>
          <div class="gallery__thumbs" id="galleryThumbs">
            <button class="gallery__thumb is-active" type="button" data-idx="0"><img src="${KE.img(product.img, 200)}" alt="" /></button>
            <button class="gallery__thumb" type="button" data-idx="1"><img src="${KE.img(product.img, 200)}&sat=-20" alt="" /></button>
            <button class="gallery__thumb" type="button" data-idx="2"><img src="${KE.img(product.img, 200)}&con=10" alt="" /></button>
            <button class="gallery__thumb" type="button" data-idx="3"><img src="${KE.img(product.img, 200)}&bri=5" alt="" /></button>
          </div>
        </div>

        <div class="info">
          <a class="info__brand" href="shop.html?brand=${encodeURIComponent(product.brand)}">
            ${KE.esc(KE.brandName(product.brand))}
          </a>
          <h1>${KE.esc(product.name)}</h1>

          ${product.rating ? `
            <div class="info__rating">
              <span class="stars">${this.stars(product.rating)}</span>
              <span>${product.rating} · ${product.reviews||0} reviews</span>
            </div>` : ''}

          <div class="info__price-row">
            <span class="info__price" id="priceNow">${KE.money(product.price)}</span>
            ${product.compare_at_price ? `<span class="info__was">${KE.money(product.compare_at_price)}</span>` : ''}
            ${save ? `<span class="info__save">Save ${savePct}%</span>` : ''}
          </div>

          <div class="info__stock ${stock.cls}">
            <span class="dot"></span>
            <span>${stock.text}</span>
          </div>

          ${product.short ? `<p class="info__desc">${KE.esc(product.short)}</p>` : ''}

          <div class="actions">
            <button class="btn--buy" id="addToCart" type="button" ${product.stock <= 0 ? 'disabled' : ''}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.4 12.3a2 2 0 0 0 2 1.7h8.2a2 2 0 0 0 2-1.6L21 7H6"/></svg>
              ${product.stock <= 0 ? 'Sold out' : 'Add to cart'}
            </button>
            <a class="btn--wa" href="${waHref}" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M20.52 3.449C12.831-3.984.106 1.407.101 11.893c0 2.096.547 4.142 1.588 5.945L0 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c7.691 0 14.525-6.242 14.527-13.91.001-3.715-1.443-7.21-4.065-9.835zm-8.516 21.19h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884z"/></svg>
              Enquire on WhatsApp
            </a>
            <button class="btn--outline-lg" id="shareBtn" type="button" aria-label="Share">${ICON.share}</button>
            <button class="btn--outline-lg" id="wishBtn" type="button" aria-label="Save to wishlist">${ICON.heart}</button>
          </div>

          <div class="cart-hint">
            ${ICON.info}
            <span>You'll choose <b>Single Unit</b>, <b>Half Pack</b>, or <b>Full Pack</b> &mdash; and set quantity &mdash; on the cart page.</span>
          </div>

          <div class="delivery-note">
            ${ICON.truck}
            <div>
              <b>Delivery:</b> Free on orders over ${KE.money(KE.CONFIG.freeDeliveryFrom)}.
              Otherwise, delivery is calculated at checkout based on your state.
              Estimated dispatch within 24 hours.
            </div>
          </div>

          <div class="tiers">
            <div class="tiers__head">
              ${ICON.shield}
              <b>Pack pricing</b>
              <span>Choose your pack on the cart page</span>
            </div>
            <table class="tier-table">
              <thead><tr><th>Option</th><th>Price</th><th>Save</th></tr></thead>
              <tbody>${this.packRows(product)}</tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="section-block">
        <div class="section-block__head"><h2>Specifications</h2></div>
        <table class="specs-table"><tbody>${specsRows}</tbody></table>
      </div>

      ${related.length ? `
      <div class="section-block">
        <div class="section-block__head">
          <h2>You may also like</h2>
          <a class="btn btn--outline btn--sm" href="shop.html">See all</a>
        </div>
        <div class="related-grid">${related.map(p => this.card(p)).join('')}</div>
      </div>` : ''}
    `;

    this.bindActions(product);
    this.bindGallery(product);
    this.updateStickyPrice();
    this.watchSticky();
  },

  bindActions(product) {
    const addBtn = document.getElementById('addToCart');

    const doAddToCart = () => {
      if (product.stock <= 0) return;
      const ok = KE.cart.addPending(product.slug);
      if (!ok) { KE.toast(`Only ${product.stock} in stock`, 'warn'); return; }
      updateCartBadge();
      try { sessionStorage.setItem('kaka:cart:lastAdded', product.slug); } catch {}
      window.location.href = 'cart.html#item-' + encodeURIComponent(product.slug);
    };

    if (addBtn) addBtn.addEventListener('click', doAddToCart);

    const shareBtn = document.getElementById('shareBtn');
    if (shareBtn) shareBtn.addEventListener('click', async () => {
      const data = { title: product.name, text: product.short || product.name, url: location.href };
      if (navigator.share) { try { await navigator.share(data); } catch {} }
      else {
        try { await navigator.clipboard.writeText(location.href); KE.toast('Link copied', 'good'); }
        catch { KE.toast('Could not copy link', 'warn'); }
      }
    });

    const wishBtn = document.getElementById('wishBtn');
    if (wishBtn) wishBtn.addEventListener('click', () => KE.toast('Saved to wishlist', 'good'));

    const stickyAdd = document.getElementById('stickyAdd');
    if (stickyAdd) stickyAdd.addEventListener('click', () => addBtn.click());
  },

  bindGallery(product) {
    const thumbs = document.querySelectorAll('#galleryThumbs .gallery__thumb');
    const main = document.getElementById('galleryMain');
    thumbs.forEach(btn => {
      btn.addEventListener('click', () => {
        thumbs.forEach(t => t.classList.remove('is-active'));
        btn.classList.add('is-active');
        const idx = Number(btn.getAttribute('data-idx'));
        const suffix = ['', '&sat=-20', '&con=10', '&bri=5'][idx] || '';
        main.src = KE.img(product.img, 900) + suffix;
      });
    });
  },

  updateStickyPrice() {
    const el = document.getElementById('stickyTotal');
    if (!el || !this.state.product) return;
    el.textContent = KE.money(this.state.product.price);
  },

  hideSticky() {
    const bar = document.getElementById('stickyCart');
    if (bar) bar.classList.remove('is-visible');
    document.body.classList.remove('has-sticky-cart');
  },

  watchSticky() {
    const bar = document.getElementById('stickyCart');
    const trigger = document.getElementById('addToCart');
    if (!bar || !trigger) return;
    bar.classList.remove('is-visible');
    document.body.classList.remove('has-sticky-cart');

    const onScroll = () => {
      const rect = trigger.getBoundingClientRect();
      const past = rect.bottom < 0;
      if (past) {
        bar.classList.add('is-visible');
        bar.setAttribute('aria-hidden', 'false');
        document.body.classList.add('has-sticky-cart');
      } else {
        bar.classList.remove('is-visible');
        bar.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('has-sticky-cart');
      }
    };
    if (this._stickyHandler) window.removeEventListener('scroll', this._stickyHandler);
    this._stickyHandler = onScroll;
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  }
};

/* ============================================================
   GLOBAL add-to-cart from related products
   ============================================================ */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-add]');
  if (!btn) return;
  e.preventDefault();
  const slug = btn.getAttribute('data-add');
  const p = KE.findProduct(slug);
  if (!p || p.stock <= 0) return;
  const ok = KE.cart.addPending(slug);
  if (!ok) { KE.toast(`Only ${p.stock} in stock`, 'warn'); return; }
  updateCartBadge();
  KE.toast('Added to cart — choose a package on the cart page', 'good');
});

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  try { KE.cart.migrateLegacy(); } catch {}
  renderHeader();
  renderFooter();
  updateCartBadge();
  bindHeaderSearch();
  bindDrawer();
  bindHeaderSticky();
  PR.render();
  document.addEventListener('cart:updated', updateCartBadge);
  window.addEventListener('storage', e => { if (e.key === 'kaka:cart:v2') updateCartBadge(); });
});
</script>
</body>
</html>
